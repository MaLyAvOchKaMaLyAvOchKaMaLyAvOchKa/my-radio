/* =========================================================

}


/* =========================================================

}

.search::placeholder{

.search-clear{

    border-radius:10px;

    background:transparent;

    color:#999;

    display:none;
}

.search-clear:hover{
    background:rgba(255,255,255,.08);

}

   NAV

}

}


/* =========================================================
   MAIN
   ========================================================= */

.container{

.title-row{

}

.title{
    font-size:30px;
    font-weight:900;
}

.count{
    color:#888;

/* =========================================================
   LOADING
   ========================================================= */

.loading{
    text-align:center;

    color:#888;

    font-size:16px;
}

.spinner{
    width:34px;
    height:34px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.08);
    border-top-color:#9a70ff;

    animation:spin .8s linear infinite;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{

}

.empty-title{

    color:#aaa;
    margin-bottom:8px;
}

.empty-text{
    font-size:14px;
}


/* =========================================================
   LIST
   ========================================================= */

.list{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(300px,1fr)
        );

    gap:12px;
}


/* =========================================================
   CARD
   ========================================================= */

.card{

    transition:

        border-color .18s,
        background .18s;

    overflow:hidden;
}

.card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(150,110,255,.32);

    background:
        linear-gradient(
            145deg,
            rgba(130,90,255,.09),
            rgba(255,255,255,.035)

/* =========================================================

   ========================================================= */

.play:hover{

.alias{

.meta{

/* =========================================================

/* =========================================================

   ========================================================= */

    pointer-events:none;

    transition:.25s;

.toast.show{

    transform:

/* =========================================================
   НОРМАЛИЗАЦИЯ ТЕКСТА
========================================================= */

function normalizeText(
    text
){

    return String(
        text || ""
    )
    .toLowerCase()

    .normalize(
        "NFD"
    )

    .replace(
        /[\u0300-\u036f]/g,
        ""
    )

    .replace(
        /ё/g,
        "е"
    )

    .replace(
        /[’'`]/g,
        ""
    )

    .replace(
        /[^a-zа-я0-9]+/gi,
        " "
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();

}


/* =========================================================
   СОЗДАНИЕ ПОИСКОВЫХ ВАРИАНТОВ
========================================================= */

function getSearchVariants(
    query
){

    const normalized =
        normalizeText(
            query
        );

    const variants =
        new Set();

    if(
        normalized
    ){

        variants.add(
            normalized
        );

    }


    /*
     * Проверяем русские алиасы.
     */

    for(
        const ruName in ANIME_ALIASES
    ){

        const ruNormalized =
            normalizeText(
                ruName
            );

        if(
            normalized === ruNormalized ||
            normalized.includes(
                ruNormalized
            ) ||
            ruNormalized.includes(
                normalized
            )
        ){

            for(
                const alias of
                ANIME_ALIASES[ruName]
            ){

                variants.add(
                    normalizeText(
                        alias
                    )
                );

            }

        }

    }


    return [
        ...variants
    ];

}


/* =========================================================
   УДАЛЕНИЕ ТЕХНИЧЕСКИХ СЛОВ ИЗ ИМЕНИ
========================================================= */

function cleanAnimeName(
    filename
){

    let name =
        String(
            filename || ""
        );

    name =
        name.replace(
            /\.mp3$/i,
            ""
        );


    name =
        name.replace(
            /\b(opening|op|theme|song|official|full|tv|version|ver|audio|music)\b/gi,
            " "
        );


    name =
        name.replace(
            /[\[\]\(\)\{\}_\-]+/g,
            " "
        );


    name =
        name.replace(
            /\s+/g,
            " "
        )
        .trim();


    return name;

}


/* =========================================================
   ПОИСКОВОЙ SCORE
========================================================= */

function getSearchScore(
    track,
    query
){

    const variants =
        getSearchVariants(
            query
        );

    if(
        !variants.length
    ){

        return 0;

    }


    const filename =
        normalizeText(
            track.name
        );

    const cleanName =
        normalizeText(
            cleanAnimeName(
                track.name
            )
        );


    let bestScore = 0;


    for(
        const variant of variants
    ){

        if(
            !variant
        ){

            continue;

        }


        /*
         * Полное совпадение.
         */

        if(
            cleanName === variant
        ){

            bestScore =
                Math.max(
                    bestScore,
                    1000
                );

            continue;

        }


        /*
         * Название содержит запрос.
         */

        if(
            cleanName.includes(
                variant
            )
        ){

            bestScore =
                Math.max(
                    bestScore,
                    800
                );

        }


        /*
         * Имя файла содержит запрос.
         */

        if(
            filename.includes(
                variant
            )
        ){

            bestScore =
                Math.max(
                    bestScore,
                    700
                );

        }


        /*
         * Проверяем отдельные слова.
         */

        const words =
            variant
                .split(" ")
                .filter(
                    word =>
                        word.length >= 2
                );


        if(
            words.length
        ){

            let found = 0;

            for(
                const word of words
            ){

                if(
                    cleanName.includes(
                        word
                    )
                ){

                    found++;

                }

            }


            const ratio =
                found /
                words.length;


            if(
                ratio === 1
            ){

                bestScore =
                    Math.max(
                        bestScore,
                        650
                    );

            }
            else if(
                ratio >= .7
            ){

                bestScore =
                    Math.max(
                        bestScore,
                        500
                    );

            }
            else if(
                ratio >= .5
            ){

                bestScore =
                    Math.max(
                        bestScore,
                        300
                    );

            }

        }

    }


    return bestScore;

}


/* =========================================================
   ФОРМАТ РАЗМЕРА
========================================================= */

function formatSize(
    bytes
){

    if(
        !bytes
    ){

        return "";

    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];

    let size =
        Number(
            bytes
        );

    let index = 0;


    while(
        size >= 1024 &&
        index <
        units.length - 1
    ){

        size /= 1024;
        index++;

    }


    return (
        size.toFixed(
            index === 0
                ? 0
                : 1
        ) +
        " " +
        units[index]
    );

}


/* =========================================================
   ПОКАЗ TOAST
========================================================= */

let toastTimer = null;

function showToast(
    text
){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   URL
========================================================= */

function getTrackURL(
    track
){

    return (
        API_BASE +
        "/openings/music/" +
        encodeURIComponent(
            track.id
        )
    );

}


/* =========================================================
   PLAY
========================================================= */

function playTrack(
    track,
    button
){

    const url =
        getTrackURL(
            track
        );


    if(
        currentTrack &&
        currentTrack.id ===
        track.id
    ){

        if(
            audio.paused
        ){

            audio.play()
                .catch(
                    () => {}
                );

        }
        else{

            audio.pause();

        }

        return;

    }


    /*
     * Убираем состояние
     * со всех кнопок.
     */

    document
        .querySelectorAll(
            ".play.playing"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "playing"
                );

                element.textContent =
                    "▶";

            }
        );


    currentTrack =
        track;


    audio.src =
        url;


    audio.load();


    playerTitle.textContent =
        track.name;


    playerElement.style.display =
        "flex";


    if(
        button
    ){

        button.classList.add(
            "playing"
        );

        button.textContent =
            "❚❚";

    }


    audio.play()
        .catch(
            () => {

                showToast(
                    "Не удалось запустить воспроизведение"
                );

            }
        );

}


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener(
    "play",
    () => {

        if(
            !currentTrack
        ){

            return;

        }


        document
            .querySelectorAll(
                ".play"
            )
            .forEach(
                button => {

                    button.classList.remove(
                        "playing"
                    );

                    button.textContent =
                        "▶";

                }
            );


        const button =
            document.querySelector(
                '[data-id="' +
                currentTrack.id +
                '"]'
            );


        if(
            button
        ){

            button.classList.add(
                "playing"
            );

            button.textContent =
                "❚❚";

        }

    }
);


audio.addEventListener(
    "pause",
    () => {

        if(
            !currentTrack
        ){

            return;

        }


        const button =
            document.querySelector(
                '[data-id="' +
                currentTrack.id +
                '"]'
            );


        if(
            button
        ){

            button.classList.remove(
                "playing"
            );

            button.textContent =
                "▶";

        }

    }
);


audio.addEventListener(
    "ended",
    () => {

        if(
            !currentTrack
        ){

            return;

        }


        const button =
            document.querySelector(
                '[data-id="' +
                currentTrack.id +
                '"]'
            );


        if(
            button
        ){

            button.classList.remove(
                "playing"
            );

            button.textContent =
                "▶";

        }

    }
);


/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(
    track
){

    const url =
        getTrackURL(
            track
        );


    try{

        await navigator.clipboard.writeText(
            url
        );

        showToast(
            "Ссылка скопирована"
        );

    }
    catch{

        /*
         * Старый способ,
         * если Clipboard API недоступен.
         */

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            url;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        showToast(
            "Ссылка скопирована"
        );

    }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadTrack(
    track
){

    const url =
        getTrackURL(
            track
        ) +
        "?download=1";


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.target =
        "_blank";

    link.rel =
        "noopener";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

}


/* =========================================================
   СОЗДАНИЕ CARD
========================================================= */

function createCard(
    track
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";


    const play =
        document.createElement(
            "button"
        );

    play.className =
        "play";

    play.textContent =
        "▶";

    play.title =
        "Воспроизвести";


    play.dataset.id =
        track.id;


    play.addEventListener(
        "click",
        () => {

            playTrack(
                track,
                play
            );

        }
    );


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "info";


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "name";

    name.textContent =
        track.name;


    const cleanName =
        cleanAnimeName(
            track.name
        );


    const alias =
        document.createElement(
            "div"
        );

    alias.className =
        "alias";


    /*
     * Показываем очищенное имя,
     * если оно отличается.
     */

    if(
        cleanName &&
        cleanName !==
        track.name.replace(
            /\.mp3$/i,
            ""
        )
    ){

        alias.textContent =
            cleanName;

    }
    else{

        alias.textContent =
            "Anime Opening";

    }


    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "meta";

    meta.textContent =
        formatSize(
            track.size
        );


    info.appendChild(
        name
    );

    info.appendChild(
        alias
    );

    info.appendChild(
        meta
    );


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "actions";


    const copy =
        document.createElement(
            "button"
        );

    copy.className =
        "action";

    copy.textContent =
        "🔗";

    copy.title =
        "Скопировать ссылку";


    copy.addEventListener(
        "click",
        () => {

            copyLink(
                track
            );

        }
    );


    const download =
        document.createElement(
            "button"
        );

    download.className =
        "action";

    download.textContent =
        "⬇";

    download.title =
        "Скачать";


    download.addEventListener(
        "click",
        () => {

            downloadTrack(
                track
            );

        }
    );


    actions.appendChild(
        copy
    );

    actions.appendChild(
        download
    );


    card.appendChild(
        play
    );

    card.appendChild(
        info
    );

    card.appendChild(
        actions
    );


    return card;

}


/* =========================================================
   РЕНДЕР
========================================================= */

function render(){

    listElement.innerHTML =
        "";

    paginationElement.innerHTML =
        "";


    const total =
        filteredTracks.length;


    countElement.textContent =
        total +
        (
            total === 1
                ? " opening"
                : " openings"
        );


    if(
        !total
    ){

        emptyElement.style.display =
            "block";

        return;

    }


    emptyElement.style.display =
        "none";


    const totalPages =
        Math.ceil(
            total /
            PER_PAGE
        );


    if(
        currentPage >
        totalPages
    ){

        currentPage =
            totalPages;

    }


    const start =
        (
            currentPage - 1
        ) *
        PER_PAGE;


    const end =
        start +
        PER_PAGE;


    const pageTracks =
        filteredTracks.slice(
            start,
            end
        );


    for(
        const track of pageTracks
    ){

        listElement.appendChild(
            createCard(
                track
            )
        );

    }


    renderPagination(
        totalPages
    );

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(
    totalPages
){

    if(
        totalPages <= 1
    ){

        return;

    }


    const previous =
        document.createElement(
            "button"
        );

    previous.className =
        "page";

    previous.textContent =
        "‹";

    previous.disabled =
        currentPage <= 1;


    previous.addEventListener(
        "click",
        () => {

            if(
                currentPage > 1
            ){

                currentPage--;

                render();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }

        }
    );


    paginationElement.appendChild(
        previous
    );


    const maxButtons =
        7;


    let startPage =
        Math.max(
            1,
            currentPage -
            Math.floor(
                maxButtons / 2
            )
        );


    let endPage =
        Math.min(
            totalPages,
            startPage +
            maxButtons -
            1
        );


    if(
        endPage -
        startPage +
        1 <
        maxButtons
    ){

        startPage =
            Math.max(
                1,
                endPage -
                maxButtons +
                1
            );

    }


    for(
        let page =
            startPage;
        page <= endPage;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "page";


        if(
            page ===
            currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            page;


        button.addEventListener(
            "click",
            () => {

                currentPage =
                    page;

                render();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        paginationElement.appendChild(
            button
        );

    }


    const next =
        document.createElement(
            "button"
        );

    next.className =
        "page";

    next.textContent =
        "›";

    next.disabled =
        currentPage >=
        totalPages;


    next.addEventListener(
        "click",
        () => {

            if(
                currentPage <
                totalPages
            ){

                currentPage++;

                render();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }

        }
    );


    paginationElement.appendChild(
        next
    );

}


/* =========================================================
   ПОИСК
========================================================= */

function performSearch(){

    const query =
        search.value.trim();


    searchClear.style.display =
        query
            ? "block"
            : "none";


    if(
        !query
    ){

        filteredTracks =
            [...allTracks];

        currentPage =
            1;

        render();

        return;

    }


    /*
     * Score каждого трека.
     *
     * Благодаря этому сначала
     * показываются самые точные
     * совпадения.
     */

    const scored =
        allTracks
            .map(
                track => ({

                    track:
                        track,

                    score:
                        getSearchScore(
                            track,
                            query
                        )

                })
            )
            .filter(
                item =>
                    item.score > 0
            );


    scored.sort(
        (
            a,
            b
        ) => {

            if(
                b.score !==
                a.score
            ){

                return (
                    b.score -
                    a.score
                );

            }


            return a.track.name.localeCompare(
                b.track.name,
                "ru"
            );

        }
    );


    filteredTracks =
        scored.map(
            item =>
                item.track
        );


    currentPage =
        1;


    render();

}


let searchTimer = null;

search.addEventListener(
    "input",
    () => {

        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                performSearch,
                120
            );

    }
);


searchClear.addEventListener(
    "click",
    () => {

        search.value =
            "";

        performSearch();

        search.focus();

    }
);


/* =========================================================
   ЗАГРУЗКА СПИСКА
========================================================= */

async function loadList(){

    try{

        loadingElement.style.display =
            "block";

        emptyElement.style.display =
            "none";


        const response =
            await fetch(
                LIST_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !Array.isArray(
                data
            )
        ){

            throw new Error(
                "Сервер вернул неправильный список"
            );

        }


        allTracks =
            data.filter(
                track =>
                    track &&
                    track.id &&
                    track.name
            );


        /*
         * Первоначально показываем
         * все openings.
         */

        filteredTracks =
            [...allTracks];


        loadingElement.style.display =
            "none";


        render();

    }
    catch(error){

        console.error(
            error
        );


        loadingElement.style.display =
            "none";


        emptyElement.style.display =
            "block";


        emptyElement.innerHTML = `

            <div class="empty-title">
                Не удалось загрузить Openings
            </div>

            <div class="empty-text">
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;

        countElement.textContent =
            "Ошибка";

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(
    text
){

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   КЛАВИША ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            if(
                document.activeElement ===
                search
            ){

                search.value =
                    "";

                performSearch();

            }

        }

    }
);


/* =========================================================
   START
========================================================= */

loadList();

</script>
