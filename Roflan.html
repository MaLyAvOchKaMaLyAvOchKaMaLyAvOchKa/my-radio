<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>РњР°Р›СЏР’РѕР§РєР° - Р РѕС„Р»Р°РЅ</title>

<style>
*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    background:
        linear-gradient(
            90deg,
            rgba(5,7,10,.66) 0%,
            rgba(6,8,12,.52) 28%,
            rgba(7,8,14,.34) 55%,
            rgba(7,8,14,.12) 100%
        ),
        radial-gradient(
            circle at 70% 20%,
            rgba(190,80,255,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(255,50,180,.10),
            transparent 40%
        ),
        url("assets/simpotka-bg.png") right center / cover fixed,
        #090b0c;

    color:#eee;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:205px;

    background:
        linear-gradient(
            180deg,
            rgba(23,20,36,.54) 0%,
            rgba(12,14,24,.43) 55%,
            rgba(8,10,17,.59) 100%
        );

    border-right:
        1px solid
        rgba(220,143,255,.18);

    z-index:100;

    padding:
        220px
        12px
        20px;

    box-shadow:
        8px 0 35px
        rgba(0,0,0,.25),

        inset -1px 0 0
        rgba(255,255,255,.06);

    backdrop-filter:
        blur(16px)
        saturate(125%);
}

.sidebar-menu{
    display:flex;

    flex-direction:column;

    gap:8px;
}

.sidebar-item{
    position:relative;

    display:flex;

    align-items:center;

    gap:13px;

    min-height:56px;

    padding:
        10px
        14px;

    border-radius:13px;

    color:#aeb2b4;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:
        background .2s,
        color .2s,
        transform .18s,
        box-shadow .2s;
}

.sidebar-item:hover{
    background:
        rgba(190,80,255,.045);

    color:#fff;

    transform:
        translateX(2px);
}

.sidebar-item.active{
    background:
        linear-gradient(
            135deg,
            rgba(190,80,255,.15),
            rgba(255,70,190,.055)
        );

    color:#d36cff;

    box-shadow:
        inset 0 0 0 1px
        rgba(190,80,255,.12),

        0 5px 20px
        rgba(0,0,0,.14);
}

.sidebar-item.active::before{
    content:"";

    position:absolute;

    left:-12px;

    top:11px;
    bottom:11px;

    width:3px;

    border-radius:
        0 5px 5px 0;

    background:#d36cff;

    box-shadow:
        0 0 10px
        rgba(190,80,255,.5);
}

.sidebar-icon{
    width:30px;
    height:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,255,255,.035);

    font-size:19px;

    flex:none;

    transition:.2s;
}

.sidebar-item:hover
.sidebar-icon{
    background:
        rgba(190,80,255,.07);
}

.sidebar-item.active
.sidebar-icon{
    background:
        rgba(190,80,255,.10);
}

.sidebar-text{
    line-height:1.15;
}

.sidebar-small{
    display:block;

    margin-top:3px;

    font-size:11px;

    font-weight:400;

    color:#666;
}


/* =========================================================
   MAIN
   ========================================================= */

.main{
    margin-left:205px;

    min-height:100vh;

    background:
        linear-gradient(
            90deg,
            rgba(9,11,12,.18),
            transparent 72%
        );
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:relative;

    min-height:114px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        18px
        30px;

    background:
        linear-gradient(
            180deg,
            rgba(24,19,39,.72),
            rgba(10,12,24,.62)
        );

    backdrop-filter:
        blur(16px)
        saturate(135%);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.header-title{
    margin:0;

    color:#d36cff;

    font-size:39px;

    font-weight:800;

    letter-spacing:.5px;

    text-align:center;

    text-shadow:
        0 0 10px
        rgba(190,80,255,.5),

        0 0 25px
        rgba(255,70,190,.2);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-wrap{
    position:fixed;

    left:72px;

    top:19px;

    bottom:auto;

    z-index:200;

    padding:4px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(50,31,82,.40),
            rgba(10,12,29,.34)
        );

    border:1px solid rgba(225,145,255,.22);

    box-shadow:
        0 8px 25px rgba(0,0,0,.20),
        0 0 18px rgba(185,78,255,.10);

    backdrop-filter:blur(14px) saturate(145%);

    opacity:0;

    pointer-events:none;

    transform:translateX(-18px) scaleX(.12);

    transform-origin:left center;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.search-wrap.open{
    opacity:1;

    pointer-events:auto;

    transform:translateX(0) scaleX(1);
}

.search-toggle{
    position:fixed;

    left:20px;
    top:20px;

    bottom:auto;

    z-index:210;

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid rgba(230,157,255,.40);

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            rgba(81,45,128,.64),
            rgba(13,16,35,.55)
        );

    color:#f4d7ff;

    font-size:21px;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(0,0,0,.26),
        0 0 18px rgba(192,79,255,.25),
        inset 0 1px 0 rgba(255,255,255,.16);

    backdrop-filter:blur(13px) saturate(150%);

    transition:transform .18s, box-shadow .18s, border-color .18s;
}

.search-toggle:hover{
    transform:scale(1.07);

    border-color:rgba(244,181,255,.75);

    box-shadow:
        0 8px 25px rgba(0,0,0,.30),
        0 0 28px rgba(203,83,255,.44),
        inset 0 1px 0 rgba(255,255,255,.22);
}

.search{
    width:252px;
    height:45px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(8,9,21,.38);

    color:#fff;

    outline:none;

    padding:
        0
        18px
        0
        43px;

    font-size:15px;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.search:focus{
    border-color:
        rgba(190,80,255,.6);

    box-shadow:
        0 0 15px
        rgba(190,80,255,.1);
}

.search::placeholder{
    color:#777;
}

.search-icon{
    position:absolute;

    left:16px;
    top:12px;

    color:#aaa;

    font-size:19px;

    pointer-events:none;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content{
    max-width:1120px;

    margin:0;

    padding:
        24px
        36px
        180px;
}


/* =========================================================
   STATUS
   ========================================================= */

.status{
    text-align:center;

    padding:
        60px
        20px;

    color:#777;

    font-size:17px;
}

.status.loading{
    color:#888;
}

.status.error{
    max-width:700px;

    margin:
        40px
        auto;

    padding:30px;

    border:
        1px solid
        rgba(255,60,60,.25);

    background:
        rgba(80,10,10,.16);

    border-radius:14px;

    color:#ff7777;
}

.status.error strong{
    display:block;

    color:#ff4f4f;

    margin-bottom:15px;

    font-size:18px;
}


/* =========================================================
   TRACK
   ========================================================= */

.track{
    position:relative;

    background:
        linear-gradient(
            135deg,
            rgba(55,34,100,.15),
            rgba(6,10,25,.06)
        );

    border:
        1px solid
        rgba(230,157,255,.34);

    border-radius:13px;

    padding:7px 12px;

    margin-bottom:6px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.14),

        inset 0 1px 0
        rgba(255,255,255,.10),

        0 0 16px
        rgba(176,70,255,.22);

    backdrop-filter:
        blur(8px)
        saturate(160%);

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;
}

.track:hover{
    transform:
        translateY(-1px);

    border-color:
        rgba(240,169,255,.92);

    box-shadow:
        0 12px 38px
        rgba(0,0,0,.25),

        inset 0 1px 0
        rgba(255,255,255,.16),

        0 0 12px
        rgba(247,150,255,.45),

        0 0 32px
        rgba(184,68,255,.36);
}

.track-title{
    display:flex;

    align-items:center;

    gap:8px;

    color:#f0f0f0;

    font-size:16px;

    font-weight:600;

    margin-bottom:4px;

    overflow:hidden;

    padding-right:260px;
}

.track-icon{
    font-size:22px;

    flex:none;
}

.track-name{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.track-actions{
    display:flex;
    gap:7px;
    margin-left:auto;
    flex:none;
}


/* =========================================================
   AUDIO
   ========================================================= */

.audio{
    width:100%;

    height:32px;

    display:block;

    margin-bottom:0;

    color-scheme:dark;

    opacity:.72;

    border-radius:16px;

    filter:
        saturate(125%)
        contrast(.92);
}


/* =========================================================
   MINI PLAYER
   ========================================================= */

.mini-player{
    position:fixed;
    left:calc(205px + 24px);
    right:24px;
    bottom:18px;
    z-index:300;
    display:flex;
    align-items:center;
    gap:15px;
    min-height:72px;
    padding:10px 16px;
    border:1px solid rgba(230,157,255,.38);
    border-radius:18px;
    background:linear-gradient(135deg,rgba(45,26,88,.88),rgba(12,13,31,.88));
    box-shadow:0 14px 38px rgba(0,0,0,.36),0 0 26px rgba(190,80,255,.24),inset 0 1px 0 rgba(255,255,255,.12);
    backdrop-filter:blur(18px) saturate(150%);
    transform:translateY(115px);
    opacity:0;
    pointer-events:none;
    transition:transform .28s ease,opacity .28s ease;
}

.mini-player.visible{
    transform:translateY(0);
    opacity:1;
    pointer-events:auto;
}

.mini-player-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    flex:none;
    border-radius:13px;
    background:linear-gradient(135deg,#b64cff,#e34bb7);
    box-shadow:0 0 18px rgba(205,83,255,.45);
    font-size:22px;
}

.mini-player-info{
    min-width:120px;
    max-width:330px;
    flex:1;
    overflow:hidden;
}

.mini-player-label{
    display:block;
    margin-bottom:3px;
    color:#c894df;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.mini-player-title{
    overflow:hidden;
    color:#fff;
    font-weight:700;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.mini-audio{
    width:min(520px,48%);
    height:34px;
    color-scheme:dark;
    opacity:.9;
}

.mini-close{
    width:32px;
    height:32px;
    flex:none;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    color:#e7c8f4;
    cursor:pointer;
    font-size:19px;
    line-height:1;
}

.mini-close:hover{background:rgba(227,75,183,.28);color:#fff}

.mini-visualizer{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    width:132px;
    height:42px;
    padding:7px 12px;
    border-left:1px solid rgba(230,157,255,.18);
}

.mini-visualizer span{
    width:5px;
    height:8px;
    border-radius:8px;
    background:linear-gradient(180deg,#f4a0ff 0%,#c64fff 55%,#e34bb7 100%);
    box-shadow:0 0 9px rgba(218,88,255,.7);
    transform-origin:center;
}

.mini-player.playing .mini-visualizer span{
    animation:equalizer .82s ease-in-out infinite alternate;
}

.mini-player.playing .mini-visualizer span:nth-child(2){animation-delay:-.38s}
.mini-player.playing .mini-visualizer span:nth-child(3){animation-delay:-.12s}
.mini-player.playing .mini-visualizer span:nth-child(4){animation-delay:-.55s}
.mini-player.playing .mini-visualizer span:nth-child(5){animation-delay:-.25s}
.mini-player.playing .mini-visualizer span:nth-child(6){animation-delay:-.64s}
.mini-player.playing .mini-visualizer span:nth-child(7){animation-delay:-.05s}
.mini-player.playing .mini-visualizer span:nth-child(8){animation-delay:-.45s}
.mini-player.playing .mini-visualizer span:nth-child(9){animation-delay:-.18s}

@keyframes equalizer{
    from{height:7px;opacity:.55}
    to{height:29px;opacity:1}
}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{
    display:flex;

    gap:9px;

    position:absolute;

    top:7px;
    right:12px;
}

.btn{
    flex:none;

    min-height:30px;

    min-width:116px;

    padding:0 12px;

    border:0;

    border-radius:8px;

    cursor:pointer;

    font-size:13px;

    font-weight:700;

    color:white;

    transition:
        filter .15s,
        transform .1s,
        opacity .15s;
}

.track-actions .btn{
    flex:none;
    min-height:30px;
    padding:0 12px;
    border-radius:8px;
    font-size:13px;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.btn:hover{
    filter:
        brightness(1.08);
}

.btn:active{
    transform:
        scale(.985);
}

.download-btn{
    background:#b64cff;
}

.copy-btn{
    background:#e34bb7;
}

.copy-btn.copied{
    background:#a83fda;
}

.download-btn{
    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    text-align:center;

    color:#777;

    padding:
        80px
        20px;

    font-size:17px;
}


/* =========================================================
   PAGINATION
   ========================================================= */

.pagination{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    flex-wrap:wrap;

    margin-top:30px;
}

.page-btn{
    min-width:40px;

    height:40px;

    padding:
        0
        12px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:8px;

    background:#17191b;

    color:#bbb;

    cursor:pointer;

    font-size:14px;

    font-weight:700;

    transition:.15s;
}

.page-btn:hover{
    background:#202427;

    color:#d36cff;

    border-color:
        rgba(190,80,255,.3);
}

.page-btn.active{
    background:#b64cff;

    color:#fff;

    border-color:#b64cff;
}

.page-btn:disabled{
    opacity:.35;

    cursor:default;
}

.page-info{
    width:100%;

    text-align:center;

    color:#666;

    font-size:13px;

    margin-bottom:7px;
}

.page-dots{
    color:#666;

    padding:
        0
        3px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

    .mini-player{
        left:84px;
        right:14px;
        bottom:12px;
    }

    .sidebar{
        width:70px;

        padding-top:170px;

        padding-left:7px;
        padding-right:7px;
    }

    .sidebar-item{
        justify-content:center;

        padding:
            17px
            5px;
    }

    .sidebar-text{
        display:none;
    }

    .sidebar-item.active::before{
        left:-7px;
    }

    .main{
        margin-left:70px;
    }

    .header{
        min-height:135px;

        padding-top:15px;

        align-items:flex-start;
    }

    .header-title{
        font-size:27px;

        padding-top:3px;
    }

    .search-wrap{
        position:fixed;

        top:16px;

        bottom:auto;

        left:62px;
        right:15px;
    }

    .search-toggle{
        left:10px;
        top:16px;
        bottom:auto;
    }

    .search{
        width:100%;
    }

    .content{
        padding:
            25px
            15px
            130px;
    }
}

@media(max-width:600px){

    .mini-player{
        left:10px;
        right:10px;
        gap:9px;
        min-height:64px;
        padding:8px 10px;
        border-radius:15px;
    }

    .mini-player-icon{
        width:38px;
        height:38px;
        border-radius:11px;
        font-size:18px;
    }

    .mini-player-info{min-width:0}
    .mini-player-label{font-size:9px}
    .mini-player-title{font-size:12px}
    .mini-audio{width:42%;height:32px}
    .mini-visualizer{display:none}


    .buttons{
        flex-direction:column;
    }

    .btn{
        min-height:42px;
    }

    .track-title{
        font-size:17px;
    }
}

@media(max-width:600px){

    .track-title{
        padding-right:0;
    }

    .buttons{
        position:static;
        flex-direction:row;
        margin-top:7px;
    }

    .buttons .btn{
        flex:1;
        min-width:0;
        min-height:36px;
        padding:0 8px;
        font-size:12px;
    }

    .audio{
        height:38px;
    }
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar{
    width:9px;
}

::-webkit-scrollbar-track{
    background:#090a0b;
}

::-webkit-scrollbar-thumb{
    background:#292c2e;

    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#363a3d;
}
/* =========================================================
   ROFLAN — ORANGE THEME
   ========================================================= */

        linear-gradient(90deg,rgba(20,9,2,.88) 0%,rgba(28,13,3,.70) 34%,rgba(30,14,3,.28) 72%,rgba(26,11,2,.12) 100%),
        linear-gradient(180deg,rgba(74,27,4,.20),rgba(18,7,1,.42)),
        url("assets/Fon3.jpg") center center / cover fixed,

.track:hover{border-color:rgba(255,207,140,.95);box-shadow:0 12px 38px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.16),0 0 12px rgba(255,183,75,.48),0 0 32px rgba(255,113,8,.30)}

function normalizeSearchText(value){

    return String(value||"")

        .toLowerCase()

        .replace(
            /С‘/g,
            "Рµ"
        )

        .replace(
            /[^a-zР°-СЏ0-9]+/gi,
            ""
        );

}


/* =========================================================
   РЈРќРРљРђР›Р¬РќР«Р• Р’РђР РРђРќРўР«
   ========================================================= */

function uniqueVariants(values){

    return [
        ...new Set(

            values

                .filter(Boolean)

                .map(
                    v=>
                        normalizeSearchText(v)
                )

                .filter(Boolean)

        )
    ];

}

   РЎРћР—Р”РђРќРР• Р’РђР РРђРќРўРћР’
   ========================================================= */

function makeSearchVariants(text){

    const original=
        String(text||"")
            .toLowerCase();


    const variants=[
        original
    ];


    variants.push(
        transliterateRuToEn(
            original
        )
    );


    variants.push(
        transliterateEnToRu(
            original
        )
    );


    const normalized=
        normalizeSearchText(
            original
        );


    for(
        const pair
        of COMMON_TRANSLITERATIONS
    ){

        const en=
            normalizeSearchText(
                pair[0]
            );


        if(
            normalized.includes(en)
        ){

            variants.push(
                pair[1]
            );

        }

    }


    return uniqueVariants(
        variants
    );

}

   ========================================================= */

function getAnimeAliasesForTrack(name){

    const normalizedName=
        normalizeSearchText(
            name
        );


    const result=[];


    for(
        const animeName
        in ANIME_ALIASES
    ){

        const normalizedAnime=
            normalizeSearchText(
                animeName
            );


        /*
         * Р•СЃР»Рё Р°РЅРіР»РёР№СЃРєРѕРµ РЅР°Р·РІР°РЅРёРµ СѓР¶Рµ РµСЃС‚СЊ
         * РІ РёРјРµРЅРё С„Р°Р№Р»Р° вЂ” РґРѕР±Р°РІР»СЏРµРј СЂСѓСЃСЃРєРёРµ Р°Р»РёР°СЃС‹.
         */

        if(
            normalizedName.includes(
                normalizedAnime
            )
        ){

            result.push(
                ...ANIME_ALIASES[
                    animeName
                ]
            );

        }


        /*
         * РџСЂРѕРІРµСЂСЏРµРј Р°Р»РёР°СЃС‹.
         */

        for(
            const alias
            of ANIME_ALIASES[
                animeName
            ]
        ){

            const normalizedAlias=
                normalizeSearchText(
                    alias
                );


            if(
                normalizedAlias &&
                normalizedName.includes(
                    normalizedAlias
                )
            ){

                result.push(
                    ...ANIME_ALIASES[
                        animeName
                    ]
                );

                break;

            }

        }

    }


    return result;

}

function buildTrackSearchText(track){

    const name=
        removeExtension(
            String(
                track.name||""
            )
        );


    const values=[
        name

    /*
     * Р”РѕР±Р°РІР»СЏРµРј СЂСѓСЃСЃРєРёРµ РЅР°Р·РІР°РЅРёСЏ
     * РёР·РІРµСЃС‚РЅС‹С… Р°РЅРёРјРµ.
     */

    values.push(
        ...getAnimeAliasesForTrack(
            name

    /*
     * РћР±С‹С‡РЅР°СЏ С‚СЂР°РЅСЃР»РёС‚РµСЂР°С†РёСЏ.
     */

    values.push(

    );


    return uniqueVariants(
        values
    );

}


/* =========================================================
   LEVENSHTEIN
   ========================================================= */

function levenshtein(a,b){

    a=String(a||"");

    b=String(b||"");


    if(a===b)
        return 0;


    if(!a.length)
        return b.length;


    if(!b.length)
        return a.length;


    let prev=
        Array.from(
            {
                length:
                    b.length+1
            },
            (_,i)=>i
        );


    for(
        let i=1;
        i<=a.length;
        i++
    ){

        const cur=[
            i
        ];


        for(
            let j=1;
            j<=b.length;
            j++
        ){

            const cost=
                a[i-1]===b[j-1]
                    ?0
                    :1;


            cur[j]=
                Math.min(

                    cur[j-1]+1,

                    prev[j]+1,

                    prev[j-1]+cost

                );

        }


        prev=cur;

    }


    return prev[
        b.length
    ];

}


/* =========================================================
   FUZZY MATCH
   ========================================================= */

function fuzzyWordMatch(
    query,
    text
){

    if(
        !query ||
        !text
    )
        return false;


    if(
        text.includes(
            query
        )
    )
        return true;


    if(
        query.length<3
    )
        return false;


    const words=
        text
            .split(
                /[\s\-_.,!?()[\]{}]+/
            )
            .filter(Boolean);


    const candidates=
        words.length
            ?words
            :[text];


    for(
        const word
        of candidates
    ){

        const distance=
            levenshtein(
                query,
                word
            );


        if(
            query.length<=4 &&
            distance<=1
        )
            return true;


        if(
            query.length<=7 &&
            distance<=2
        )
            return true;


        if(
            query.length>7 &&
            distance<=
                Math.max(
                    2,
                    Math.floor(
                        query.length*.25
                    )
                )
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   РЈРњРќР«Р™ РџРћРРЎРљ РђРќРРњР•
   ========================================================= */

function smartSearchMatch(
    track,
    query
){

    const cleanQuery=
        normalizeSearchText(
            query
        );


    if(!cleanQuery)
        return true;


    const variants=
        buildTrackSearchText(
            track
        );


    /*
     * РћР±С‹С‡РЅРѕРµ СЃРѕРІРїР°РґРµРЅРёРµ.
     */

    for(
        const variant
        of variants
    ){

        if(
            variant.includes(
                cleanQuery
            )
        ){

            return true;

        }


        if(
            cleanQuery.length>=3 &&
            cleanQuery.includes(
                variant
            )
        ){

            return true;

        }

    }


    /*
     * Р’Р°СЂРёР°РЅС‚С‹ СЃР°РјРѕРіРѕ Р·Р°РїСЂРѕСЃР°.
     */

    const queryVariants=
        makeSearchVariants(
            query
        );


    /*
     * РџСЂРѕРІРµСЂСЏРµРј СЂСѓСЃСЃРєРёР№ Р°Р»РёР°СЃ
     * РЅР°РїСЂСЏРјСѓСЋ РїРѕ Р±Р°Р·Рµ Р°РЅРёРјРµ.
     */

    for(
        const animeName
        in ANIME_ALIASES
    ){

        const aliases=
            ANIME_ALIASES[
                animeName
            ];


        for(
            const alias
            of aliases
        ){

            const aliasNormalized=
                normalizeSearchText(
                    alias
                );


            if(
                aliasNormalized===
                cleanQuery
            ){

                const allNames=[
                    animeName,
                    ...aliases
                ];


                for(
                    const name
                    of allNames
                ){

                    const normalizedName=
                        normalizeSearchText(
                            name
                        );


                    if(
                        variants.some(
                            variant=>
                                variant.includes(
                                    normalizedName
                                )
                        )
                    ){

                        return true;

                    }

                }

            }

        }

    }


    /*
     * Fuzzy РїРѕРёСЃРє.
     */

    for(
        const q
        of queryVariants
    ){

        for(
            const variant
            of variants
        ){

            if(
                variant.includes(q)
            )
                return true;


            if(
                fuzzyWordMatch(
                    q,
                    variant
                )
            )
                return true;

        }

    }


    /*
     * РџСЂРѕРІРµСЂРєР° С‡Р°СЃС‚РµР№ Р·Р°РїСЂРѕСЃР°.
     */

    const queryParts=
        String(query||"")
            .toLowerCase()
            .split(
                /[\s\-_.,!?()[\]{}]+/
            )
            .filter(
                value=>
                    value.length>=2
            );


    if(
        queryParts.length>1
    ){

        let matched=0;


        for(
            const part
            of queryParts
        ){

            const partVariants=
                makeSearchVariants(
                    part
                );


            let partFound=false;


            for(
                const q
                of partVariants
            ){

                for(
                    const variant
                    of variants
                ){

                    if(
                        variant.includes(q) ||
                        fuzzyWordMatch(
                            q,
                            variant
                        )
                    ){

                        partFound=true;

                        break;

                    }

                }


                if(partFound)
                    break;

            }


            if(partFound)
                matched++;

        }


        if(
            matched===
            queryParts.length
        ){

            return true;

        }

    }


    return false;

}


/* =========================================================
   Р—РђР“Р РЈР—РљРђ РЎРџРРЎРљРђ
   ========================================================= */

/* =========================================================
   РџР РРћР РРўР•Рў Р Р•Р—РЈР›Р¬РўРђРўРћР’ РџРћРРЎРљРђ
   ========================================================= */

function getSearchScore(
    track,
    query
){

    const cleanQuery=
        normalizeSearchText(
            query
        );


    if(!cleanQuery)
        return 0;


    const trackName=
        normalizeSearchText(
            removeExtension(
                String(
                    track.name||""
                )
            )
        );


    /* РўРѕС‡РЅРѕРµ РЅР°Р·РІР°РЅРёРµ РїРµСЃРЅРё РІСЃРµРіРґР° РїРѕРєР°Р·С‹РІР°РµС‚СЃСЏ РїРµСЂРІС‹Рј. */
    if(trackName===cleanQuery)
        return 10000;


    if(trackName.includes(cleanQuery))
        return 9000;


    const queryVariants=
        makeSearchVariants(
            query
        );


    for(
        const variant
        of queryVariants
    ){

        if(
            variant &&
            trackName.includes(variant)
        )
            return 8500;

    }


    /* РЎРѕРІРїР°РґРµРЅРёСЏ С‡РµСЂРµР· Р°Р»РёР°СЃС‹ Р°РЅРёРјРµ РёРґСѓС‚ РїРѕСЃР»Рµ РёРјРµРЅРё РїРµСЃРЅРё. */
    const variants=
        buildTrackSearchText(
            track
        );


    for(
        const variant
        of variants
    ){

        if(
            variant.includes(cleanQuery)
        )
            return 5000;

    }


    /* РќРµС‚РѕС‡РЅС‹Рµ СЃРѕРІРїР°РґРµРЅРёСЏ РѕСЃС‚Р°СЋС‚СЃСЏ, РЅРѕ РІСЃРµРіРґР° РЅР°С…РѕРґСЏС‚СЃСЏ РІРЅРёР·Сѓ. */
    return 1;

}


async function loadMusic(){

    try{

        const response=
            await fetch(

                LIST_URL+
                "?t="+
                Date.now(),

                {

                    cache:"no-store",

                    headers:{
                        Accept:
                            "application/json"
                    }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "Worker HTTP "+
                response.status
            );

        }


        const data=
            await response.json();


        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "Worker РІРµСЂРЅСѓР» РЅРµРїСЂР°РІРёР»СЊРЅС‹Р№ JSON"

function stopAllAudio(
    exceptAudio=null
){

    document
        .querySelectorAll("audio")
        .forEach(
            audio=>{

                if(
                    audio===
                    exceptAudio
                )
                    return;


                try{

                    audio.pause();

                    audio.currentTime=0;

                }
                catch(error){}

            }
        );


    if(
        currentAudio &&
        currentAudio!==
        exceptAudio
    ){

        currentAudio=null;

    }

}


function setupAudio(audio){

    if(!audio)
        return;

    audio.addEventListener("play",()=>{
        const id=audio.id.replace("audio-","");
        const track=tracks.find(item=>String(item.id)===id);

        if(!track)
            return;

        audio.pause();
        audio.currentTime=0;
        playInMiniPlayer(track);
    });

}

function formatPlayerTime(seconds){
    if(!Number.isFinite(seconds)) return "0:00";
    const minutes=Math.floor(seconds/60);
    const remainder=Math.floor(seconds%60).toString().padStart(2,"0");
    return minutes+":"+remainder;
}

function updateActiveCard(){
    document.querySelectorAll("[data-card-player]").forEach(player=>{
        const isActive=String(player.dataset.cardPlayer)===activeTrackId;
        const button=player.querySelector(".card-play-toggle");
        const time=player.querySelector(".card-time");
        const seek=player.querySelector(".card-seek");
        const duration=isActive ? miniAudio.duration : 0;
        const current=isActive ? miniAudio.currentTime : 0;

        button.textContent=isActive && !miniAudio.paused ? "в…Ў" : "в–¶";
        button.setAttribute("aria-label",isActive && !miniAudio.paused ? "РџР°СѓР·Р°" : "Р’РѕСЃРїСЂРѕРёР·РІРµСЃС‚Рё");
        time.textContent=formatPlayerTime(current)+" / "+formatPlayerTime(duration);
        seek.max=Number.isFinite(duration) && duration>0 ? duration : 100;
        seek.value=Number.isFinite(current) ? current : 0;
    });
}

function setupCardPlayer(track){
    const player=document.querySelector('[data-card-player="'+CSS.escape(String(track.id))+'"]');
    if(!player) return;

    const button=player.querySelector(".card-play-toggle");
    const seek=player.querySelector(".card-seek");

    button.addEventListener("click",()=>{
        if(activeTrackId===String(track.id)){
            if(miniAudio.paused) miniAudio.play().catch(()=>{});
            else miniAudio.pause();
            return;
        }
        playInMiniPlayer(track);
    });

    seek.addEventListener("input",()=>{
        if(activeTrackId!==String(track.id)){
            playInMiniPlayer(track);
            miniAudio.addEventListener("loadedmetadata",()=>{miniAudio.currentTime=Number(seek.value)}, {once:true});
            return;
        }
        miniAudio.currentTime=Number(seek.value);
        updateActiveCard();
    });

    updateActiveCard();
}

function renderTracks(){

    const query=
        searchInput.value.trim();


    filteredTracks=
        tracks
            .filter(
                track=>
                    smartSearchMatch(
                        track,
                        query
                    )
            )
            .map(
                track=>({
                    track,
                    score:getSearchScore(
                        track,
                        query
                    )
                })
            )
            .sort(
                (a,b)=>
                    b.score-a.score ||
                    String(a.track.name)
                        .localeCompare(
                            String(b.track.name),
                            "ru"
                        )
            )
            .map(
                item=>item.track
            );


    const totalPages=
        Math.max(

            1,

            Math.ceil(

                filteredTracks.length/
                TRACKS_PER_PAGE

            )

        );


    if(
        currentPage>
        totalPages
    ){

        currentPage=
            totalPages;

    }


    if(
        !filteredTracks.length
    ){

        musicList.innerHTML=`

            <div class="empty">

                рџЋµ РќРёС‡РµРіРѕ РЅРµ РЅР°Р№РґРµРЅРѕ

                <br><br>

                <span
                    style="
                        color:#555;
                        font-size:14px
                    "
                >
                    РџРѕРїСЂРѕР±СѓР№:
                    РЅР°Р·РІР°РЅРёРµ С‚СЂРµРєР°,
                    РёСЃРїРѕР»РЅРёС‚РµР»СЏ РёР»Рё С‡Р°СЃС‚СЊ РЅР°Р·РІР°РЅРёСЏ
                </span>

            </div>

        `;


        return;

    }


    const start=
        (currentPage-1)*
        TRACKS_PER_PAGE;


    const pageTracks=
        filteredTracks.slice(
            start,
            start+
                TRACKS_PER_PAGE
        );


    musicList.innerHTML=

        );


    pageTracks.forEach(

            setupCardPlayer(track);

    );

}

/* =========================================================
   РџРђР“РРќРђР¦РРЇ
   ========================================================= */

function createPaginationHTML(
    totalPages
){

    if(
        totalPages<=1
    )
        return "";


    const start=
        (currentPage-1)*
        TRACKS_PER_PAGE+
        1;


    const end=
        Math.min(

            currentPage*
            TRACKS_PER_PAGE,

            filteredTracks.length

        );


    let html=`

        <div class="pagination">

            <div class="page-info">

                РџРѕРєР°Р·Р°РЅРѕ
                ${start}вЂ“${end}
                РёР·
                ${filteredTracks.length}

            </div>


            <button
                class="page-btn"
                onclick="changePage(
                    ${currentPage-1}
                )"
                ${
                    currentPage===1
                        ?"disabled"
                        :""
                }
            >
                в†ђ
            </button>

    `;


    const pages=[];


    for(
        let i=1;
        i<=totalPages;
        i++
    ){

        if(

            i===1 ||

            i===totalPages ||

            Math.abs(
                i-currentPage
            )<=2

        ){

            pages.push(i);

        }

    }


    let previous=0;


    for(
        const page
        of pages
    ){

        if(
            previous &&
            page-previous>1
        ){

            html+=`

                <span
                    class="page-dots"
                >
                    ...
                </span>

            `;

        }


        html+=`

            <button
                class="page-btn ${
                    page===
                    currentPage
                        ?"active"
                        :""
                }"
                onclick="changePage(
                    ${page}
                )"
            >
                ${page}
            </button>

        `;


        previous=page;

    }


    html+=`

            <button
                class="page-btn"
                onclick="changePage(
                    ${currentPage+1}
                )"
                ${
                    currentPage===
                    totalPages
                        ?"disabled"
                        :""
                }
            >
                в†’
            </button>

        </div>

    `;


    return html;

}


function changePage(
    page
){

    const totalPages=
        Math.max(

            1,

            Math.ceil(

                filteredTracks.length/
                TRACKS_PER_PAGE

            )

        );


    if(
        page<1 ||
        page>totalPages
    )
        return;


    currentPage=
        page;


    renderTracks();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

async function copyMusicLink(
    button,
    url
){

    const oldText=
        button.textContent;


    try{

        await navigator
            .clipboard
            .writeText(
                url
            );


        button.textContent=
            "вњ“ РЎСЃС‹Р»РєР° СЃРєРѕРїРёСЂРѕРІР°РЅР°";


        button.classList.add(
            "copied"
        );


        setTimeout(
            ()=>{

                button.textContent=
                    oldText;


                button.classList.remove(
                    "copied"
                );

            },
            1800
        );

    }
    catch(error){

        const textarea=
            document.createElement(
                "textarea"
            );


        textarea.value=
            url;


        textarea.style.position=
            "fixed";


        textarea.style.left=
            "-9999px";


        textarea.style.top=
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success=false;


        try{

            success=
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success=false;

        }


        textarea.remove();


        if(success){

            button.textContent=
                "вњ“ РЎСЃС‹Р»РєР° СЃРєРѕРїРёСЂРѕРІР°РЅР°";


            button.classList.add(
                "copied"
            );


            setTimeout(
                ()=>{

                    button.textContent=
                        oldText;


                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "РЎРєРѕРїРёСЂСѓР№ СЌС‚Сѓ СЃСЃС‹Р»РєСѓ:",
                url
            );

        }

    }

}

/* =========================================================
   РЈР”РђР›Р•РќРР• .MP3
   ========================================================= */

function removeExtension(
    name
){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
){

    return escapeHTML(
        value
    );

}


function escapeJS(
    value
){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}
