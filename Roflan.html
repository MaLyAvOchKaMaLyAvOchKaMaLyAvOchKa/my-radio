<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>МаЛяВоЧка - Roflan</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(255,0,100,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(0,160,255,.12),
            transparent 35%
        ),
        #08090d;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;

    padding-bottom:150px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:sticky;

    top:0;

    z-index:1000;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 28px;

    background:
        rgba(8,9,13,.82);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.25);

}


.logo{

    font-size:22px;

    font-weight:800;

    letter-spacing:.5px;

    white-space:nowrap;

}


.logo span{

    opacity:.5;

    font-weight:400;

}


.top-buttons{

    display:flex;

    gap:10px;

}


.top-button{

    border:1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color:white;

    padding:
        10px 15px;

    border-radius:12px;

    cursor:pointer;

    transition:.2s;

    text-decoration:none;

    font-size:14px;

}


.top-button:hover{

    background:
        rgba(255,255,255,.1);

    transform:
        translateY(-1px);

}


/* =========================================================
   HERO
========================================================= */

.hero{

    max-width:1200px;

    margin:
        55px auto 25px;

    padding:
        0 22px;

}


.hero h1{

    margin:0;

    font-size:
        clamp(35px,6vw,68px);

    line-height:1;

    letter-spacing:-2px;

}


.hero h1 span{

    background:
        linear-gradient(
            90deg,
            #ff3b81,
            #9b6cff,
            #39b9ff
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

}


.hero p{

    color:
        rgba(255,255,255,.5);

    margin:
        18px 0 0;

    font-size:16px;

}


/* =========================================================
   SEARCH
========================================================= */

.controls{

    max-width:1200px;

    margin:
        0 auto 25px;

    padding:
        0 22px;

    display:flex;

    gap:12px;

    flex-wrap:wrap;

}


.search{

    flex:1;

    min-width:240px;

    position:relative;

}


.search input{

    width:100%;

    height:50px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.055);

    color:white;

    outline:none;

    padding:
        0 18px;

    font-size:15px;

    transition:.2s;

}


.search input:focus{

    border-color:
        rgba(155,108,255,.6);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 0 3px
        rgba(155,108,255,.08);

}


.select{

    height:50px;

    border-radius:15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:#11131a;

    color:white;

    padding:
        0 15px;

    outline:none;

    cursor:pointer;

}


/* =========================================================
   STATS
========================================================= */

.stats{

    max-width:1200px;

    margin:
        0 auto 22px;

    padding:
        0 22px;

    color:
        rgba(255,255,255,.45);

    font-size:14px;

}


/* =========================================================
   TRACK LIST
========================================================= */

.track-list{

    max-width:1200px;

    margin:
        0 auto;

    padding:
        0 22px;

    display:flex;

    flex-direction:column;

    gap:8px;

}


.track{

    display:grid;

    grid-template-columns:
        54px
        minmax(0,1fr)
        auto;

    align-items:center;

    gap:14px;

    min-height:72px;

    padding:
        10px 12px;

    border-radius:17px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.055);

    transition:.2s;

}


.track:hover{

    background:
        rgba(255,255,255,.065);

    border-color:
        rgba(255,255,255,.1);

    transform:
        translateY(-1px);

}


.track.playing{

    background:
        linear-gradient(
            90deg,
            rgba(255,59,129,.12),
            rgba(155,108,255,.1),
            rgba(57,185,255,.08)
        );

    border-color:
        rgba(155,108,255,.35);

}


.track-number{

    width:44px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.45);

    font-size:13px;

}


.track.playing
.track-number{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff3b81,
            #8d62ff
        );

}


.track-info{

    min-width:0;

}


.track-name{

    font-size:15px;

    font-weight:600;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

}


.track-meta{

    margin-top:5px;

    color:
        rgba(255,255,255,.35);

    font-size:12px;

}


.track-actions{

    display:flex;

    align-items:center;

    gap:7px;

}


.icon-button{

    width:40px;

    height:40px;

    border-radius:12px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    color:white;

    cursor:pointer;

    transition:.2s;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:16px;

}


.icon-button:hover{

    background:
        rgba(255,255,255,.1);

}


.play-button{

    background:
        linear-gradient(
            135deg,
            #ff3b81,
            #895fff
        );

    border:none;

}


.play-button:hover{

    filter:
        brightness(1.12);

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    max-width:1200px;

    margin:
        40px auto;

    padding:
        0 22px;

    text-align:center;

    color:
        rgba(255,255,255,.35);

}


.loader{

    width:35px;

    height:35px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.1);

    border-top-color:
        #9b6cff;

    animation:
        spin .8s linear infinite;

    margin:
        30px auto;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   PLAYER
========================================================= */

.player{

    position:fixed;

    z-index:2000;

    left:18px;

    right:18px;

    bottom:18px;

    min-height:92px;

    border-radius:22px;

    background:
        rgba(13,14,20,.9);

    backdrop-filter:
        blur(25px);

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.5);

    padding:
        13px 18px;

    display:grid;

    grid-template-columns:
        minmax(180px,1fr)
        minmax(250px,2fr)
        minmax(160px,1fr);

    align-items:center;

    gap:20px;

}


.player-info{

    min-width:0;

}


.player-title{

    font-size:14px;

    font-weight:700;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;

}


.player-sub{

    color:
        rgba(255,255,255,.35);

    font-size:11px;

    margin-top:5px;

}


.player-center{

    display:flex;

    flex-direction:column;

    gap:9px;

}


.player-buttons{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

}


.player-main-button{

    width:43px;

    height:43px;

    border-radius:50%;

    border:none;

    background:
        linear-gradient(
            135deg,
            #ff3b81,
            #8b60ff
        );

    color:white;

    cursor:pointer;

    font-size:16px;

}


.player-small-button{

    width:35px;

    height:35px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color:white;

    cursor:pointer;

}


.progress-row{

    display:flex;

    align-items:center;

    gap:8px;

}


.time{

    width:42px;

    color:
        rgba(255,255,255,.4);

    font-size:10px;

    text-align:center;

}


.progress{

    flex:1;

    height:5px;

    appearance:none;

    -webkit-appearance:none;

    border-radius:20px;

    background:
        rgba(255,255,255,.12);

    outline:none;

    cursor:pointer;

}


.progress::-webkit-slider-thumb{

    appearance:none;

    -webkit-appearance:none;

    width:12px;

    height:12px;

    border-radius:50%;

    background:#fff;

}


.player-right{

    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:9px;

}


.volume{

    width:90px;

    appearance:none;

    -webkit-appearance:none;

    height:4px;

    border-radius:10px;

    background:
        rgba(255,255,255,.12);

}


.volume::-webkit-slider-thumb{

    appearance:none;

    -webkit-appearance:none;

    width:11px;

    height:11px;

    border-radius:50%;

    background:white;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    z-index:5000;

    left:50%;

    bottom:125px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:
        rgba(20,21,28,.95);

    border:
        1px solid
        rgba(255,255,255,.1);

    padding:
        12px 17px;

    border-radius:13px;

    color:white;

    font-size:13px;

    transition:.25s;

}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    .topbar{

        padding:
            0 15px;

    }


    .logo{

        font-size:18px;

    }


    .top-button{

        padding:
            9px 11px;

        font-size:12px;

    }


    .hero{

        margin-top:38px;

    }


    .track{

        grid-template-columns:
            43px
            minmax(0,1fr)
            auto;

        gap:9px;

    }


    .track-number{

        width:38px;

        height:38px;

    }


    .track-actions
    .download-btn{

        display:none;

    }


    .player{

        left:8px;

        right:8px;

        bottom:8px;

        padding:12px;

        grid-template-columns:
            1fr;

        gap:8px;

    }


    .player-info{

        text-align:center;

    }


    .player-right{

        justify-content:center;

    }


    .player{

        min-height:auto;

    }


    body{

        padding-bottom:260px;

    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{

        scroll-behavior:auto!important;

        animation:none!important;

        transition:none!important;

    }

}

</style>

        </div>

            id="playerSub"
            class="player-sub"

        </div>

<script>


/* =========================================================
   НАСТРОЙКИ
========================================================= */

const WORKER =
    "https://malyavochka-music.rxmlopdt.workers.dev";


const LIST_URL =
    WORKER +
    "/roflan/list.json";


const MUSIC_URL =
    WORKER +
    "/roflan/music/";



/* =========================================================
   DOM
========================================================= */

const audio =
    document.getElementById(
        "audio"
    );


const search =
    document.getElementById(
        "search"
    );


const sort =
    document.getElementById(
        "sort"
    );


const trackList =
    document.getElementById(
        "trackList"
    );


const empty =
    document.getElementById(
        "empty"
    );


const stats =
    document.getElementById(
        "stats"
    );


const playerTitle =
    document.getElementById(
        "playerTitle"
    );


const playerSub =
    document.getElementById(
        "playerSub"
    );


const playBtn =
    document.getElementById(
        "playBtn"
    );


const prevBtn =
    document.getElementById(
        "prevBtn"
    );


const nextBtn =
    document.getElementById(
        "nextBtn"
    );


const progress =
    document.getElementById(
        "progress"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );


const volume =
    document.getElementById(
        "volume"
    );


const downloadCurrent =
    document.getElementById(
        "downloadCurrent"
    );


const copyCurrent =
    document.getElementById(
        "copyCurrent"
    );


const toast =
    document.getElementById(
        "toast"
    );



/* =========================================================
   STATE
========================================================= */

let tracks = [];

let filteredTracks = [];

let currentIndex = -1;

let currentTrack = null;



/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    text
){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}



/* =========================================================
   TIME
========================================================= */

function formatTime(
    seconds
){

    if (
        !Number.isFinite(
            seconds
        )
    ){

        return "0:00";

    }


    seconds =
        Math.max(
            0,
            Math.floor(
                seconds
            )
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secs
    );

}



/* =========================================================
   SIZE
========================================================= */

function formatSize(
    bytes
){

    bytes =
        Number(
            bytes || 0
        );


    if (
        bytes < 1024
    ){

        return (
            bytes +
            " B"
        );

    }


    if (
        bytes < 1024 * 1024
    ){

        return (
            (bytes / 1024)
                .toFixed(1) +
            " KB"
        );

    }


    return (
        (bytes / 1024 / 1024)
            .toFixed(1) +
        " MB"
    );

}



/* =========================================================
   LOAD LIST
========================================================= */

async function loadTracks(){

    try{

        stats.textContent =
            "Загрузка списка Roflan...";


        const response =
            await fetch(
                LIST_URL,
                {
                    cache:
                        "no-store"
                }
            );


        if (
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (
            !Array.isArray(
                data
            )
        ){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks =
            data.filter(
                item =>
                    item &&
                    item.id &&
                    item.name
            );


        filteredTracks =
            [...tracks];


        applySort();

        renderTracks();


        stats.textContent =
            "Roflan: " +
            tracks.length +
            " треков";


    }
    catch(error){

        console.error(
            error
        );


        trackList.innerHTML =
            "";


        empty.style.display =
            "block";


        empty.textContent =
            "Ошибка загрузки Roflan: " +
            error.message;


        stats.textContent =
            "Ошибка загрузки";


    }

}



/* =========================================================
   FILTER
========================================================= */

function applyFilter(){

    const query =
        search.value
            .trim()
            .toLowerCase();


    if (
        !query
    ){

        filteredTracks =
            [...tracks];

    }
    else{

        filteredTracks =
            tracks.filter(
                track =>
                    String(
                        track.name
                    )
                    .toLowerCase()
                    .includes(
                        query
                    )
            );

    }


    applySort();

    renderTracks();

}



/* =========================================================
   SORT
========================================================= */

function applySort(){

    const mode =
        sort.value;


    filteredTracks.sort(
        (a,b) => {

            if (
                mode === "name"
            ){

                return String(a.name)
                    .localeCompare(
                        String(b.name),
                        "ru"
                    );

            }


            if (
                mode === "name-desc"
            ){

                return String(b.name)
                    .localeCompare(
                        String(a.name),
                        "ru"
                    );

            }


            if (
                mode === "size"
            ){

                return (
                    Number(a.size || 0) -
                    Number(b.size || 0)
                );

            }


            if (
                mode === "size-desc"
            ){

                return (
                    Number(b.size || 0) -
                    Number(a.size || 0)
                );

            }


            return 0;

        }
    );

}



/* =========================================================
   RENDER
========================================================= */

function renderTracks(){

    trackList.innerHTML =
        "";


    empty.style.display =
        filteredTracks.length
            ? "none"
            : "block";


    if (
        !filteredTracks.length
    ){

        return;

    }


    filteredTracks.forEach(
        (track, index) => {

            const originalIndex =
                tracks.indexOf(
                    track
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "track";


            if (
                currentTrack &&
                currentTrack.id ===
                track.id
            ){

                item.classList.add(
                    "playing"
                );

            }


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "track-number";


            number.textContent =
                String(
                    index + 1
                );


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "track-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "track-name";


            name.textContent =
                track.name;


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "track-meta";


            meta.textContent =
                formatSize(
                    track.size
                );


            info.appendChild(
                name
            );


            info.appendChild(
                meta
            );


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "track-actions";


            const play =
                document.createElement(
                    "button"
                );


            play.className =
                "icon-button play-button";


            play.title =
                "Воспроизвести";


            play.textContent =
                (
                    currentTrack &&
                    currentTrack.id ===
                    track.id &&
                    !audio.paused
                )
                    ? "❚❚"
                    : "▶";


            play.onclick =
                () => {

                    playTrack(
                        originalIndex
                    );

                };


            const download =
                document.createElement(
                    "button"
                );


            download.className =
                "icon-button download-btn";


            download.title =
                "Скачать";


            download.textContent =
                "↓";


            download.onclick =
                () => {

                    downloadTrack(
                        track
                    );

                };


            const copy =
                document.createElement(
                    "button"
                );


            copy.className =
                "icon-button";


            copy.title =
                "Скопировать ссылку";


            copy.textContent =
                "🔗";


            copy.onclick =
                () => {

                    copyTrackLink(
                        track
                    );

                };


            actions.appendChild(
                play
            );


            actions.appendChild(
                download
            );


            actions.appendChild(
                copy
            );


            item.appendChild(
                number
            );


            item.appendChild(
                info
            );


            item.appendChild(
                actions
            );


            trackList.appendChild(
                item
            );

        }
    );

}



/* =========================================================
   PLAY TRACK
========================================================= */

async function playTrack(
    index
){

    if (
        index < 0 ||
        index >= tracks.length
    ){

        return;

    }


    const track =
        tracks[index];


    currentIndex =
        index;


    currentTrack =
        track;


    const url =
        MUSIC_URL +
        encodeURIComponent(
            track.id
        );


    playerTitle.textContent =
        track.name;


    playerSub.textContent =
        "Roflan";


    audio.src =
        url;


    audio.load();


    try{

        await audio.play();

        playBtn.textContent =
            "❚❚";

    }
    catch(error){

        console.error(
            error
        );

        showToast(
            "Не удалось запустить трек"
        );

        playBtn.textContent =
            "▶";

    }


    renderTracks();

}



/* =========================================================
   PLAY / PAUSE
========================================================= */

playBtn.onclick =
    async () => {

        if (
            !currentTrack
        ){

            if (
                tracks.length
            ){

                await playTrack(
                    0
                );

            }

            return;

        }


        if (
            audio.paused
        ){

            try{

                await audio.play();

                playBtn.textContent =
                    "❚❚";

            }
            catch(error){

                console.error(
                    error
                );

            }

        }
        else{

            audio.pause();

            playBtn.textContent =
                "▶";

        }


        renderTracks();

    };



/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.onclick =
    () => {

        if (
            !tracks.length
        ){

            return;

        }


        let index =
            currentIndex - 1;


        if (
            index < 0
        ){

            index =
                tracks.length - 1;

        }


        playTrack(
            index
        );

    };



/* =========================================================
   NEXT
========================================================= */

nextBtn.onclick =
    () => {

        if (
            !tracks.length
        ){

            return;

        }


        let index =
            currentIndex + 1;


        if (
            index >= tracks.length
        ){

            index =
                0;

        }


        playTrack(
            index
        );

    };



/* =========================================================
   AUTO NEXT
========================================================= */

audio.addEventListener(
    "ended",
    () => {

        if (
            !tracks.length
        ){

            return;

        }


        let next =
            currentIndex + 1;


        if (
            next >= tracks.length
        ){

            next = 0;

        }


        playTrack(
            next
        );

    }
);



/* =========================================================
   PROGRESS
========================================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (
            !audio.duration ||
            !Number.isFinite(
                audio.duration
            )
        ){

            return;

        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) *
            100;


        progress.value =
            percent;


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );


        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);



/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !audio.duration
        ){

            return;

        }


        audio.currentTime =
            (
                Number(
                    progress.value
                ) / 100
            ) *
            audio.duration;

    }
);



/* =========================================================
   VOLUME
========================================================= */

audio.volume =
    Number(
        volume.value
    );


volume.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(
                volume.value
            );

    }
);



/* =========================================================
   DOWNLOAD
========================================================= */

function downloadTrack(
    track
){

    const url =
        MUSIC_URL +
        encodeURIComponent(
            track.id
        ) +
        "?download=1";


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        track.name;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();

}



/* =========================================================
   DOWNLOAD CURRENT
========================================================= */

downloadCurrent.onclick =
    () => {

        if (
            !currentTrack
        ){

            showToast(
                "Сначала выбери трек"
            );

            return;

        }


        downloadTrack(
            currentTrack
        );

    };



/* =========================================================
   COPY LINK
========================================================= */

async function copyTrackLink(
    track
){

    const url =
        MUSIC_URL +
        encodeURIComponent(
            track.id
        );


    try{

        await navigator.clipboard.writeText(
            url
        );


        showToast(
            "Ссылка скопирована"
        );

    }
    catch(error){

        showToast(
            "Не удалось скопировать ссылку"
        );

    }

}



/* =========================================================
   COPY CURRENT
========================================================= */

copyCurrent.onclick =
    () => {

        if (
            !currentTrack
        ){

            showToast(
                "Сначала выбери трек"
            );

            return;

        }


        copyTrackLink(
            currentTrack
        );

    };



/* =========================================================
   SEARCH EVENTS
========================================================= */

search.addEventListener(
    "input",
    () => {

        applyFilter();

    }
);


sort.addEventListener(
    "change",
    () => {

        applyFilter();

    }
);



/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }


        if (
            event.code ===
            "Space"
        ){

            event.preventDefault();

            playBtn.click();

        }


        if (
            event.code ===
            "ArrowRight"
        ){

            if (
                audio.duration
            ){

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 5
                    );

            }

        }


        if (
            event.code ===
            "ArrowLeft"
        ){

            if (
                audio.duration
            ){

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 5
                    );

            }

        }

    }
);



/* =========================================================
   START
========================================================= */

loadTracks();

</script>

</html>
