/* =========================================================

/* =========================================================
   УМНЫЙ ПОИСК
   =========================================================
   
   Поиск использует несколько уровней:

   1. Нормализация
   2. Русский <-> английский
   3. Транслитерация
   4. Фонетические варианты
   5. Музыкальные сокращения
   6. Удаление лишних символов
   7. Поиск по словам
   8. Нечёткое совпадение
   9. Расстояние Левенштейна
   10. Рейтинг результатов

   Поэтому например:

   Daryana
       ->
   Дарьяна

   Miyagi
       ->
   Мияги

   feat
       ->
   фит

   Linkin Park
       ->
   Линкин Парк

   работают без ручного добавления
   каждого исполнителя.
   ========================================================= */


/* =========================================================
   БАЗОВАЯ НОРМАЛИЗАЦИЯ
   ========================================================= */

function normalizeSearchText(text){

    return String(text || "")

        .toLowerCase()

        .replace(
            /ё/g,
            "е"
        )

        .replace(
            /й/g,
            "и"
        )

        .replace(
            /[^a-zа-я0-9\s]/gi,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* =========================================================
   УДАЛЕНИЕ MP3
   ========================================================= */

function cleanTrackName(text){

    return String(text || "")

        .replace(
            /\.mp3$/i,
            ""
        )

        .replace(
            /[\[\]\(\)\{\}_.,!?'"`~]/g,
            " "
        )

        .replace(
            /[-–—]/g,
            " "
        )

        .replace(
            /&/g,
            " and "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* =========================================================
   МУЗЫКАЛЬНЫЕ СООТВЕТСТВИЯ
   ========================================================= */

const MUSIC_ALIASES = {

    ],

/* =========================================================
   АНГЛИЙСКАЯ БУКВА -> РУССКИЕ ВАРИАНТЫ
   ========================================================= */

const RU_MAP = {

    "a":["а"],
    "b":["б"],
    "c":["к","с"],
    "d":["д"],
    "e":["е","э","и"],
    "f":["ф"],

};



/* =========================================================

const EN_MAP = {

/* =========================================================

const PHONETIC_PAIRS = [

/* =========================================================
   ДОБАВИТЬ ФОНЕТИЧЕСКИЕ ПАРЫ
   ========================================================= */

function addPhoneticVariants(
    variants,
    text
){

    const normalized =
        normalizeSearchText(
            text
        )
        .replace(
            /\s/g,
            ""
        );


    PHONETIC_PAIRS.forEach(
        pair => {

            const en =
                pair[0];

            const ru =
                pair[1]
                    .replace(
                        /\s/g,
                        ""
                    );


            if(
                normalized.includes(en)
            ){

                variants.add(
                    ru
                );

            }


            if(
                normalized.includes(ru)
            ){

                variants.add(
                    en
                );

            }

        }
    );

}



/* =========================================================
   СЛОВАРНЫЕ АЛИАСЫ
   ========================================================= */

function addAliasVariants(
    variants,
    text
){

    const words =
        normalizeSearchText(
            text
        ).split(
            " "
        );


    words.forEach(
        word => {

            if(
                MUSIC_ALIASES[word]
            ){

                MUSIC_ALIASES[word]
                    .forEach(
                        alias => {

                            variants.add(
                                normalizeSearchText(
                                    alias
                                )
                            );

                        }
                    );

            }

        }
    );

}



/* =========================================================
   ПРОСТАЯ ТРАНСЛИТЕРАЦИЯ RU -> EN
   ========================================================= */

function transliterateRuToEn(
    text
){

    let result = "";

    const normalized =
        normalizeSearchText(
            text
        );


    for(
        let i = 0;
        i < normalized.length;
        i++
    ){

        const char =
            normalized[i];


        if(
            EN_MAP[char]
        ){

            result +=
                EN_MAP[char][0];

        }
        else{

            result +=
                char;

        }

    }


    return result;

}



/* =========================================================
   ПРОСТАЯ ТРАНСЛИТЕРАЦИЯ EN -> RU
   ========================================================= */

function transliterateEnToRu(
    text
){

    let result = "";

    const normalized =
        normalizeSearchText(
            text
        );


    for(
        let i = 0;
        i < normalized.length;
        i++
    ){

        const char =
            normalized[i];


        if(
            RU_MAP[char]
        ){

            result +=
                RU_MAP[char][0];

        }
        else{

            result +=
                char;

        }

    }


    return result;

}



/* =========================================================
   РАСШИРЕННАЯ ФОНЕТИКА EN -> RU
   ========================================================= */

function phoneticEnglishToRussian(
    text
){

    let value =
        normalizeSearchText(
            text
        );


    const replacements = [

        [/tion/g,"шн"],
        [/sion/g,"жн"],
        [/tch/g,"ч"],
        [/ch/g,"ч"],
        [/sh/g,"ш"],
        [/sch/g,"ш"],
        [/ph/g,"ф"],
        [/th/g,"т"],
        [/ck/g,"к"],
        [/qu/g,"кв"],
        [/wh/g,"в"],
        [/wr/g,"р"],
        [/kn/g,"н"],
        [/oo/g,"у"],
        [/ee/g,"и"],
        [/ea/g,"и"],
        [/ai/g,"эй"],
        [/ay/g,"эй"],
        [/ey/g,"ей"],
        [/oy/g,"ой"],
        [/ou/g,"ау"],
        [/ow/g,"ау"],
        [/au/g,"о"],
        [/aw/g,"о"],
        [/er/g,"ер"],
        [/ar/g,"ар"],
        [/or/g,"ор"],
        [/ir/g,"ир"],
        [/ur/g,"ур"],
        [/tion/g,"шн"],
        [/y$/g,"и"]
    ];


    replacements.forEach(
        replacement => {

            value =
                value.replace(
                    replacement[0],
                    replacement[1]
                );

        }
    );


    return transliterateEnToRu(
        value
    );

}



/* =========================================================
   СОЗДАНИЕ ВАРИАНТОВ СТРОКИ
   ========================================================= */

function createSearchVariants(
    text
){

    const variants =
        new Set();


    const clean =
        cleanTrackName(
            text
        );


    const normalized =
        normalizeSearchText(
            clean
        );


    if(!normalized){

        return variants;

    }


    variants.add(
        normalized
    );


    variants.add(
        normalized.replace(
            /\s/g,
            ""
        )
    );


    variants.add(
        transliterateRuToEn(
            normalized
        )
    );


    variants.add(
        transliterateEnToRu(
            normalized
        )
    );


    variants.add(
        phoneticEnglishToRussian(
            normalized
        )
    );


    addPhoneticVariants(
        variants,
        normalized
    );


    addAliasVariants(
        variants,
        normalized
    );


    /*
     * Добавляем варианты отдельных слов.
     */

    const words =
        normalized.split(
            " "
        );


    words.forEach(
        word => {

            if(
                word.length < 2
            ){

                return;

            }


            variants.add(
                word
            );


            variants.add(
                transliterateRuToEn(
                    word
                )
            );


            variants.add(
                transliterateEnToRu(
                    word
                )
            );


            variants.add(
                phoneticEnglishToRussian(
                    word
                )
            );


            addPhoneticVariants(
                variants,
                word
            );


            addAliasVariants(
                variants,
                word
            );

        }
    );


    return variants;

}



/* =========================================================
   LEVENSHTEIN
   ========================================================= */

function levenshtein(
    a,
    b
){

    a =
        String(a || "");


    b =
        String(b || "");


    if(
        a === b
    ){

        return 0;

    }


    if(!a.length){

        return b.length;

    }


    if(!b.length){

        return a.length;

    }


    /*
     * Для очень длинных строк
     * не тратим лишние ресурсы.
     */

    if(
        Math.abs(
            a.length -
            b.length
        ) > 6
    ){

        return 99;

    }


    let previous =
        new Array(
            b.length + 1
        );


    let current =
        new Array(
            b.length + 1
        );


    for(
        let j = 0;
        j <= b.length;
        j++
    ){

        previous[j] =
            j;

    }


    for(
        let i = 1;
        i <= a.length;
        i++
    ){

        current[0] =
            i;


        for(
            let j = 1;
            j <= b.length;
            j++
        ){

            const cost =
                a[i - 1] === b[j - 1]
                    ? 0
                    : 1;


            current[j] =
                Math.min(

                    current[j - 1] + 1,

                    previous[j] + 1,

                    previous[j - 1] + cost

                );

        }


        const temp =
            previous;


        previous =
            current;


        current =
            temp;

    }


    return previous[
        b.length
    ];

}



/* =========================================================
   ПОХОЖЕСТЬ СЛОВ
   ========================================================= */

function wordSimilarity(
    a,
    b
){

    a =
        normalizeSearchText(
            a
        )
        .replace(
            /\s/g,
            ""
        );


    b =
        normalizeSearchText(
            b
        )
        .replace(
            /\s/g,
            ""
        );


    if(
        !a ||
        !b
    ){

        return 0;

    }


    if(
        a === b
    ){

        return 1;

    }


    if(
        a.includes(b) ||
        b.includes(a)
    ){

        const shorter =
            Math.min(
                a.length,
                b.length
            );


        const longer =
            Math.max(
                a.length,
                b.length
            );


        return (
            0.82 +
            (
                shorter /
                longer
            ) * 0.18
        );

    }


    const distance =
        levenshtein(
            a,
            b
        );


    const maxLength =
        Math.max(
            a.length,
            b.length
        );


    if(
        distance >= 99
    ){

        return 0;

    }


    return Math.max(
        0,
        1 -
        (
            distance /
            maxLength
        )
    );

}



/* =========================================================
   ОЦЕНКА ОДНОГО ТРЕКА
   ========================================================= */

function scoreTrack(
    track,
    query
){

    const cleanName =
        cleanTrackName(
            track.name
        );


    const normalizedName =
        normalizeSearchText(
            cleanName
        );


    const normalizedQuery =
        normalizeSearchText(
            query
        );


    if(
        !normalizedQuery ||
        !normalizedName
    ){

        return 0;

    }


    /*
     * Полное точное совпадение.
     */

    if(
        normalizedName ===
        normalizedQuery
    ){

        return 1000;

    }


    const nameVariants =
        createSearchVariants(
            cleanName
        );


    const queryVariants =
        createSearchVariants(
            normalizedQuery
        );


    let best =
        0;


    /*
     * Сравниваем варианты целиком.
     */

    queryVariants.forEach(
        qVariant => {

            if(
                !qVariant
            ){

                return;

            }


            nameVariants.forEach(
                nVariant => {

                    if(
                        !nVariant
                    ){

                        return;

                    }


                    if(
                        nVariant ===
                        qVariant
                    ){

                        best =
                            Math.max(
                                best,
                                920
                            );

                        return;

                    }


                    if(
                        nVariant.includes(
                            qVariant
                        )
                    ){

                        const ratio =
                            qVariant.length /
                            Math.max(
                                1,
                                nVariant.length
                            );


                        best =
                            Math.max(
                                best,
                                650 +
                                ratio * 180
                            );

                    }


                    const similarity =
                        wordSimilarity(
                            qVariant,
                            nVariant
                        );


                    best =
                        Math.max(
                            best,
                            similarity * 600
                        );

                }
            );

        }
    );


    /*
     * Поиск по отдельным словам.
     */

    const queryWords =
        normalizedQuery
            .split(
                " "
            )
            .filter(
                word =>
                    word.length >= 2
            );


    const nameWords =
        normalizedName
            .split(
                " "
            )
            .filter(
                word =>
                    word.length >= 2
            );


    if(
        queryWords.length
    ){

        let matched =
            0;


        let totalScore =
            0;


        queryWords.forEach(
            qWord => {

                let bestWord =
                    0;


                const qVariants =
                    createSearchVariants(
                        qWord
                    );


                qVariants.forEach(
                    qVariant => {

                        nameWords.forEach(
                            nWord => {

                                const nVariants =
                                    createSearchVariants(
                                        nWord
                                    );


                                nVariants.forEach(
                                    nVariant => {

                                        const similarity =
                                            wordSimilarity(
                                                qVariant,
                                                nVariant
                                            );


                                        if(
                                            similarity >
                                            bestWord
                                        ){

                                            bestWord =
                                                similarity;

                                        }

                                    }
                                );

                            }
                        );

                    }
                );


                if(
                    bestWord >=
                    0.55
                ){

                    matched++;

                    totalScore +=
                        bestWord;

                }

            }
        );


        if(
            matched
        ){

            const wordScore =
                (
                    totalScore /
                    queryWords.length
                );


            const coverage =
                matched /
                queryWords.length;


            best =
                Math.max(
                    best,
                    wordScore *
                    coverage *
                    850
                );

        }

    }


    /*
     * Небольшой бонус,
     * если запрос встречается
     * непосредственно в названии.
     */

    if(
        normalizedName.includes(
            normalizedQuery
        )
    ){

        best =
            Math.max(
                best,
                880
            );

    }


    /*
     * Бонус за начало слова.
     */

    if(
        nameWords.some(
            word =>
                word.startsWith(
                    normalizedQuery
                )
        )
    ){

        best =
            Math.max(
                best,
                840
            );

    }


    return best;

}



/* =========================================================
   ЗАГРУЗКА СПИСКА
   ========================================================= */

async function loadMusic(){

    try{

        const url =
            LIST_URL +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks =
            data.filter(
                track =>
                    track &&
                    track.id &&
                    track.name
            );


        renderTracks();


    }
    catch(error){

        console.error(
            "Ошибка загрузки музыки:",
            error
        );


        musicList.innerHTML = `

            <div class="status error">

                <strong>
                    🎧 Не удалось загрузить музыку
                </strong>

                <div>
                    Worker HTTP ошибка
                </div>

                <br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

                <br><br>

                <button
                    class="btn download-btn"
                    onclick="loadMusic()"
                    style="max-width:220px;padding:10px 20px"
                >
                    ↻ Повторить
                </button>

            </div>

        `;

    }

}



/* =========================================================
   PLAY URL
   ========================================================= */

function getPlayURL(track){

    return (
        WORKER_URL +
        "/music/" +
        encodeURIComponent(
            track.id
        )
    );

}



/* =========================================================
   DOWNLOAD URL
   ========================================================= */

function getDownloadURL(track){

    return (
        getPlayURL(track) +
        "?download=1"
    );

}



/* =========================================================
   ОСТАНОВИТЬ ВСЕ ТРЕКИ
   ========================================================= */

function stopAllAudio(
    exceptAudio = null
){

    const allAudio =
        document.querySelectorAll(
            "audio"
        );


    allAudio.forEach(
        audio => {

            if(
                audio === exceptAudio
            ){

                return;

            }


            try{

                audio.pause();

                audio.currentTime = 0;

            }
            catch(error){

                console.warn(
                    "Ошибка остановки audio:",
                    error
                );

            }

        }
    );


    if(
        currentAudio &&
        currentAudio !== exceptAudio
    ){

        currentAudio = null;

    }

}



/* =========================================================
   НАСТРОИТЬ AUDIO
   ========================================================= */

function setupAudio(
    audio
){

    if(!audio){

        return;

    }


    audio.addEventListener(
        "play",
        function(){

            if(
                currentAudio &&
                currentAudio !== audio
            ){

                try{

                    currentAudio.pause();

                    currentAudio.currentTime = 0;

                }
                catch(error){

                    console.warn(
                        "Ошибка остановки предыдущего трека:",
                        error
                    );

                }

            }


            const allAudio =
                document.querySelectorAll(
                    "audio"
                );


            allAudio.forEach(
                otherAudio => {

                    if(
                        otherAudio !== audio &&
                        !otherAudio.paused
                    ){

                        try{

                            otherAudio.pause();

                            otherAudio.currentTime = 0;

                        }
                        catch(error){

                            console.warn(
                                "Ошибка остановки audio:",
                                error
                            );

                        }

                    }

                }
            );


            currentAudio =
                audio;

        }
    );


    audio.addEventListener(
        "ended",
        function(){

            if(
                currentAudio === audio
            ){

                currentAudio = null;

            }

        }
    );

}



/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function renderTracks(){

    const query =
        searchInput.value
            .trim();


    /*
     * Если поиск пустой —
     * показываем всё как раньше.
     */

    let filtered;


    if(
        !query
    ){

        filtered =
            tracks.map(
                track => ({
                    track:track,
                    score:0
                })
            );

    }
    else{

        /*
         * Считаем рейтинг каждого трека.
         */

        filtered =
            tracks
                .map(
                    track => ({

                        track:
                            track,

                        score:
                            scoreTrack(
                                track,
                                query
                            )

                    })
                )

                .filter(
                    item =>
                        item.score >= 300
                )

                .sort(
                    (a,b) =>
                        b.score -
                        a.score
                );

    }


    stopAllAudio();


    if(!filtered.length){

        musicList.innerHTML = `

            <div class="empty">

                🎵 Ничего не найдено

            </div>

        `;

        currentAudio = null;

        return;

    }


    musicList.innerHTML =
        filtered
            .map(
                item =>
                    createTrackHTML(
                        item.track
                    )
            )
            .join("");


    filtered.forEach(
        item => {

            const track =
                item.track;


            const audio =
                document.getElementById(
                    "audio-" +
                    track.id
                );


            if(audio){

                audio.src =
                    getPlayURL(
                        track
                    );


                setupAudio(
                    audio
                );

            }

        }
    );

}



/* =========================================================
   СОЗДАНИЕ КАРТОЧКИ
   ========================================================= */

function createTrackHTML(track){

    const id =
        escapeHTML(
            String(
                track.id
            )
        );


    const name =
        escapeHTML(
            removeExtension(
                String(
                    track.name || ""
                )
            )
        );


    return `

        <div
            class="track"
            data-track-id="${id}"
        >

            <div class="track-title">

                <span class="track-icon">
                    🎵
                </span>

                <span class="track-name">
                    ${name}
                </span>

            </div>


            <audio
                id="audio-${id}"
                class="audio"
                controls
                preload="metadata"
            >

                Ваш браузер не поддерживает
                воспроизведение аудио.

            </audio>


            <div class="buttons">


                <a
                    class="btn download-btn"
                    href="${escapeAttribute(
                        getDownloadURL(track)
                    )}"
                    download
                    target="_self"
                >
                    ↓ Скачать MP3
                </a>


                <button
                    class="btn copy-btn"
                    type="button"
                    onclick="copyMusicLink(this, '${escapeJS(
                        getPlayURL(track)
                    )}')"
                >
                    🔗 Копировать ссылку
                </button>


            </div>

        </div>

    `;

}



/* =========================================================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================================================= */

async function copyMusicLink(
    button,
    url
){

    const oldText =
        button.textContent;


    try{

        await navigator.clipboard.writeText(
            url
        );


        button.textContent =
            "✓ Ссылка скопирована";


        button.classList.add(
            "copied"
        );


        setTimeout(
            () => {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1800
        );


    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            url;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try{

            success =
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success =
                false;

        }


        textarea.remove();


        if(success){

            button.textContent =
                "✓ Ссылка скопирована";


            button.classList.add(
                "copied"
            );


            setTimeout(
                () => {

                    button.textContent =
                        oldText;

                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "Скопируй эту ссылку:",
                url
            );

        }

    }

}



/* =========================================================
   ПОИСК
   ========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderTracks();

    }
);



/* =========================================================
   УДАЛИТЬ .MP3
   ========================================================= */

function removeExtension(name){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}



/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}



/* =========================================================
   JS STRING ESCAPE
   ========================================================= */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}



/* =========================================================
   НАВЕРХ
   ========================================================= */

function scrollTopPage(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================================================
   ЗАПУСК

loadMusic();
