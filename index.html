<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>МаЛяВоЧка - Music</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:
        radial-gradient(
            circle at 70% 20%,
            rgba(0,255,170,0.045),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(0,130,255,0.035),
            transparent 40%
        ),
        #090b0c;

    color:#eee;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;
    bottom:0;

    width:184px;

    background:
        linear-gradient(
            180deg,
            #16181b,
            #101113
        );

    border-right:
        1px solid
        rgba(255,255,255,0.08);

    z-index:100;

    padding-top:240px;

}


.sidebar-item{

    display:flex;

    align-items:center;

    gap:14px;

    padding:
        16px
        30px;

    color:#ddd;

    font-size:19px;

    cursor:pointer;

    transition:
        background .2s,
        color .2s,
        transform .2s;

}


.sidebar-item:hover{

    background:
        rgba(0,255,170,0.06);

    color:#00ffae;

}


.sidebar-icon{

    width:24px;

    text-align:center;

    font-size:20px;

}


.sidebar-text{

    line-height:1.1;

}


/* =========================================================
   MAIN
   ========================================================= */

.main{

    margin-left:184px;

    min-height:100vh;

}


/* =========================================================
   HEADER
   ========================================================= */

.header{

    position:sticky;

    top:0;

    z-index:50;

    min-height:114px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        18px
        30px;

    background:

        linear-gradient(
            180deg,
            rgba(24,25,28,.97),
            rgba(20,21,23,.94)
        );

    border-bottom:
        1px solid
        rgba(255,255,255,0.08);

}


.header-title{

    margin:0;

    color:#00f7a5;

    font-size:39px;

    font-weight:800;

    letter-spacing:.5px;

    text-align:center;

    text-shadow:
        0 0 10px rgba(0,255,170,.45),
        0 0 25px rgba(0,255,170,.18);

}


.search-wrap{

    position:absolute;

    right:24px;

    top:34px;

}


.search{

    width:252px;

    height:45px;

    border-radius:25px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(0,0,0,.24);

    color:#fff;

    outline:none;

    padding:
        0 18px 0 43px;

    font-size:15px;

    transition:
        border-color .2s,
        box-shadow .2s;

}


.search:focus{

    border-color:
        rgba(0,255,170,.55);

    box-shadow:
        0 0 15px
        rgba(0,255,170,.08);

}


.search::placeholder{

    color:#777;

}


.search-icon{

    position:absolute;

    left:16px;

    top:12px;

    color:#aaa;

    font-size:19px;

    pointer-events:none;

}


/* =========================================================
   CONTENT
   ========================================================= */

.content{

    max-width:850px;

    margin:0 auto;

    padding:
        34px
        30px
        30px;

}


/* =========================================================
   STATUS
   ========================================================= */

.status{

    text-align:center;

    padding:60px 20px;

    color:#777;

    font-size:17px;

}


.status.loading{

    color:#888;

}


.status.error{

    max-width:700px;

    margin:40px auto;

    padding:30px;

    border:
        1px solid
        rgba(255,60,60,.25);

    background:
        rgba(80,10,10,.16);

    border-radius:14px;

    color:#ff7777;

}


.status.error strong{

    display:block;

    color:#ff4f4f;

    margin-bottom:15px;

    font-size:18px;

}


/* =========================================================
   TRACK CARD
   ========================================================= */

.track{

    background:

        linear-gradient(
            135deg,
            rgba(31,33,34,.92),
            rgba(21,22,23,.92)
        );

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius:16px;

    padding:
        17px;

    margin-bottom:13px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;

}


.track:hover{

    transform:
        translateY(-1px);

    border-color:
        rgba(0,255,170,.18);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.26);

}


.track-title{

    display:flex;

    align-items:center;

    gap:10px;

    color:#f0f0f0;

    font-size:19px;

    font-weight:600;

    margin-bottom:10px;

    overflow:hidden;

}


.track-icon{

    font-size:25px;

    flex:none;

}


.track-name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


/* =========================================================
   AUDIO
   ========================================================= */

.audio{

    width:100%;

    height:42px;

    display:block;

    margin-bottom:10px;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{

    display:flex;

    gap:9px;

}


.btn{

    flex:1;

    min-height:34px;

    border:0;

    border-radius:7px;

    cursor:pointer;

    font-size:15px;

    font-weight:700;

    color:white;

    transition:
        filter .15s,
        transform .1s,
        opacity .15s;

}


.btn:hover{

    filter:
        brightness(1.08);

}


.btn:active{

    transform:
        scale(.985);

}


.download-btn{

    background:
        #00c985;

}


.copy-btn{

    background:
        #1389d7;

}


.copy-btn.copied{

    background:
        #00b878;

}


.download-btn{

    text-decoration:none;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================================
   PAGINATION
   ========================================================= */

.pagination{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;

    margin-top:28px;

    padding:
        10px
        0
        35px;

}


.page-btn{

    min-width:40px;

    height:40px;

    padding:
        0
        11px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:9px;

    background:
        rgba(255,255,255,.045);

    color:#ddd;

    cursor:pointer;

    font-size:15px;

    font-weight:700;

    transition:
        background .15s,
        border-color .15s,
        color .15s,
        transform .1s;

}


.page-btn:hover{

    background:
        rgba(0,255,170,.10);

    border-color:
        rgba(0,255,170,.28);

    color:#00ffae;

}


.page-btn:active{

    transform:
        scale(.95);

}


.page-btn.active{

    background:
        #00c985;

    border-color:
        #00c985;

    color:#07100d;

}


.page-btn.arrow{

    font-size:19px;

}


.page-btn:disabled{

    opacity:.3;

    cursor:not-allowed;

}


.page-dots{

    color:#777;

    padding:
        0
        3px;

    font-weight:bold;

}


/* =========================================================
   PAGE INFO
   ========================================================= */

.page-info{

    text-align:center;

    color:#666;

    font-size:13px;

    margin-top:-15px;

    margin-bottom:10px;

}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{

    text-align:center;

    color:#777;

    padding:80px 20px;

    font-size:17px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

    .sidebar{

        width:70px;

        padding-top:170px;

    }


    .sidebar-item{

        justify-content:center;

        padding:

    .sidebar-text{

        display:none;

    }


    .main{

        margin-left:70px;

    }


    .header{

        min-height:135px;

        padding-top:15px;

        align-items:flex-start;

    }


    .header-title{

        font-size:27px;

        padding-top:3px;

    }


    .search-wrap{

        position:absolute;

        top:77px;

        left:20px;

        right:20px;

    }


    .search{

        width:100%;

    }


    .content{

        padding:
            25px 15px 40px;

    }

}


@media(max-width:600px){

    .buttons{

        flex-direction:column;

    }


    .btn{

        min-height:42px;

    }


    .track-title{

        font-size:17px;

    }


    .pagination{

        gap:5px;

    }


    .page-btn{

        min-width:36px;

        height:36px;

        padding:
            0
            8px;

    }

}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar{

    width:9px;

}


::-webkit-scrollbar-track{

    background:#090a0b;

}


::-webkit-scrollbar-thumb{

    background:#292c2e;

    border-radius:10px;

}


::-webkit-scrollbar-thumb:hover{

    background:#363a3d;

}

</style>

   ======================================================= -->

<div class="sidebar">

    <div
        class="sidebar-item"
        onclick="scrollTopPage()"
    >

        <div class="sidebar-icon">
            🎧
        </div>

        <div class="sidebar-text">

    </div>


    <div class="sidebar-item">

        <div class="sidebar-icon">

        </div>

        <div class="sidebar-text">
            Роффл<br>звуки
        </div>

    </div>


    <div class="sidebar-item">

        <div class="sidebar-icon">
            🎤
        </div>

        <div class="sidebar-text">
            Gachi
        </div>

    </div>


    <div class="sidebar-item">

        <div class="sidebar-icon">
            😱
        </div>

        <div class="sidebar-text">
            Скримеры
        </div>

    </div>

</div>



<!-- =======================================================
   MAIN
   ======================================================= -->

<div class="main">


    <!-- ===================================================
       HEADER
       =================================================== -->

    <header class="header">

        <h1 class="header-title">
            🎧 МаЛяВоЧка - Music 🎧
        </h1>


        <div class="search-wrap">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Найти трек..."
                autocomplete="off"
            >

        </div>

    </header>



    <!-- ===================================================
       CONTENT
       =================================================== -->

    <main
        id="musicList"
        class="content"
    >

        <div class="status loading">

            Загрузка музыки... 🎵

        </div>

    </main>


</div>



<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const WORKER_URL =
    "https://malyavochka-music.rxmlopdt.workers.dev";


const LIST_URL =
    WORKER_URL + "/list.json";


/*
 * Сколько треков показывать
 * на одной странице.
 */

const TRACKS_PER_PAGE = 50;


/* =========================================================
   DOM
   ========================================================= */

const musicList =
    document.getElementById(
        "musicList"
    );


const searchInput =
    document.getElementById(
        "search"
    );


/* =========================================================
   ДАННЫЕ
   ========================================================= */

let tracks = [];


/*
 * Текущая страница.
 */

let currentPage = 1;


/* =========================================================
   ТЕКУЩИЙ ИГРАЮЩИЙ ТРЕК
   ========================================================= */

let currentAudio = null;



/* =========================================================
   ЗАГРУЗКА СПИСКА
   ========================================================= */

async function loadMusic(){

    try{

        const url =
            LIST_URL +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks =
            data.filter(
                track =>
                    track &&
                    track.id &&
                    track.name
            );


        currentPage = 1;

        renderTracks();


    }
    catch(error){

        console.error(
            "Ошибка загрузки музыки:",
            error
        );


        musicList.innerHTML = `

            <div class="status error">

                <strong>
                    🎧 Не удалось загрузить музыку
                </strong>

                <div>
                    Worker HTTP ошибка
                </div>

                <br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

                <br><br>

                <button
                    class="btn download-btn"
                    onclick="loadMusic()"
                    style="max-width:220px;padding:10px 20px"
                >
                    ↻ Повторить
                </button>

            </div>

        `;

    }

}



/* =========================================================
   PLAY URL
   ========================================================= */

function getPlayURL(track){

    return (
        WORKER_URL +
        "/music/" +
        encodeURIComponent(
            track.id
        )
    );

}



/* =========================================================
   DOWNLOAD URL
   ========================================================= */

function getDownloadURL(track){

    return (
        getPlayURL(track) +
        "?download=1"
    );

}



/* =========================================================
   ОСТАНОВИТЬ ВСЕ ТРЕКИ
   ========================================================= */

function stopAllAudio(
    exceptAudio = null
){

    const allAudio =
        document.querySelectorAll(
            "audio"
        );


    allAudio.forEach(
        audio => {

            if(
                audio === exceptAudio
            ){

                return;

            }


            try{

                audio.pause();

                audio.currentTime = 0;

            }
            catch(error){

                console.warn(
                    "Ошибка остановки audio:",
                    error
                );

            }

        }
    );


    if(
        currentAudio &&
        currentAudio !== exceptAudio
    ){

        currentAudio = null;

    }

}



/* =========================================================
   НАСТРОИТЬ AUDIO
   ========================================================= */

function setupAudio(
    audio
){

    if(!audio){

        return;

    }


    audio.addEventListener(
        "play",
        function(){

            if(
                currentAudio &&
                currentAudio !== audio
            ){

                try{

                    currentAudio.pause();

                    currentAudio.currentTime = 0;

                }
                catch(error){

                    console.warn(
                        "Ошибка остановки предыдущего трека:",
                        error
                    );

                }

            }


            const allAudio =
                document.querySelectorAll(
                    "audio"
                );


            allAudio.forEach(
                otherAudio => {

                    if(
                        otherAudio !== audio &&
                        !otherAudio.paused
                    ){

                        try{

                            otherAudio.pause();

                            otherAudio.currentTime = 0;

                        }
                        catch(error){

                            console.warn(
                                "Ошибка остановки audio:",
                                error
                            );

                        }

                    }

                }
            );


            currentAudio =
                audio;

        }
    );


    audio.addEventListener(
        "ended",
        function(){

            if(
                currentAudio === audio
            ){

                currentAudio = null;

            }

        }
    );

}



/* =========================================================
   ПОЛУЧИТЬ ОТФИЛЬТРОВАННЫЕ ТРЕКИ
   ========================================================= */

function getFilteredTracks(){

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    return tracks.filter(
        track =>
            String(
                track.name || ""
            )
            .toLowerCase()
            .includes(query)
    );

}



/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function renderTracks(){

    /*
     * Сначала фильтруем ВЕСЬ каталог.
     *
     * Поэтому поиск работает по всем трекам,
     * даже если сейчас открыта страница 4.
     */

    const filtered =
        getFilteredTracks();


    /*
     * Считаем количество страниц.
     */

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filtered.length /
                TRACKS_PER_PAGE
            )
        );


    /*
     * Если после поиска текущая
     * страница стала слишком большой —
     * возвращаемся на последнюю.
     */

    if(
        currentPage > totalPages
    ){

        currentPage =
            totalPages;

    }


    /*
     * Останавливаем музыку
     * перед перерисовкой.
     */

    stopAllAudio();


    if(!filtered.length){

        musicList.innerHTML = `

            <div class="empty">

                🎵 Ничего не найдено

            </div>

        `;

        currentAudio = null;

        return;

    }


    /*
     * Индексы треков текущей страницы.
     */

    const start =
        (
            currentPage - 1
        ) *
        TRACKS_PER_PAGE;


    const end =
        start +
        TRACKS_PER_PAGE;


    const pageTracks =
        filtered.slice(
            start,
            end
        );


    /*
     * Карточки.
     */

    musicList.innerHTML =
        pageTracks
            .map(
                track =>
                    createTrackHTML(
                        track
                    )
            )
            .join("");


    /*
     * Источники audio.
     */

    pageTracks.forEach(
        track => {

            const audio =
                document.getElementById(
                    "audio-" +
                    track.id
                );


            if(audio){

                audio.src =
                    getPlayURL(
                        track
                    );


                setupAudio(
                    audio
                );

            }

        }
    );


    /*
     * Пагинация.
     */

    musicList.innerHTML +=
        createPaginationHTML(
            totalPages,
            filtered.length,
            start,
            end
        );

}



/* =========================================================
   ПАГИНАЦИЯ
   ========================================================= */

function createPaginationHTML(
    totalPages,
    totalTracks,
    start,
    end
){

    /*
     * Если всего одна страница,
     * кнопки страниц не нужны.
     */

    if(totalPages <= 1){

        return "";

    }


    let html = `

        <div class="pagination">

            <button
                class="page-btn arrow"
                onclick="changePage(${currentPage - 1})"
                ${currentPage === 1 ? "disabled" : ""}
            >
                ←
            </button>

    `;


    /*
     * Делаем компактную пагинацию.
     *
     * Например:
     *
     * 1 2 3 4 5 ... 20
     *
     * или:
     *
     * 1 ... 8 9 10 11 12 ... 20
     */

    const pages =
        getPageNumbers(
            currentPage,
            totalPages
        );


    let previousPage =
        null;


    pages.forEach(
        page => {

            if(
                previousPage !== null &&
                page - previousPage > 1
            ){

                html += `

                    <span class="page-dots">
                        ...
                    </span>

                `;

            }


            html += `

                <button
                    class="page-btn ${
                        page === currentPage
                            ? "active"
                            : ""
                    }"
                    onclick="changePage(${page})"
                >
                    ${page}
                </button>

            `;


            previousPage =
                page;

        }
    );


    html += `

            <button
                class="page-btn arrow"
                onclick="changePage(${currentPage + 1})"
                ${currentPage === totalPages ? "disabled" : ""}
            >
                →
            </button>

        </div>


        <div class="page-info">

            Показано
            ${start + 1}
            –
            ${Math.min(end, totalTracks)}
            из
            ${totalTracks}

        </div>

    `;


    return html;

}



/* =========================================================
   НОМЕРА СТРАНИЦ
   ========================================================= */

function getPageNumbers(
    current,
    total
){

    /*
     * Если страниц мало —
     * показываем все.
     */

    if(total <= 7){

        return Array.from(
            {
                length: total
            },
            (_, index) =>
                index + 1
        );

    }


    const pages = [];


    /*
     * Всегда первая страница.
     */

    pages.push(1);


    /*
     * Начало.
     */

    if(current <= 4){

        pages.push(2);
        pages.push(3);
        pages.push(4);
        pages.push(5);

    }


    /*
     * Середина.
     */

    else if(
        current >= 5 &&
        current <= total - 4
    ){

        pages.push(
            current - 1
        );

        pages.push(
            current
        );

        pages.push(
            current + 1
        );

    }


    /*
     * Конец.
     */

    else{

        pages.push(
            total - 4
        );

        pages.push(
            total - 3
        );

        pages.push(
            total - 2
        );

        pages.push(
            total - 1
        );

    }


    /*
     * Всегда последняя.
     */

    if(
        !pages.includes(total)
    ){

        pages.push(total);

    }


    /*
     * Убираем дубликаты
     * и сортируем.
     */

    return [
        ...new Set(pages)
    ].sort(
        (a,b) =>
            a - b
    );

}



/* =========================================================
   ПЕРЕХОД НА СТРАНИЦУ
   ========================================================= */

function changePage(
    page
){

    const filtered =
        getFilteredTracks();


    const totalPages =
        Math.max(
            1,
            Math.ceil(
                filtered.length /
                TRACKS_PER_PAGE
            )
        );


    if(
        page < 1 ||
        page > totalPages
    ){

        return;

    }


    /*
     * Останавливаем текущую музыку.
     */

    stopAllAudio();


    currentAudio = null;


    currentPage =
        page;


    renderTracks();


    /*
     * Возвращаем пользователя
     * наверх списка.
     */

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================================================
   СОЗДАНИЕ КАРТОЧКИ
   ========================================================= */

function createTrackHTML(track){

    const id =
        escapeHTML(
            String(
                track.id
            )
        );


    const name =
        escapeHTML(
            removeExtension(
                String(
                    track.name || ""
                )
            )
        );


    return `

        <div
            class="track"
            data-track-id="${id}"
        >

            <div class="track-title">

                <span class="track-icon">
                    🎵
                </span>

                <span class="track-name">
                    ${name}
                </span>

            </div>


            <audio
                id="audio-${id}"
                class="audio"
                controls
                preload="metadata"
            >

                Ваш браузер не поддерживает
                воспроизведение аудио.

            </audio>


            <div class="buttons">


                <a
                    class="btn download-btn"
                    href="${escapeAttribute(
                        getDownloadURL(track)
                    )}"
                    download
                    target="_self"
                >
                    ↓ Скачать MP3
                </a>


                <button
                    class="btn copy-btn"
                    type="button"
                    onclick="copyMusicLink(this, '${escapeJS(
                        getPlayURL(track)
                    )}')"
                >
                    🔗 Копировать ссылку
                </button>


            </div>

        </div>

    `;

}



/* =========================================================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================================================= */

async function copyMusicLink(
    button,
    url
){

    const oldText =
        button.textContent;


    try{

        await navigator.clipboard.writeText(
            url
        );


        button.textContent =
            "✓ Ссылка скопирована";


        button.classList.add(
            "copied"
        );


        setTimeout(
            () => {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1800
        );


    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            url;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try{

            success =
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success =
                false;

        }


        textarea.remove();


        if(success){

            button.textContent =
                "✓ Ссылка скопирована";


            button.classList.add(
                "copied"
            );


            setTimeout(
                () => {

                    button.textContent =
                        oldText;

                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "Скопируй эту ссылку:",
                url
            );

        }

    }

}

/* =========================================================
   УДАЛИТЬ .MP3
   ========================================================= */

function removeExtension(name){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}



/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}



/* =========================================================
   JS STRING ESCAPE
   ========================================================= */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}
