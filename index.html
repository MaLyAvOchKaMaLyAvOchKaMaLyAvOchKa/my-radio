top:50%;

translateY(-50%);

rgba(20,20,22,.85);

inset 0 0 15px rgba(0,0,0,.25)

0 0 12px rgba(0,255,136,.18),
inset 0 0 15px rgba(0,0,0,.25)
}

width:45px;

}

width:11px;

height:11px;

border:
2px solid #aaa;

top:12px;

transition:.2s
}

content:"";

height:2px;

background:#aaa;

rotate(45deg);

}

.search-icon:before{

.search-icon:after{

0 15px 0 0

rgba(255,50,50,.06);

.song:hover{

rgba(0,255,136,.18);

}

/* =========================================================

0 0 9px

header{

25px 10px

18px auto 0;

}

<script>


/* =========================================================
   MaLyAvOchKa Music
   ========================================================= */


/* =========================================================
   WORKER
   ========================================================= */

const WORKER =
"https://malyavochka-music.rxmlopdt.workers.dev";


const LIST_URL =
WORKER + "/list";


/*
   Кэш списка.

   Если Worker временно не ответил,
   сайт не останется пустым.
*/

const CACHE_KEY =
"malyavochka_music_list_v1";


/* =========================================================
   VARIABLES
   ========================================================= */

let songs=[];

let players=[];

let currentAudio=null;


/* =========================================================
   TRANSLIT
   ========================================================= */

const translit={

"а":"a",
"б":"b",
"в":"v",
"г":"g",
"д":"d",
"е":"e",
"ё":"yo",
"ж":"zh",
"з":"z",
"и":"i",
"й":"y",
"к":"k",
"л":"l",
"м":"m",
"н":"n",
"о":"o",
"п":"p",
"р":"r",
"с":"s",
"т":"t",
"у":"u",
"ф":"f",
"х":"h",
"ц":"ts",
"ч":"ch",
"ш":"sh",
"щ":"sch",
"ъ":"",
"ы":"y",
"ь":"",
"э":"e",
"ю":"yu",
"я":"ya"

};


/* =========================================================
   FETCH WITH RETRIES
   ========================================================= */

async function fetchList(){

let lastError=null;


/*
   Пробуем Worker несколько раз.

   Это защищает от временного сбоя.
*/

for(
let attempt=1;
attempt<=3;
attempt++
){

try{

const response=
await fetch(
LIST_URL+
"?t="+
Date.now()+
"&attempt="+
attempt,
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const text=
await response.text();


if(!text.trim()){

throw new Error(
"Worker вернул пустой список"
);

}


return text;


}catch(error){

lastError=error;

console.warn(
"Попытка загрузки списка:",
attempt,
error
);


/*
   Небольшая задержка
   между попытками.
*/

if(attempt<3){

await new Promise(
resolve=>
setTimeout(
resolve,
700
)
);

}

}

}


throw lastError ||
new Error("Не удалось получить список");

}


/* =========================================================
   PARSE LIST
   ========================================================= */

function parseList(text){

const lines=
text
.split(/\r?\n/)
.map(
line=>line.trim()
)
.filter(Boolean);


const musicFiles=[];


/*
   Поддерживаем формат:

   3454af22 → Music/Миа.mp3

   а также возможные варианты
   с пробелами.
*/

for(
const line of lines
){

let match=
line.match(
/^\s*([a-fA-F0-9]{8}|\d{8})\s+→\s+(.+?)\s*$/
);


if(!match){

continue;

}


const id=
match[1];


let filePath=
match[2].trim();


/*
   Иногда путь может быть URL-encoded.
*/

try{

filePath=
decodeURIComponent(
filePath
);

}catch(e){}


/*
   Берём только Music/.
*/

if(
!filePath
.toLowerCase()
.startsWith("music/")
){

continue;

}


/*
   Только MP3.
*/

if(
!filePath
.toLowerCase()
.endsWith(".mp3")
){

continue;

}


const fileName=
filePath.substring(
6
);


musicFiles.push({

id:id,

name:fileName,

path:filePath

});

}


/*
   Убираем дубликаты.
*/

const unique=
new Map();


for(
const file of musicFiles
){

unique.set(
file.id,
file
);

}


/*
   Сортировка.
*/

return [
...unique.values()
].sort(
(a,b)=>
a.name.localeCompare(
b.name,
"ru",
{
numeric:true,
sensitivity:"base"
}
)
);


/* =========================================================
   LOAD MUSIC
   ========================================================= */

async function loadMusic(){

const loading=
document.getElementById(
"loading"
);

const error=
document.getElementById(
"error"
);

const status=
document.getElementById(
"status"
);


loading.style.display="block";

error.style.display="none";


/*
   СНАЧАЛА пытаемся показать
   сохранённый список.

   Поэтому обновление страницы
   больше не должно давать пустой экран.
*/

let cached=null;


try{

const saved=
localStorage.getItem(
CACHE_KEY
);


if(saved){

cached=
JSON.parse(saved);

}

}catch(e){

console.warn(
"Ошибка чтения кэша:",
e
);

}


/*
   Если кэш есть —
   показываем его сразу.
*/

if(
Array.isArray(cached)&&
cached.length
){

renderMusic(cached);

loading.style.display="none";

status.textContent=
"";

}


/*
   Теперь обновляем список
   с Worker.
*/

try{

const text=
await fetchList();


const musicFiles=
parseList(text);


/*
   Если Worker ответил,
   но список пустой,
   не уничтожаем старый кэш.
*/

if(!musicFiles.length){

if(
cached&&
cached.length
){

status.textContent=
"";

return;

}

throw new Error(
"Worker не вернул файлы Music"
);

}


/*
   Сохраняем список.

   В localStorage сохраняются
   только ID + имя файла.
*/

try{

localStorage.setItem(
CACHE_KEY,
JSON.stringify(
musicFiles
)
);

}catch(e){

console.warn(
"Не удалось сохранить кэш:",
e
);

}


/*
   Показываем свежий список.
*/

renderMusic(
musicFiles
);


loading.style.display="none";

status.textContent="";


}catch(e){

console.error(
"Ошибка Worker:",
e
);


/*
   Если уже есть песни
   из кэша —
   НЕ показываем красную ошибку.
*/

if(
cached&&
cached.length
){

loading.style.display="none";

status.textContent="";


return;

}


/*
   Если вообще ничего нет —
   показываем ошибку.
*/

loading.style.display="none";

error.style.display="block";

error.innerHTML=

"<b>🎧 Музыка куда-то сбежала...</b><br><br>"+

"Не удалось получить список музыки с Worker.<br>"+

"Попробуй обновить страницу чуть позже.";

}

}


/* =========================================================
   RENDER MUSIC
   ========================================================= */

function renderMusic(
musicFiles
){

const container=
document.getElementById(
"songsContainer"
);


container.innerHTML="";


musicFiles.forEach(
file=>{

createSong(
file.name,
file.id,
container
);

});


songs=[
...document.querySelectorAll(
".song"
)
];


players=[
...document.querySelectorAll(
"audio"
)
];


setupPlayers();

setupVolume();

setupSearch();

}


/* =========================================================
   CREATE SONG
   ========================================================= */

function createSong(
fileName,
id,
container
){

let title=
fileName.replace(
/\.mp3$/i,
""
);


try{

title=
decodeURIComponent(
title
);

}catch(e){}


/*
   URL MP3.

   ВАЖНО:

   Ничего не меняем.

   Это тот же самый Worker URL,
   который у тебя напрямую открывал MP3.
*/

const fullURL=
WORKER+
"/music/"+
id;


/*
   Поиск.
*/

const searchText=
title
.replace(
/[_\-]+/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();


const song=
document.createElement(
"div"
);


song.className="song";


song.dataset.search=
makeSearchVariants(
searchText
);


/* =========================================================
   HTML
   ========================================================= */

song.innerHTML=`

<div class="title">

<span class="music-icon">
🎵
</span>

<span
title="${escapeHTML(title)}"
>
${escapeHTML(title)}
</span>

</div>


<audio
controls
preload="metadata"
>

<source
src="${fullURL}"
type="audio/mpeg"
>

Ваш браузер не поддерживает
воспроизведение MP3.

</audio>


<div class="buttons">


<a
class="btn download"
href="${fullURL}"
download
>
↓ Скачать MP3
</a>


<button
class="btn copy"
type="button"
>
🔗 Копировать ссылку
</button>


</div>

`;


/* =========================================================
   COPY
   ========================================================= */

const copyButton=
song.querySelector(
".copy"
);


copyButton.addEventListener(
"click",
()=>{

copyLink(
copyButton,
fullURL
);

}
);


container.appendChild(
song
);

}


/* =========================================================
   SEARCH VARIANTS
   ========================================================= */

function makeSearchVariants(
text
){

const base=
normalizeSearch(
text
);


let transliterated="";


for(
const char of base
){

transliterated+=

translit[char]!==undefined

?

translit[char]

:

char;

}


return (

base+
" "+
normalizeSearch(
transliterated
)

).trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
text
){

return text

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeSearch(
text
){

return text

.toLowerCase()

.replace(
/ё/g,
"е"
)

.replace(
/й/g,
"и"
)

.replace(
/[_\-–—]+/g,
" "
)

.replace(
/[^a-zа-я0-9\s]/gi,
" "
)

.replace(
/\s+/g,
" "
)

.trim();

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch(){

const input=
document.getElementById(
"searchInput"
);


const noResults=
document.getElementById(
"noResults"
);


input.oninput=
function(){

const query=
normalizeSearch(
this.value
);


const words=
query
.split(" ")
.filter(Boolean);


let found=0;


songs.forEach(
song=>{

const text=
song.dataset.search;


const visible=
!words.length||

words.every(
word=>
text.includes(word)
);


song.classList.toggle(
"hidden",
!visible
);


if(visible){

found++;

}

});


noResults.style.display=

found===0&&
words.length

?

"block"

:

"none";

};

}


/* =========================================================
   PLAYERS
   ========================================================= */

function setupPlayers(){

players.forEach(
player=>{


/*
   Когда запускаем песню —
   останавливаем остальные.
*/

player.onplay=
function(){

pauseOthers(
player
);

};


/*
   Если песня остановилась.
*/

player.onpause=
function(){

if(
player===currentAudio
){

/*
   Ничего сложного
   не делаем.

   Главное — не трогаем
   AudioContext.
*/

}

};


/*
   Конец песни.
*/

player.onended=
function(){

if(
player===currentAudio
){

currentAudio=null;

}

};

});

}


/* =========================================================
   PAUSE OTHERS
   ========================================================= */

function pauseOthers(
current
){

players.forEach(
player=>{

if(
player!==current
){

player.pause();

}

});


currentAudio=
current;

}


/* =========================================================
   COPY LINK
   ========================================================= */

async function copyLink(
button,
link
){

try{

await navigator.clipboard.writeText(
link
);

showCopied(
button
);


}catch(e){

/*
   Старый способ
   для браузеров,
   где Clipboard API
   недоступен.
*/

try{

const input=
document.createElement(
"input"
);


input.value=
link;


input.style.position=
"fixed";


input.style.opacity=
"0";


document.body.appendChild(
input
);


input.focus();

input.select();


document.execCommand(
"copy"
);


document.body.removeChild(
input
);


showCopied(
button
);


}catch(error){

alert(
"Не удалось скопировать ссылку.\n\n"+
link
);

}

}

}


/* =========================================================
   COPIED
   ========================================================= */

function showCopied(
button
){

const old=
button.innerHTML;


button.innerHTML=
"✓ Ссылка скопирована!";


button.classList.add(
"copied"
);


setTimeout(
()=>{

button.innerHTML=
old;

button.classList.remove(
"copied"
);

},
1500
);

}


/* =========================================================
   VOLUME
   ========================================================= */

function setupVolume(){

const saved=
localStorage.getItem(
"musicVolume"
);


let volume=
saved===null
?
1
:
parseFloat(saved);


if(
isNaN(volume)||
volume<0||
volume>1
){

volume=1;

}


players.forEach(
player=>{

player.volume=
volume;


player.onvolumechange=
