<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>МаЛяВоЧка - Music</title>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    background:
        radial-gradient(
            circle at 70% 10%,
            rgba(0,255,136,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,180,255,.05),
            transparent 30%
        ),
        #0d0d0f;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height:100vh;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:190px;
    height:100vh;

    background:
        linear-gradient(
            180deg,
            #18181b,
            #111113
        );

    border-right:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:
        5px 0 25px
        rgba(0,0,0,.45);

    padding-top:110px;

    z-index:100;
}


.menu{

    display:flex;

    align-items:center;

    gap:12px;

    color:#ddd;

    text-decoration:none;

    font-size:20px;

    padding:17px 20px;

    margin:5px 10px;

    border-radius:12px;

    transition:.2s;
}


.menu:hover{

    background:
        rgba(0,255,136,.08);

    color:#00ff88;

    transform:
        translateX(4px);

    box-shadow:
        inset 3px 0 0
        #00ff88;
}


/* =========================================================
   HEADER
   ========================================================= */

header{

    margin-left:190px;

    padding:30px 20px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            #18181a,
            #151517
        );

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    font-size:42px;

    font-weight:bold;

    color:#00ff88;

    letter-spacing:1px;

    text-shadow:
        0 0 15px
        rgba(0,255,136,.25);

    position:relative;
}


/* =========================================================
   SEARCH
   ========================================================= */

.search{

    position:absolute;

    right:25px;

    top:50%;

    transform:
        translateY(-50%);

    width:260px;

    height:43px;

    display:flex;

    align-items:center;

    background:
        rgba(20,20,22,.85);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:22px;

    overflow:hidden;

    transition:.2s;

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,.25);
}


.search:focus-within{

    border-color:#00ff88;

    box-shadow:
        0 0 12px
        rgba(0,255,136,.18),
        inset 0 0 15px
        rgba(0,0,0,.25);
}


.search-icon{

    position:relative;

    width:45px;

    height:100%;

    flex-shrink:0;
}


.search-icon:before{

    content:"";

    position:absolute;

    width:11px;
    height:11px;

    border:
        2px solid
        #aaa;

    border-radius:50%;

    left:14px;
    top:12px;

    transition:.2s;
}


.search-icon:after{

    content:"";

    position:absolute;

    width:7px;
    height:2px;

    background:#aaa;

    transform:
        rotate(45deg);

    left:25px;
    top:25px;

    border-radius:2px;

    transition:.2s;
}


.search:focus-within
.search-icon:before{

    border-color:#00ff88;
}


.search:focus-within
.search-icon:after{

    background:#00ff88;
}


.search input{

    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:15px;

    padding:
        0 15px 0 0;
}


.search input::placeholder{

    color:#888;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content{

    margin-left:190px;

    width:
        calc(100% - 190px);

    padding:
        35px 30px 80px;
}


/* =========================================================
   LOADING
   ========================================================= */

.loading,
.no-results,
.error{

    width:min(760px,90%);

    margin:30px auto;

    text-align:center;
}


.loading{

    color:#777;

    font-size:17px;
}


.loading span{

    color:#00ff88;
}


.error{

    display:none;

    padding:20px;

    border-radius:12px;

    background:
        rgba(255,50,50,.06);

    border:
        1px solid
        rgba(255,50,50,.15);

    color:#aaa;

    line-height:1.6;
}


.error b{

    color:#ff6666;
}


.no-results{

    display:none;

    color:#777;

    font-size:18px;
}


/* =========================================================
   SONG
   ========================================================= */

.song{

    background:
        linear-gradient(
            145deg,
            rgba(27,31,31,.97),
            rgba(22,25,26,.97)
        );

    width:min(760px,90%);

    margin:
        0 auto 12px;

    border-radius:14px;

    padding:
        13px 18px 10px;

    border:
        1px solid
        rgba(255,255,255,.055);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.28),
        inset 0 0 20px
        rgba(0,255,136,.015);

    transition:.2s;
}


.song:hover{

    transform:
        translateY(-2px);

    border-color:
        rgba(0,255,136,.18);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.4),
        0 0 20px
        rgba(0,255,136,.035);
}


.song.hidden{

    display:none;
}


/* =========================================================
   TITLE
   ========================================================= */

.title{

    min-height:37px;

    font-size:20px;

    display:flex;

    align-items:center;

    gap:10px;

    color:#f2f2f2;

    white-space:nowrap;

    overflow:hidden;
}


.title .music-icon{

    font-size:24px;

    color:#9b62ff;

    filter:
        drop-shadow(
            0 0 5px
            rgba(140,70,255,.45)
        );

    flex-shrink:0;
}


.title > span:nth-child(2){

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   FFT
   ========================================================= */

.fft{

    display:none;

    width:220px;

    height:48px;

    margin-left:auto;

    flex-shrink:0;
}


.song.playing .fft{

    display:block;
}


/* =========================================================
   AUDIO
   ========================================================= */

audio{

    display:block;

    width:100%;

    height:48px;

    border-radius:12px;

    margin:
        0 0 9px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{

    display:flex;

    gap:10px;

    width:100%;
}


.btn{

    flex:1;

    border:0;

    border-radius:7px;

    padding:
        8px 15px;

    font-size:14px;

    font-weight:bold;

    text-align:center;

    text-decoration:none;

    cursor:pointer;

    transition:.15s;
}


.btn:hover{

    transform:
        translateY(-1px);

    filter:
        brightness(1.08);
}


.btn:active{

    transform:
        translateY(0);
}


.download{

    background:#00c878;

    color:#fff;

    box-shadow:
        0 4px 12px
        rgba(0,200,120,.1);
}


.copy{

    background:#087fd0;

    color:#fff;
}


.copy.copied{

    background:#00b86b;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){

    .sidebar{

        width:70px;

        padding-top:90px;
    }


    .menu{

        justify-content:center;

        padding:15px;

        margin:6px;
    }


    .menu:first-letter{

        font-size:25px;
    }


    header{

        margin-left:70px;

        font-size:30px;

        padding:

    }


    .search{

        position:relative;

        top:auto;

        transform:none;

        margin:
            18px auto 0;

        width:min(400px,90%);

        height:40px;
    }


    .content{

        margin-left:70px;

        width:
            calc(100% - 70px);

        padding:
            25px 10px 60px;
    }


    .song{

        width:100%;

        padding:12px;
    }


    .buttons{

        flex-direction:column;
    }


    .btn{

        width:100%;
    }


    .title{

        font-size:19px;
    }


    .fft{

        width:150px;

        height:40px;
    }

}


@media(max-width:500px){

    .title{

        gap:6px;
    }


    .title .music-icon{

        font-size:21px;
    }


    .fft{

        width:120px;

        height:34px;
    }

}

</style>

<header>

    🎧 МаЛяВоЧка - Music 🎧

    <div class="search">

        <span class="search-icon"></span>

        <input
            id="searchInput"
            type="text"
            placeholder="Найти трек..."
        >

    </div>

</header>


<!-- =========================================================
     CONTENT
     ========================================================= -->

<div class="content">

    <div
        class="loading"
        id="loading"
    >
        Загрузка музыки...
        <span>♪</span>
    </div>


    <div
        class="error"
        id="error"
    ></div>


    <div
        id="songsContainer"
    ></div>

        Ничего не найдено 😔
    </div>

<script>

/* =========================================================
   WORKER
   ========================================================= */

const WORKER =
    "https://malyavochka-music.rxmlopdt.workers.dev";


const LIST_URL =
    WORKER + "/list.json";


/* =========================================================
   GLOBAL
   ========================================================= */

let songs = [];

let players = [];

let currentAudio = null;

let fakeFFTAnimation = null;


/* =========================================================
   TRANSLIT
   ========================================================= */

const translit = {

    "а":"a",
    "б":"b",
    "в":"v",
    "г":"g",
    "д":"d",
    "е":"e",
    "ё":"yo",
    "ж":"zh",
    "з":"z",
    "и":"i",
    "й":"y",
    "к":"k",
    "л":"l",
    "м":"m",
    "н":"n",
    "о":"o",
    "п":"p",
    "р":"r",
    "с":"s",
    "т":"t",
    "у":"u",
    "ф":"f",
    "х":"h",
    "ц":"ts",
    "ч":"ch",
    "ш":"sh",
    "щ":"sch",
    "ъ":"",
    "ы":"y",
    "ь":"",
    "э":"e",
    "ю":"yu",
    "я":"ya"

};


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeSearch(text){

    return String(text)

        .toLowerCase()

        .replace(
            /ё/g,
            "е"
        )

        .replace(
            /й/g,
            "и"
        )

        .replace(
            /[_\-–—]+/g,
            " "
        )

        .replace(
            /[^a-zа-я0-9\s]/gi,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   SEARCH VARIANTS
   ========================================================= */

function makeSearchVariants(text){

    const base =
        normalizeSearch(text);

    let transliterated = "";


    for(
        const char of base
    ){

        transliterated +=
            translit[char] !== undefined
                ? translit[char]
                : char;

    }


    return (
        base +
        " " +
        normalizeSearch(
            transliterated
        )
    ).trim();

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   FETCH
   ========================================================= */

async function getMusicList(){

    const url =
        LIST_URL +
        "?t=" +
        Date.now();


    const response =
        await fetch(
            url,
            {
                method:"GET",
                cache:"no-store"
            }
        );


    if(
        !response.ok
    ){

        throw new Error(
            "Worker HTTP " +
            response.status
        );

    }


    const text =
        await response.text();


    if(
        !text.trim()
    ){

        throw new Error(
            "Worker вернул пустой ответ."
        );

    }


    let data;


    try{

        data =
            JSON.parse(text);

    }
    catch(error){

        console.error(
            "Ответ Worker:",
            text
        );

        throw new Error(
            "Worker вернул неправильный JSON."
        );

    }


    if(
        !Array.isArray(data)
    ){

        throw new Error(
            "Worker должен вернуть массив файлов."
        );

    }


    return data;

}


/* =========================================================
   CREATE SONG
   ========================================================= */

function createSong(file){

    const fileName =
        String(
            file.name || ""
        );


    /*
       На главной странице показываем
       ТОЛЬКО папку Music.
    */

    const path =
        String(
            file.path || ""
        );


    if(
        !path.toLowerCase().startsWith("music/")
    ){

        return false;

    }


    /*
       Только MP3.
    */

    if(
        !fileName.toLowerCase().endsWith(".mp3")
    ){

        return false;

    }


    /*
       Название песни.
    */

    let title =
        fileName.replace(
            /\.mp3$/i,
            ""
        );


    try{

        title =
            decodeURIComponent(
                title
            );

    }
    catch(e){}


    /*
       ID GitHub файла.
    */

    const id =
        String(
            file.id || ""
        );


    if(
        !id
    ){

        return false;

    }


    /*
       Прямая ссылка Worker.

       ВАЖНО:

       encodeURIComponent нужен потому,
       что GitHub ID содержит символы,
       которые нельзя просто вставлять
       в URL.
    */

    const fullURL =
        WORKER +
        "/music/" +
        encodeURIComponent(id);


    /*
       Поиск.
    */

    const searchText =
        title
            .replace(
                /[_\-–—]+/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    /*
       Создаём карточку.
    */

    const song =
        document.createElement(
            "div"
        );


    song.className =
        "song";


    song.dataset.search =
        makeSearchVariants(
            searchText
        );


    song.dataset.path =
        path;


    song.innerHTML = `

        <div class="title">

            <span class="music-icon">
                🎵
            </span>

            <span title="${escapeHTML(title)}">
                ${escapeHTML(title)}
            </span>

            <canvas
                class="fft"
                width="440"
                height="96"
            ></canvas>

        </div>


        <audio
            controls
            preload="metadata"
            crossorigin="anonymous"
        >

            <source
                src="${escapeHTML(fullURL)}"
                type="audio/mpeg"
            >

            Ваш браузер не поддерживает
            воспроизведение MP3.

        </audio>


        <div class="buttons">

            <a
                class="btn download"
                href="${escapeHTML(fullURL)}"
                download
            >
                ↓ Скачать MP3
            </a>


            <button
                class="btn copy"
                type="button"
            >
                🔗 Копировать ссылку
            </button>

        </div>

    `;


    /*
       Кнопка копирования.
    */

    const copyButton =
        song.querySelector(
            ".copy"
        );


    copyButton.addEventListener(
        "click",
        function(){

            copyLink(
                copyButton,
                fullURL
            );

        }
    );


    /*
       Добавляем карточку.
    */

    document
        .getElementById(
            "songsContainer"
        )
        .appendChild(
            song
        );


    return true;

}


/* =========================================================
   LOAD MUSIC
   ========================================================= */

async function loadMusic(){

    const loading =
        document.getElementById(
            "loading"
        );


    const error =
        document.getElementById(
            "error"
        );


    const container =
        document.getElementById(
            "songsContainer"
        );


    const noResults =
        document.getElementById(
            "noResults"
        );


    loading.style.display =
        "block";


    error.style.display =
        "none";


    noResults.style.display =
        "none";


    container.innerHTML =
        "";


    try{

        loading.innerHTML =
            'Загрузка музыки... <span>♪</span>';


        const files =
            await getMusicList();


        console.log(
            "Worker вернул файлов:",
            files.length
        );


        let created =
            0;


        /*
           Worker может вернуть
           не только Music в будущем.

           Поэтому index.html
           дополнительно фильтрует:
           Music/*.mp3
        */

        for(
            const file of files
        ){

            if(
                createSong(file)
            ){

                created++;

            }

        }


        if(
            created === 0
        ){

            throw new Error(
                "В папке Music не найдено MP3-файлов."
            );

        }


        songs =
            Array.from(
                document.querySelectorAll(
                    ".song"
                )
            );


        players =
            Array.from(
                document.querySelectorAll(
                    "audio"
                )
            );


        setupPlayers();

        setupVolume();

        setupSearch();


        loading.style.display =
            "none";


        console.log(
            "Создано треков:",
            created
        );

    }
    catch(e){

        console.error(
            "LOAD ERROR:",
            e
        );


        loading.style.display =
            "none";


        error.style.display =
            "block";


        error.innerHTML = `

            <b>
                🎧 Не удалось загрузить музыку
            </b>

            <br><br>

            ${escapeHTML(
                e.message ||
                "Неизвестная ошибка"
            )}

            <br><br>

            <small>

                Worker:

                <br>

                ${escapeHTML(
                    LIST_URL
                )}

            </small>

            <br><br>

            <button
                onclick="location.reload()"
                style="
                    background:#00c878;
                    color:white;
                    border:0;
                    border-radius:8px;
                    padding:10px 18px;
                    cursor:pointer;
                    font-weight:bold;
                "
            >
                ↻ Повторить
            </button>

        `;

    }

}


/* =========================================================
   PLAYERS
   ========================================================= */

function setupPlayers(){

    players.forEach(
        player => {

            player.addEventListener(
                "play",
                function(){

                    pauseOthers(
                        player
                    );

                    startFFT(
                        player
                    );

                }
            );


            player.addEventListener(
                "pause",
                function(){

                    const song =
                        player.closest(
                            ".song"
                        );


                    if(
                        song
                    ){

                        song.classList.remove(
                            "playing"
                        );

                        clearFFT(
                            song
                        );

                    }


                    if(
                        player === currentAudio
                    ){

                        stopFFT();

                    }

                }
            );


            player.addEventListener(
                "ended",
                function(){

                    const song =
                        player.closest(
                            ".song"
                        );


                    if(
                        song
                    ){

                        song.classList.remove(
                            "playing"
                        );

                        clearFFT(
                            song
                        );

                    }


                    if(
                        player === currentAudio
                    ){

                        stopFFT();

                        currentAudio =
                            null;

                    }

                }
            );

        }
    );

}


/* =========================================================
   PAUSE OTHERS
   ========================================================= */

function pauseOthers(current){

    players.forEach(
        player => {

            if(
                player !== current
            ){

                player.pause();

                player.currentTime =
                    0;


                const oldSong =
                    player.closest(
                        ".song"
                    );


                if(
                    oldSong
                ){

                    oldSong.classList.remove(
                        "playing"
                    );

                    clearFFT(
                        oldSong
                    );

                }

            }

        }
    );


    currentAudio =
        current;


    const currentSong =
        current.closest(
            ".song"
        );


    if(
        currentSong
    ){

        currentSong.classList.add(
            "playing"
        );

    }

}


/* =========================================================
   CLEAR FFT
   ========================================================= */

function clearFFT(song){

    if(
        !song
    ){

        return;

    }


    const canvas =
        song.querySelector(
            ".fft"
        );


    if(
        !canvas
    ){

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/* =========================================================
   STOP FFT
   ========================================================= */

function stopFFT(){

    if(
        fakeFFTAnimation
    ){

        cancelAnimationFrame(
            fakeFFTAnimation
        );

        fakeFFTAnimation =
            null;

    }

}


/* =========================================================
   START FFT
   ========================================================= */

function startFFT(audio){

    stopFFT();


    if(
        !audio ||
        audio.paused
    ){

        return;

    }


    const song =
        audio.closest(
            ".song"
        );


    if(
        !song
    ){

        return;

    }


    const canvas =
        song.querySelector(
            ".fft"
        );


    if(
        !canvas
    ){

        return;

    }


    const ctx =
        canvas.getContext(
            "2d"
        );


    const bars =
        38;


    const values =
        new Float32Array(
            bars
        );


    function draw(){

        if(
            audio !== currentAudio ||
            audio.paused ||
            audio.ended ||
            !song.classList.contains(
                "playing"
            )
        ){

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            fakeFFTAnimation =
                null;

            return;

        }


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const gap =
            3;


        const bw =
            (
                canvas.width -
                gap *
                (bars - 1)
            ) /
            bars;


        const time =
            performance.now();


        const duration =
            audio.duration || 100;


        const progress =
            audio.currentTime /
            duration;


        for(
            let i = 0;
            i < bars;
            i++
        ){

            const wave =
                Math.sin(
                    time * .012 +
                    i * 1.7
                );


            const wave2 =
                Math.sin(
                    time * .007 -
                    i * .9
                );


            const center =
                1 -
                Math.abs(
                    i -
                    bars / 2
                ) /
                (bars / 2);


            let value =
                .16 +
                center * .12 +
                Math.abs(wave) * .18 +
                Math.abs(wave2) * .08;


            value +=
                progress * .05;


            if(
                value >
                values[i]
            ){

                values[i] +=
                    (
                        value -
                        values[i]
                    ) *
                    .35;

            }
            else{

                values[i] +=
                    (
                        value -
                        values[i]
                    ) *
                    .18;

            }


            const h =
                Math.max(
                    2,
                    Math.min(
                        canvas.height,
                        values[i] *
                        canvas.height
                    )
                );


            const x =
                i *
                (
                    bw +
                    gap
                );


            const y =
                canvas.height -
                h;


            const grad =
                ctx.createLinearGradient(
                    0,
                    y,
                    0,
                    canvas.height
                );


            grad.addColorStop(
                0,
                "#00ff88"
            );


            grad.addColorStop(
                .45,
                "#00ed91"
            );


            grad.addColorStop(
                1,
                "#00a96b"
            );


            ctx.fillStyle =
                grad;


            ctx.globalAlpha =
                .95;


            ctx.fillRect(
                Math.round(x),
                Math.round(y),
                Math.max(
                    1,
                    Math.round(bw)
                ),
                Math.round(h)
            );

        }


        ctx.globalAlpha =
            1;


        fakeFFTAnimation =
            requestAnimationFrame(
                draw
            );

    }


    draw();

}


/* =========================================================
   COPY LINK
   ========================================================= */

async function copyLink(button, link){

    try{

        await navigator.clipboard.writeText(
            link
        );


        showCopied(
            button
        );

    }
    catch(error){

        console.warn(
            "Clipboard API:",
            error
        );


        try{

            const input =
                document.createElement(
                    "input"
                );


            input.value =
                link;


            input.style.position =
                "fixed";


            input.style.opacity =
                "0";


            document.body.appendChild(
                input
            );


            input.focus();

            input.select();


            input.setSelectionRange(
                0,
                input.value.length
            );


            const success =
                document.execCommand(
                    "copy"
                );


            document.body.removeChild(
                input
            );


            if(
                success
            ){

                showCopied(
                    button
                );

            }
            else{

                throw new Error(
                    "Не удалось скопировать"
                );

            }

        }
        catch(e){

            alert(
                "Не удалось скопировать ссылку:\n\n" +
                link
            );

        }

    }

}


/* =========================================================
   COPIED
   ========================================================= */

function showCopied(button){

    const old =
        button.innerHTML;


    button.innerHTML =
        "✓ Ссылка скопирована!";


    button.classList.add(
        "copied"
    );


    setTimeout(
        function(){

            button.innerHTML =
                old;


            button.classList.remove(
                "copied"
            );

        },
        1500
    );

}


/* =========================================================
   VOLUME
   ========================================================= */

function setupVolume(){

    const saved =
        localStorage.getItem(
            "musicVolume"
        );


    let volume =
        saved === null
            ? 1
            : parseFloat(saved);


    if(
        !Number.isFinite(
            volume
        )
    ){

        volume =
            1;

    }


    volume =
        Math.max(
            0,
            Math.min(
                1,
                volume
            )
        );


    players.forEach(
        player => {

            player.volume =
                volume;


            player.addEventListener(
                "volumechange",
                function(){

                    localStorage.setItem(
                        "musicVolume",
                        String(
                            player.volume
                        )
                    );


                    players.forEach(
                        other => {

                            if(
                                other !== player
                            ){

                                other.volume =
                                    player.volume;

                            }

                        }
                    );

                }
            );

        }
    );

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const noResults =
        document.getElementById(
            "noResults"
        );


    input.addEventListener(
        "input",
        function(){

            const query =
                normalizeSearch(
                    this.value
                );


            const words =
                query
                    .split(" ")
                    .filter(Boolean);


            let found =
                0;


            songs.forEach(
                song => {

                    const text =
                        song.dataset.search ||
                        "";


                    const visible =
                        !words.length ||
                        words.every(
                            word =>
                                text.includes(
                                    word
                                )
                        );


                    song.classList.toggle(
                        "hidden",
                        !visible
                    );


                    if(
                        visible
                    ){

                        found++;

                    }

                }
            );


            noResults.style.display =
                (
                    found === 0 &&
                    words.length
                )
                ? "block"
                : "none";

        }
    );

}
