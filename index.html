<head>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
margin:0;
background:
radial-gradient(circle at 70% 10%,rgba(0,255,136,.07),transparent 30%),
radial-gradient(circle at 90% 80%,rgba(0,180,255,.05),transparent 30%),

.sidebar{

top:0;

background:linear-gradient(180deg,#18181b,#111113);
border-right:1px solid rgba(255,255,255,.06);

.menu{
display:flex;
align-items:center;
gap:12px;
color:#ddd;
text-decoration:none;
font-size:20px;
padding:17px 20px;
margin:5px 10px;
border-radius:12px;

}

.menu:hover{
background:rgba(0,255,136,.08);
color:#00ff88;
transform:translateX(4px);

header{
margin-left:190px;
padding:30px 20px;
text-align:center;
background:linear-gradient(180deg,#18181a,#151517);
border-bottom:1px solid rgba(255,255,255,.06);
box-shadow:0 8px 30px rgba(0,0,0,.35);
font-size:42px;
font-weight:bold;
color:#00ff88;
letter-spacing:1px;
text-shadow:0 0 15px rgba(0,255,136,.25);
position:relative
}

.search{
position:absolute;
right:25px;
top:50%;
transform:translateY(-50%);
width:260px;
height:43px;
display:flex;
align-items:center;
background:rgba(20,20,22,.85);
border:1px solid rgba(255,255,255,.1);
border-radius:22px;
overflow:hidden;
transition:.2s;
box-shadow:inset 0 0 15px rgba(0,0,0,.25)
}

.search:focus-within{
border-color:#00ff88;
box-shadow:0 0 12px rgba(0,255,136,.18),inset 0 0 15px rgba(0,0,0,.25)
}

.search-icon{
position:relative;
width:45px;
height:100%;
flex-shrink:0

.search-icon:before{
content:"";
position:absolute;
width:11px;
height:11px;
border:2px solid #aaa;
border-radius:50%;
left:14px;
top:12px;
transition:.2s
}

.search-icon:after{
content:"";
position:absolute;
width:7px;
height:2px;
background:#aaa;
transform:rotate(45deg);
left:25px;
top:25px;
border-radius:2px;
transition:.2s
}

.search:focus-within .search-icon:before{
border-color:#00ff88
}

.search:focus-within .search-icon:after{
background:#00ff88
}

.search input{
width:100%;
height:100%;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:15px;
padding:0 15px 0 0
}

.search input::placeholder{
color:#888
}

.content{
margin-left:190px;
width:calc(100% - 190px);
padding:35px 30px 80px
}

.loading,.no-results,.error{
width:min(760px,90%);
margin:30px auto;
text-align:center
}

.loading{
color:#777;
font-size:17px
}

.loading span{
color:#00ff88
}

.no-results{

color:#777;
font-size:18px
}

display:none;
padding:20px;
border-radius:12px;
background:rgba(255,50,50,.06);
border:1px solid rgba(255,50,50,.15);

.error b{
color:#ff6666

box-shadow:0 8px 25px rgba(0,0,0,.28),inset 0 0 20px rgba(0,255,136,.015);

.song:hover{
transform:translateY(-2px);
border-color:rgba(0,255,136,.18);
box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 20px rgba(0,255,136,.035)
}

.song.hidden{
display:none

.title{
height:37px;
font-size:20px;
display:flex;
align-items:center;
gap:10px;
color:#f2f2f2;

overflow:hidden
}

.title .music-icon{
font-size:24px;
color:#9b62ff;
filter:drop-shadow(0 0 5px rgba(140,70,255,.45));
flex-shrink:0
}

.title>span:nth-child(2){
overflow:hidden;
text-overflow:ellipsis
}

.fft{
display:none;
width:220px;
height:48px;
margin-left:auto;
flex-shrink:0
}

.song.playing .fft{
display:block
}

audio{
display:block;
width:100%;
height:48px;
border-radius:12px;
margin:0 0 9px
}

.buttons{
display:flex;
gap:10px;
width:100%
}

.btn{
flex:1;
border:0;
border-radius:7px;
padding:8px 15px;
font-size:14px;
font-weight:bold;
text-align:center;
text-decoration:none;
cursor:pointer;
transition:.15s
}

.btn:hover{
transform:translateY(-1px);
filter:brightness(1.08)
}

.btn:active{
transform:translateY(0)
}

.download{
background:#00c878;
color:#fff;
box-shadow:0 4px 12px rgba(0,200,120,.1)
}

.copy{
background:#087fd0;
color:#fff
}

.copy.copied{
background:#00b86b
}

@media(max-width:800px){

.sidebar{
width:70px;
padding-top:90px
}

.menu{
justify-content:center;
font-size:0;
padding:15px;
margin:6px
}

.menu:first-letter{
font-size:25px
}

header{
margin-left:70px;
font-size:30px;
padding:25px 10px
}

.search{
position:relative;
right:auto;
top:auto;
transform:none;
margin:18px auto 0;
width:min(400px,90%);
height:40px
}

.content{
margin-left:70px;
width:calc(100% - 70px);
padding:25px 10px 60px
}

.song{
width:100%;
padding:12px
}

.buttons{
flex-direction:column
}

.btn{
width:100%
}

font-size:19px
}

height:40px
}

}

@media(max-width:500px){

}

.title .music-icon{
font-size:21px
}

.fft{

height:34px
}

}
</style>
</head>

<body>

<div class="sidebar">

<a href="index.html" class="menu">
🎧 <span>Music</span>
</a>

<a href="Roflan.html" class="menu">
😂 <span>Рофл звуки</span>
</a>

<a href="Gachi.html" class="menu">
🎤 <span>Gachi</span>
</a>

<a href="Skrimer.html" class="menu">
😱 <span>Скримеры</span>
</a>

</div>

<header>

🎧 МаЛяВоЧка - Music 🎧

<div class="search">

<span class="search-icon"></span>

<input
id="searchInput"
type="text"
placeholder="Найти трек..."
>

</div>

</header>

<div class="content">

<div class="loading" id="loading">
Загрузка музыки... <span>♪</span>
</div>

<div class="error" id="error"></div>

<div id="songsContainer"></div>

<div class="no-results" id="noResults">
Ничего не найдено 😔
</div>

</div>

<script>

/* =========================================================
   MaLyAvOchKa Music
   =========================================================

   Worker работает со всем репозиторием.

   Главная страница показывает ТОЛЬКО:

   Music/*.mp3

   Все остальные папки игнорируются.

   Воспроизведение:
   Worker /music/ID

   ВАЖНО:
   Аудио НЕ подключается к Web Audio API.
   Поэтому звук не пропадает из-за CORS.
   ========================================================= */


/* =========================================================
   WORKER
   ========================================================= */

const WORKER=
"https://malyavochka-music.rxmlopdt.workers.dev";

const LIST_URL=
WORKER+"/list";


/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */

let songs=[];
let players=[];
let currentAudio=null;


/* =========================================================
   ТРАНСЛИТ
   ========================================================= */

const translit={

"а":"a",
"б":"b",
"в":"v",
"г":"g",
"д":"d",
"е":"e",
"ё":"yo",
"ж":"zh",
"з":"z",
"и":"i",
"й":"y",
"к":"k",
"л":"l",
"м":"m",
"н":"n",
"о":"o",
"п":"p",
"р":"r",
"с":"s",
"т":"t",
"у":"u",
"ф":"f",
"х":"h",
"ц":"ts",
"ч":"ch",
"ш":"sh",
"щ":"sch",
"ъ":"",
"ы":"y",
"ь":"",
"э":"e",
"ю":"yu",
"я":"ya"

};


/* =========================================================
   ЗАГРУЗКА
   ========================================================= */

async function loadMusic(){

const loading=
document.getElementById("loading");

const error=
document.getElementById("error");


try{

const response=
await fetch(
LIST_URL+
"?t="+
Date.now(),
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"Worker: "+
response.status
);

}


const text=
await response.text();


/* =========================================================
   РАЗБИРАЕМ /list
   ========================================================= */

const lines=
text
.split(/\r?\n/)
.map(line=>line.trim())
.filter(Boolean);


const musicFiles=[];


for(const line of lines){

/*
   Ищем:

   ID → путь.mp3
*/

const match=
line.match(
/^([a-f0-9]{8}|\d{8})\s+→\s+(.+\.mp3)$/i
);


if(!match){

continue;

}


const id=
match[1];

const filePath=
match[2];


/* =========================================================
   ТОЛЬКО ПАПКА MUSIC
   ========================================================= */

if(
!filePath.startsWith("Music/")
){

continue;

}


if(
!filePath.toLowerCase().endsWith(".mp3")
){

continue;

}


/*
   Берём только имя файла.

   Music/Test.mp3
   ↓
   Test.mp3
*/

const fileName=
filePath.substring(
"Music/".length
);


musicFiles.push({

id:id,

name:fileName,

path:filePath

});

}


/* =========================================================
   СОРТИРОВКА
   ========================================================= */

musicFiles.sort(
(a,b)=>
a.name.localeCompare(
b.name,
"ru",
{
numeric:true,
sensitivity:"base"
}
)
);


/* =========================================================
   СОЗДАЁМ СТРАНИЦУ
   ========================================================= */

const container=
document.getElementById(
"songsContainer"
);

container.innerHTML="";


musicFiles.forEach(file=>{

createSong(
file.name,
file.id,
container
);

});


/* =========================================================
   PLAYERS
   ========================================================= */

songs=[
...document.querySelectorAll(
".song"
)
];

players=[
...document.querySelectorAll(
"audio"
)
];


/* =========================================================
   LOADING
   ========================================================= */

if(musicFiles.length){

loading.style.display=
"none";

}else{

loading.innerHTML=
'В папке <span>Music</span> пока нет MP3 🎵';

}


/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

setupPlayers();

setupVolume();

setupSearch();


}catch(e){

console.error(
"Ошибка загрузки:",
e
);


loading.style.display=
"none";

error.style.display=
"block";

error.innerHTML=
"<b>🎧 Музыка куда-то сбежала...</b><br><br>"+
"МаЛяВоЧка не смогла открыть музыкальную коллекцию 😔<br>"+
"Попробуй обновить страницу чуть позже.";

}

}


/* =========================================================
   СОЗДАНИЕ ПЕСНИ
   ========================================================= */

function createSong(
fileName,
id,
container
){

let title=
fileName.replace(
/\.mp3$/i,
""
);


try{

title=
decodeURIComponent(title);

}catch(e){}


/* =========================================================
   ПОИСК
   ========================================================= */

const searchText=
title
.replace(
/[_\-]+/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();


/* =========================================================
   WORKER URL
   =========================================================

   Например:

   /music/ad53d31a

   Никакого GitHub URL здесь нет.
*/

const fullURL=
WORKER+
"/music/"+
id;


/* =========================================================
   SONG
   ========================================================= */

const song=
document.createElement("div");

song.className=
"song";


song.dataset.search=
makeSearchVariants(
searchText
);


/* =========================================================
   HTML
   ========================================================= */

song.innerHTML=`

<div class="title">

<span class="music-icon">
🎵
</span>

<span title="${escapeHTML(title)}">
${escapeHTML(title)}
</span>

<canvas
class="fft"
width="440"
height="96">
</canvas>

</div>


<audio
controls
preload="metadata">

<source
src="${fullURL}"
type="audio/mpeg">

</audio>


<div class="buttons">

<a
class="btn download"
href="${fullURL}"
download>

↓ Скачать MP3

</a>


<button
class="btn copy">

🔗 Копировать ссылку

</button>

</div>

`;


/* =========================================================
   COPY
   ========================================================= */

song
.querySelector(".copy")
.addEventListener(
"click",
()=>{

copyLink(
song.querySelector(".copy"),
fullURL
);

}
);


container.appendChild(
song
);

}


/* =========================================================
   SEARCH VARIANTS
   ========================================================= */

function makeSearchVariants(text){

const base=
normalizeSearch(text);


let transliterated="";


for(
const char of base
){

transliterated+=
translit[char]!==undefined
?
translit[char]
:
char;

}


const words=
base
.split(" ")
.filter(Boolean);


const extraWords=[];


words.forEach(word=>{

if(word.length>=2){

extraWords.push(word);

}

});


return(
base+
" "+
normalizeSearch(
transliterated
)+
" "+
normalizeSearch(
extraWords.join(" ")
)
).trim();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

return text

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeSearch(text){

return text

.toLowerCase()

.replace(
/ё/g,
"е"
)

.replace(
/й/g,
"и"
)

.replace(
/[_\-–—]+/g,
" "
)

.replace(
/[^a-zа-я0-9\s]/gi,
" "
)

.replace(
/\s+/g,
" "
)

.trim();

}


/* =========================================================
   SEARCH
   ========================================================= */

function setupSearch(){

const input=
document.getElementById(
"searchInput"
);

const noResults=
document.getElementById(
"noResults"
);


input.addEventListener(
"input",
function(){

const query=
normalizeSearch(
this.value
);


const words=
query
.split(" ")
.filter(Boolean);


let found=0;


songs.forEach(song=>{

const text=
song.dataset.search;


const visible=
!words.length||
words.every(
word=>
text.includes(word)
);


song.classList.toggle(
"hidden",
!visible
);


if(visible){

found++;

}

});


noResults.style.display=
found===0&&words.length
?
"block"
:
"none";

});

}


/* =========================================================
   ПАУЗА ДРУГИХ ПЛЕЕРОВ
   ========================================================= */

function pauseOthers(current){

players.forEach(
player=>{

if(
player!==current
){

player.pause();

player.currentTime=0;


const oldSong=
player.closest(
".song"
);


if(oldSong){

oldSong.classList.remove(
"playing"
);

clearFFT(
oldSong
);

}

}

}
);


currentAudio=
current;


const currentSong=
current.closest(
".song"
);


if(currentSong){

currentSong.classList.add(
"playing"
);

}


/* =========================================================
   ГРОМКОСТЬ
   ========================================================= */

const saved=
localStorage.getItem(
"musicVolume"
);


if(saved!==null){

current.volume=
parseFloat(saved);

}

}


/* =========================================================
   FFT
   =========================================================

   ОТКЛЮЧЕН.

   Причина:
   Worker находится на workers.dev,
   а Web Audio API требует CORS для
   createMediaElementSource().

   Если подключить аудио к AudioContext
   без правильного CORS, браузер может
   полностью убрать звук.

   Сам обычный HTML audio работает нормально.
   ========================================================= */

function clearFFT(song){

if(!song){

return;

}


const canvas=
song.querySelector(
".fft"
);


if(!canvas){

return;

}


const ctx=
canvas.getContext("2d");


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}


function startFFT(audio){

/*
   Ничего не делаем.

   Звук остаётся напрямую:

   <audio>
       ↓
   Worker
       ↓
   динамики
*/

return;

}


/* =========================================================
   PLAYERS
   ========================================================= */

function setupPlayers(){

players.forEach(
player=>{


player.addEventListener(
"play",
()=>{

pauseOthers(
player
);

startFFT(
player
);

}
);


player.addEventListener(
"pause",
()=>{

if(
player===
currentAudio
){

const song=
player.closest(
".song"
);


if(song){

song.classList.remove(
"playing"
);

clearFFT(
song
);

}

}

}
);


player.addEventListener(
"ended",
()=>{

if(
player===
currentAudio
){

const song=
player.closest(
".song"
);


if(song){

song.classList.remove(
"playing"
);

clearFFT(
song
);

}


currentAudio=
null;

}

}
);

});

}


/* =========================================================
   COPY LINK
   ========================================================= */

function copyLink(
button,
link
){

if(
navigator.clipboard
){

navigator.clipboard
.writeText(
link
)
.then(
()=>{

showCopied(
button
);

}
)
.catch(
()=>{

fallbackCopy(
button,
link
);

}
);

}else{

fallbackCopy(
button,
link
);

}

}


/* =========================================================
   FALLBACK COPY
   ========================================================= */

function fallbackCopy(
button,
link
){

const input=
document.createElement(
"input"
);


input.value=
link;


document.body.appendChild(
input
);


input.select();


document.execCommand(
"copy"
);


document.body.removeChild(
input
);


showCopied(
button
);

}


/* =========================================================
   COPIED
   ========================================================= */

function showCopied(
button
){

const old=
button.innerHTML;


button.innerHTML=
"✓ Ссылка скопирована!";


button.classList.add(
"copied"
);


setTimeout(
()=>{

button.innerHTML=
old;

button.classList.remove(
"copied"
);

},
1500
);

}


/* =========================================================
   VOLUME
   ========================================================= */

function setupVolume(){

const saved=
localStorage.getItem(
"musicVolume"
);


let volume=
saved===null
?
1
:
parseFloat(saved);


if(
isNaN(volume)||
volume<0||
volume>1
){

volume=1;

}


players.forEach(
player=>{

player.volume=
volume;


player.addEventListener(
"volumechange",
()=>{

localStorage.setItem(
"musicVolume",
player.volume
);


players.forEach(
other=>{

if(
other!==player
){

other.volume=
player.volume;

}

}
);

}
);

});

}


/* =========================================================
   START
   ========================================================= */

loadMusic();

</script>

</body>
</html>
