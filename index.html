<header>
🎧 МаЛяВоЧка - Music 🎧

<div class="search">
<span class="search-icon"></span>
<input id="searchInput" type="text" placeholder="Найти трек...">
</div>
</header>

<div class="content">

<div class="loading" id="loading">
Загрузка музыки... <span>♪</span>
</div>

<div class="error" id="error"></div>

<div id="songsContainer"></div>

<div class="no-results" id="noResults">
Ничего не найдено 😔
</div>

</div>

<script>
const REPO_API="https://api.github.com/repos/malyavochkamalyavochkamalyavochka/my-radio/contents/Music";
const MUSIC_FOLDER="Music/";
const BASE="https://malyavochkamalyavochkamalyavochka.github.io/my-radio/Music/";

let songs=[];
let players=[];
let currentAudio=null;
let audioCtx=null;
let raf=null;

const sourceMap=new WeakMap();

async function loadMusic(){
const loading=document.getElementById("loading");
const error=document.getElementById("error");

try{
const response=await fetch(REPO_API+"?t="+Date.now());

if(!response.ok){
throw new Error("GitHub API: "+response.status);
}

const files=await response.json();

const musicFiles=files
.filter(file=>file.type==="file"&&file.name.toLowerCase().endsWith(".mp3"))
.sort((a,b)=>a.name.localeCompare(b.name,"ru",{
numeric:true,
sensitivity:"base"
}));

const container=document.getElementById("songsContainer");

container.innerHTML="";

musicFiles.forEach(file=>{
createSong(file.name,container);
});

songs=[...document.querySelectorAll(".song")];
players=[...document.querySelectorAll("audio")];

if(musicFiles.length){
loading.style.display="none";
}else{
loading.innerHTML='В папке <span>Music</span> пока нет MP3 🎵';
loading.style.display="block";
}

setupPlayers();
setupVolume();
setupSearch();

}catch(e){
console.error(e);

loading.style.display="none";
error.style.display="block";

error.innerHTML=
"<b>🎧 Музыка куда-то сбежала...</b><br><br>"+
"Похоже, МаЛяВоЧка временно не смогла найти свои треки 😔<br>"+
"Попробуй обновить страницу чуть позже!";
}
}

function createSong(fileName,container){
let title=fileName.replace(/\.mp3$/i,"");

try{
title=decodeURIComponent(title);
}catch(e){}

const searchText=title
.replace(/[_\-]+/g," ")
.replace(/\s+/g," ")
.trim();

const fileURL=MUSIC_FOLDER+encodeURIComponent(fileName);
const fullURL=BASE+encodeURIComponent(fileName);

const song=document.createElement("div");

song.className="song";
song.dataset.search=normalizeSearch(searchText);

song.innerHTML=`
<div class="title">
<span class="music-icon">🎵</span>
<span title="${escapeHTML(title)}">${escapeHTML(title)}</span>
<canvas class="fft" width="440" height="96"></canvas>
</div>

<audio controls preload="metadata">
<source src="${fileURL}" type="audio/mpeg">
</audio>

<div class="buttons">
<a class="btn download" href="${fileURL}" download>
↓ Скачать MP3
</a>

<button class="btn copy">
🔗 Копировать ссылку
</button>
</div>
`;

song.querySelector(".copy").addEventListener("click",()=>{
copyLink(song.querySelector(".copy"),fullURL);
});

container.appendChild(song);
}

function escapeHTML(text){
return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function normalizeSearch(text){
return text
.toLowerCase()
.replace(/ё/g,"е")
.replace(/й/g,"и")
.replace(/[^a-zа-я0-9\s]/gi," ")
.replace(/\s+/g," ")
.trim();
}

function setupSearch(){
const input=document.getElementById("searchInput");
const noResults=document.getElementById("noResults");

input.addEventListener("input",function(){

const words=normalizeSearch(this.value)
.split(" ")
.filter(Boolean);

let found=0;

songs.forEach(song=>{

const visible=
!words.length||
words.every(word=>song.dataset.search.includes(word));

song.classList.toggle("hidden",!visible);

if(visible)found++;
});

noResults.style.display=
found===0&&words.length?
"block":
"none";
});
}

function pauseOthers(current){

players.forEach(player=>{

if(player!==current){

player.pause();
player.currentTime=0;

const oldSong=player.closest(".song");

if(oldSong){
oldSong.classList.remove("playing");
clearFFT(oldSong);
}
}
});

currentAudio=current;

const currentSong=current.closest(".song");

if(currentSong){
currentSong.classList.add("playing");
}

const saved=localStorage.getItem("musicVolume");

if(saved!==null){
current.volume=parseFloat(saved);
}
}

function getAudioContext(){

if(!audioCtx){
audioCtx=new(
window.AudioContext||
window.webkitAudioContext
)();
}

return audioCtx;
}

function setupAudio(audio){

if(sourceMap.has(audio)){
return sourceMap.get(audio);
}

const ctx=getAudioContext();

const source=ctx.createMediaElementSource(audio);
const analyser=ctx.createAnalyser();

analyser.fftSize=1024;
analyser.smoothingTimeConstant=.28;
analyser.minDecibels=-95;
analyser.maxDecibels=-8;

source.connect(analyser);
analyser.connect(ctx.destination);

const result={
source:source,
analyser:analyser
};

sourceMap.set(audio,result);

return result;
}

function clearFFT(song){

if(!song)return;

const canvas=song.querySelector(".fft");

if(!canvas)return;

canvas
.getContext("2d")
.clearRect(
0,
0,
canvas.width,
canvas.height
);
}

function startFFT(audio){

if(raf){
cancelAnimationFrame(raf);
raf=null;
}

songs.forEach(song=>{

if(song!==audio.closest(".song")){
song.classList.remove("playing");
clearFFT(song);
}
});

let analyser;

try{

const ctx=getAudioContext();

if(ctx.state==="suspended"){
ctx.resume();
}

analyser=setupAudio(audio).analyser;

}catch(e){
return;
}

const song=audio.closest(".song");
const canvas=song.querySelector(".fft");
const ctx=canvas.getContext("2d");

const data=new Uint8Array(
analyser.frequencyBinCount
);

const bars=38;
const values=new Float32Array(bars);

function draw(){

if(
audio!==currentAudio||
audio.paused||
audio.ended||
!song.classList.contains("playing")
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

return;
}

analyser.getByteFrequencyData(data);

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

const gap=3;
const bw=(
canvas.width-
gap*(bars-1)
)/bars;

const time=performance.now();

for(let i=0;i<bars;i++){

const t=i/(bars-1);

let minBin=Math.floor(
2*Math.pow(
(data.length-2)/2,
t
)
);

let maxBin=Math.floor(
3*Math.pow(
(data.length-2)/3,
t
)
);

if(maxBin<=minBin){
maxBin=minBin+1;
}

let sum=0;
let count=0;

for(
let j=minBin;
j<=maxBin&&j<data.length;
j++
){

const weight=
1-
Math.abs(
j-(minBin+maxBin)/2
)/
(maxBin-minBin+1);

sum+=data[j]*(.65+weight);
count+=.65+weight;
}

let value=
count?
sum/count/255:
0;

value=Math.pow(value,.48);
value*=.9+t*.8;

value+=
Math.sin(
time*.012+i*1.7
)*.012;

if(value>values[i]){

values[i]+=
(value-values[i])*.72;

}else{

values[i]+=
(value-values[i])*.34;
}

const floor=
.025+
Math.sin(
time*.006+i*.9
)*.008;

const finalValue=
Math.max(
values[i],
floor
);

const h=
Math.max(
2,
finalValue*canvas.height*.94
);

const x=i*(bw+gap);
const y=canvas.height-h;

const grad=
ctx.createLinearGradient(
0,
y,
0,
canvas.height
);

grad.addColorStop(
0,
"#00ff88"
);

grad.addColorStop(
.45,
"#00ed91"
);

grad.addColorStop(
1,
"#00a96b"
);

ctx.fillStyle=grad;
ctx.globalAlpha=.95;

ctx.fillRect(
Math.round(x),
Math.round(y),
Math.max(1,Math.round(bw)),
Math.round(h)
);
}

ctx.globalAlpha=1;

raf=requestAnimationFrame(draw);
}

draw();
}

function setupPlayers(){

players.forEach(player=>{

player.addEventListener(
"play",
()=>{

pauseOthers(player);
startFFT(player);

}
);

player.addEventListener(
"pause",
()=>{

if(player===currentAudio){

const song=player.closest(".song");

if(song){
song.classList.remove("playing");
clearFFT(song);
}

if(raf){
cancelAnimationFrame(raf);
raf=null;
}
}
}
);

player.addEventListener(
"ended",
()=>{

if(player===currentAudio){

const song=player.closest(".song");

if(song){
song.classList.remove("playing");
clearFFT(song);
}

if(raf){
cancelAnimationFrame(raf);
raf=null;
}

currentAudio=null;
}
}
);

});
}

function copyLink(button,link){

navigator.clipboard
.writeText(link)
.then(()=>{
showCopied(button);
})
.catch(()=>{

const input=document.createElement("input");

input.value=link;

document.body.appendChild(input);

input.select();

document.execCommand("copy");

document.body.removeChild(input);

showCopied(button);
});
}

function showCopied(button){

const old=button.innerHTML;

button.innerHTML=
"✓ Ссылка скопирована!";

button.classList.add("copied");

setTimeout(()=>{

button.innerHTML=old;
button.classList.remove("copied");

},1500);
}

function setupVolume(){

const saved=
localStorage.getItem("musicVolume");

const volume=
saved===null?
1:
parseFloat(saved);

players.forEach(player=>{

player.volume=volume;

player.addEventListener(
"volumechange",
()=>{

localStorage.setItem(
"musicVolume",
player.volume
);

players.forEach(other=>{

if(other!==player){
other.volume=player.volume;
}

});
}
);
});
}

loadMusic();
</script>

</body>
</html>
