/* =========================================================

/*
 * Основная идея:
 *

 * А создаём несколько вариантов написания.

 * Например:

 */


/* =========================================================

   ========================================================= */

const RU_TO_EN = {

/* =========================================================
   АНГЛ -> РУ
   ========================================================= */

const EN_TO_RU = [

/* =========================================================
   ПОПУЛЯРНЫЕ АНГЛИЙСКИЕ СЛОВА
   =========================================================
 *
 * Здесь специально оставлены разные варианты.
 *
 * Например:
 *
 * feat -> фит
 * feat -> фич
 *
 * love -> лав
 * love -> лов
 *
 * night -> найт
 *
 * Это сильно помогает при обычном человеческом
 * написании "как слышится".
 */

const COMMON_TRANSLITERATIONS = [

    ["ft","фит"],

/* =========================================================
   НОРМАЛИЗАЦИЯ
   ========================================================= */

function normalizeSearchText(value){

    return String(value || "")

        .toLowerCase()

        .replace(
            /ё/g,
            "е"
        )

        .replace(
            /[^a-zа-я0-9]+/gi,
            ""
        );

}


/* =========================================================
   УДАЛИТЬ ПОВТОРЫ
   ========================================================= */

function uniqueVariants(
    variants
){

    return [
        ...new Set(
            variants
                .filter(
                    value =>
                        value &&
                        value.length > 0
                )
                .map(
                    value =>
                        normalizeSearchText(
                            value
                        )
                )
                .filter(
                    Boolean
                )
        )
    ];

}


/* =========================================================
   РУ -> АНГЛ
   ========================================================= */

function transliterateRuToEn(
    text
){

    let result = "";

    const lower =
        String(
            text || ""
        ).toLowerCase();


    for(
        const char of lower
    ){

        if(
            RU_TO_EN[char] !== undefined
        ){

            result +=
                RU_TO_EN[char];

        }
        else{

            result +=
                char;

        }

    }


    return result;

}


/* =========================================================
   АНГЛ -> РУ
   ========================================================= */

function transliterateEnToRu(
    text
){

    let result =
        String(
            text || ""
        ).toLowerCase();


    /*
     * Сначала длинные комбинации.
     *
     * Например:
     *
     * sh -> ш
     *
     * а не:
     *
     * s -> с
     * h -> х
     */

    for(
        const pair of EN_TO_RU
    ){

        result =
            result.split(
                pair[0]
            ).join(
                pair[1]
            );

    }


    return result;

}


/* =========================================================
   СОЗДАТЬ ВАРИАНТЫ ТЕКСТА
   ========================================================= */

function makeSearchVariants(
    text
){

    const original =
        String(
            text || ""
        )
        .toLowerCase();


    const variants = [];


    /*
     * Оригинал.
     */

    variants.push(
        original
    );


    /*
     * Русский -> английский.
     *
     * Например:
     *
     * дарьяна
     *
     * ->
     *
     * daryana
     */

    variants.push(
        transliterateRuToEn(
            original
        )
    );


    /*
     * Английский -> русский.
     *
     * Например:
     *
     * daryana
     *
     * ->
     *
     * дарьяна
     */

    variants.push(
        transliterateEnToRu(
            original
        )
    );


    /*
     * Популярные варианты.
     */

    const normalizedOriginal =
        normalizeSearchText(
            original
        );


    for(
        const pair of COMMON_TRANSLITERATIONS
    ){

        const english =
            normalizeSearchText(
                pair[0]
            );


        if(
            normalizedOriginal.includes(
                english
            )
        ){

            variants.push(
                pair[1]
            );

        }

    }


    /*
     * Также пробуем заменить отдельные слова.
     */

    let commonVersion =
        original;


    for(
        const pair of COMMON_TRANSLITERATIONS
    ){

        commonVersion =
            commonVersion
                .split(
                    pair[0]
                )
                .join(
                    pair[1]
                );

    }


    variants.push(
        commonVersion
    );


    return uniqueVariants(
        variants
    );

}


/* =========================================================
   ПОСТРОИТЬ ПОИСКОВЫЙ ИНДЕКС ТРЕКА
   ========================================================= */

function buildTrackSearchText(
    track
){

    const name =
        String(
            track.name || ""
        );


    const withoutExtension =
        removeExtension(
            name
        );


    return makeSearchVariants(
        withoutExtension
    );

}


/* =========================================================
   РАССТОЯНИЕ ЛЕВЕНШТЕЙНА
   =========================================================
 *
 * Позволяет находить небольшие ошибки.
 *
 * Например:
 *
 * daryana
 * dariana
 *
 * или:
 *
 * дарьяна
 * дарьянаа
 */

function levenshtein(
    a,
    b
){

    a =
        String(a || "");

    b =
        String(b || "");


    if(
        a === b
    ){

        return 0;

    }


    if(
        !a.length
    ){

        return b.length;

    }


    if(
        !b.length
    ){

        return a.length;

    }


    let previous =
        new Array(
            b.length + 1
        );


    let current =
        new Array(
            b.length + 1
        );


    for(
        let j = 0;
        j <= b.length;
        j++
    ){

        previous[j] = j;

    }


    for(
        let i = 1;
        i <= a.length;
        i++
    ){

        current[0] = i;


        for(
            let j = 1;
            j <= b.length;
            j++
        ){

            const cost =
                a[i - 1] ===
                b[j - 1]
                    ? 0
                    : 1;


            current[j] =
                Math.min(

                    current[j - 1] + 1,

                    previous[j] + 1,

                    previous[j - 1] + cost

                );

        }


        const temp =
            previous;

        previous =
            current;

        current =
            temp;

    }


    return previous[b.length];

}


/* =========================================================
   ПОХОЖЕ ЛИ СЛОВО
   ========================================================= */

function fuzzyWordMatch(
    query,
    text
){

    if(
        !query ||
        !text
    ){

        return false;

    }


    if(
        text.includes(
            query
        )
    ){

        return true;

    }


    /*
     * Для очень коротких запросов
     * fuzzy поиск отключаем.
     *
     * Иначе "а" найдёт вообще всё.
     */

    if(
        query.length < 3
    ){

        return false;

    }


    /*
     * Разбиваем название на слова.
     */

    const words =
        text
            .split(
                /[\s\-_.,!?()[\]{}]+/
            )
            .filter(
                Boolean
            );


    /*
     * Также проверяем само название.
     */

    const candidates =
        words.length
            ? words
            : [text];


    for(
        const word of candidates
    ){

        /*
         * Если слово почти такое же.
         */

        const distance =
            levenshtein(
                query,
                word
            );


        /*
         * Для коротких слов разрешаем
         * максимум одну ошибку.
         */

        if(
            query.length <= 4
        ){

            if(
                distance <= 1
            ){

                return true;

            }

        }
        else if(
            query.length <= 7
        ){

            if(
                distance <= 2
            ){

                return true;

            }

        }
        else{

            if(
                distance <=
                Math.max(
                    2,
                    Math.floor(
                        query.length * 0.25
                    )
                )
            ){

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   УМНОЕ СОВПАДЕНИЕ
   ========================================================= */

function smartSearchMatch(
    track,
    query
){

    const cleanQuery =
        normalizeSearchText(
            query
        );


    if(
        !cleanQuery
    ){

        return true;

    }


    const variants =
        buildTrackSearchText(
            track
        );


    /*
     * Проверяем каждую форму.
     */

    for(
        const variant of variants
    ){

        /*
         * Полное включение.
         */

        if(
            variant.includes(
                cleanQuery
            )
        ){

            return true;

        }


        /*
         * Обратное включение.
         *
         * Полезно для коротких русских
         * вариантов.
         */

        if(
            cleanQuery.includes(
                variant
            ) &&
            cleanQuery.length >= 3
        ){

            return true;

        }

    }


    /*
     * Теперь пробуем перевести сам запрос
     * и снова сравнить.
     */

    const queryVariants =
        uniqueVariants([

            cleanQuery,

            transliterateRuToEn(
                cleanQuery
            ),

            transliterateEnToRu(
                cleanQuery
            )

        ]);


    for(
        const q of queryVariants
    ){

        for(
            const variant of variants
        ){

            if(
                fuzzyWordMatch(
                    q,
                    variant
                )
            ){

                return true;

            }

        }

    }


    return false;

}


/* =========================================================
   =========================================================
   ЗАГРУЗКА СПИСКА
   =========================================================
   ========================================================= */

async function loadMusic(){

    try{

        const url =
            LIST_URL +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks =
            data.filter(
                track =>
                    track &&
                    track.id &&
                    track.name
            );


        renderTracks();


    }
    catch(error){

        console.error(
            "Ошибка загрузки музыки:",
            error
        );


        musicList.innerHTML = `

            <div class="status error">

                <strong>
                    🎧 Не удалось загрузить музыку
                </strong>

                <div>
                    Worker HTTP ошибка
                </div>

                <br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

                <br><br>

                <button
                    class="btn download-btn"
                    onclick="loadMusic()"
                    style="max-width:220px;padding:10px 20px"
                >
                    ↻ Повторить
                </button>

            </div>

        `;

    }

}


/* =========================================================
   PLAY URL
   ========================================================= */

function getPlayURL(track){

    return (
        WORKER_URL +
        "/music/" +
        encodeURIComponent(
            track.id
        )
    );

}


/* =========================================================
   DOWNLOAD URL
   ========================================================= */

function getDownloadURL(track){

    return (
        getPlayURL(track) +
        "?download=1"
    );

}


/* =========================================================
   ОСТАНОВИТЬ ВСЕ ТРЕКИ
   ========================================================= */

function stopAllAudio(
    exceptAudio = null
){

    const allAudio =
        document.querySelectorAll(
            "audio"
        );


    allAudio.forEach(
        audio => {

            if(
                audio === exceptAudio
            ){

                return;

            }


            try{

                audio.pause();

                audio.currentTime = 0;

            }
            catch(error){

                console.warn(
                    "Ошибка остановки audio:",
                    error
                );

            }

        }
    );


    if(
        currentAudio &&
        currentAudio !== exceptAudio
    ){

        currentAudio = null;

    }

}


/* =========================================================
   НАСТРОИТЬ AUDIO
   ========================================================= */

function setupAudio(
    audio
){

    if(!audio){

        return;

    }


    audio.addEventListener(
        "play",
        function(){

            if(
                currentAudio &&
                currentAudio !== audio
            ){

                try{

                    currentAudio.pause();

                    currentAudio.currentTime = 0;

                }
                catch(error){

                    console.warn(
                        "Ошибка остановки предыдущего трека:",
                        error
                    );

                }

            }


            const allAudio =
                document.querySelectorAll(
                    "audio"
                );


            allAudio.forEach(
                otherAudio => {

                    if(
                        otherAudio !== audio &&
                        !otherAudio.paused
                    ){

                        try{

                            otherAudio.pause();

                            otherAudio.currentTime = 0;

                        }
                        catch(error){

                            console.warn(
                                "Ошибка остановки audio:",
                                error
                            );

                        }

                    }

                }
            );


            currentAudio =
                audio;

        }
    );


    audio.addEventListener(
        "ended",
        function(){

            if(
                currentAudio === audio
            ){

                currentAudio = null;

            }

        }
    );

}


/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function renderTracks(){

    const query =
        searchInput.value
            .trim();


    const filtered =
        tracks.filter(
            track =>
                smartSearchMatch(
                    track,
                    query
                )
        );


    stopAllAudio();


    if(!filtered.length){

        musicList.innerHTML = `

            <div class="empty">

                🎵 Ничего не найдено

            </div>

        `;

        currentAudio = null;

        return;

    }


    musicList.innerHTML =
        filtered
            .map(
                track =>
                    createTrackHTML(
                        track
                    )
            )
            .join("");


    filtered.forEach(
        track => {

            const audio =
                document.getElementById(
                    "audio-" +
                    track.id
                );


            if(audio){

                audio.src =
                    getPlayURL(
                        track
                    );


                setupAudio(
                    audio
                );

            }

        }
    );

}


/* =========================================================
   СОЗДАНИЕ КАРТОЧКИ
   ========================================================= */

function createTrackHTML(track){

    const id =
        escapeHTML(
            String(
                track.id
            )
        );


    const name =
        escapeHTML(
            removeExtension(
                String(
                    track.name || ""
                )
            )
        );


    return `

        <div
            class="track"
            data-track-id="${id}"
        >

            <div class="track-title">

                <span class="track-icon">
                    🎵
                </span>

                <span class="track-name">
                    ${name}
                </span>

            </div>


            <audio
                id="audio-${id}"
                class="audio"
                controls
                preload="metadata"
            >

                Ваш браузер не поддерживает
                воспроизведение аудио.

            </audio>


            <div class="buttons">


                <a
                    class="btn download-btn"
                    href="${escapeAttribute(
                        getDownloadURL(track)
                    )}"
                    download
                    target="_self"
                >
                    ↓ Скачать MP3
                </a>


                <button
                    class="btn copy-btn"
                    type="button"
                    onclick="copyMusicLink(this, '${escapeJS(
                        getPlayURL(track)
                    )}')"
                >
                    🔗 Копировать ссылку
                </button>


            </div>

        </div>

    `;

}


/* =========================================================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================================================= */

async function copyMusicLink(
    button,
    url
){

    const oldText =
        button.textContent;


    try{

        await navigator.clipboard.writeText(
            url
        );


        button.textContent =
            "✓ Ссылка скопирована";


        button.classList.add(
            "copied"
        );


        setTimeout(
            () => {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1800
        );


    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            url;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try{

            success =
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success =
                false;

        }


        textarea.remove();


        if(success){

            button.textContent =
                "✓ Ссылка скопирована";


            button.classList.add(
                "copied"
            );


            setTimeout(
                () => {

                    button.textContent =
                        oldText;

                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "Скопируй эту ссылку:",
                url
            );

        }

    }

}


/* =========================================================
   ПОИСК
   ========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderTracks();

    }
);


/* =========================================================
   УДАЛИТЬ .MP3
   ========================================================= */

function removeExtension(name){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   JS STRING ESCAPE
   ========================================================= */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}


/* =========================================================
   НАВЕРХ
   ========================================================= */

function scrollTopPage(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   ЗАПУСК
   ========================================================= */

loadMusic();
