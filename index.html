<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const WORKER_URL =
    "https://malyavochka-music.rxmlopdt.workers.dev";


const LIST_URL =
    WORKER_URL + "/list.json";



/* =========================================================
   DOM
   ========================================================= */

const musicList =
    document.getElementById(
        "musicList"
    );


const searchInput =
    document.getElementById(
        "search"
    );



/* =========================================================
   ДАННЫЕ
   ========================================================= */

let tracks = [];



/* =========================================================
   ТЕКУЩИЙ ИГРАЮЩИЙ ТРЕК
   ========================================================= */

let currentAudio = null;



/* =========================================================
   УМНЫЙ ПОИСК
   =========================================================
   
   Поиск работает сразу по нескольким вариантам:
   
   1. Оригинальное название
   2. Транслитерация русского -> английский
   3. Обратная транслитерация английского -> русский
   4. Нормализованный текст
   5. Небольшие ошибки в написании
   6. Частичное совпадение слов
   
   Например:
   
   "Miyagi"
   "Мияги"
   "миаги"
   
   будут считаться похожими.
   
   ========================================================= */


/* =========================================================
   ТРАНСЛИТЕРАЦИЯ
   ========================================================= */

const RU_TO_LAT = {

    "а":"a",
    "б":"b",
    "в":"v",
    "г":"g",
    "д":"d",
    "е":"e",
    "ё":"yo",
    "ж":"zh",
    "з":"z",
    "и":"i",
    "й":"y",
    "к":"k",
    "л":"l",
    "м":"m",
    "н":"n",
    "о":"o",
    "п":"p",
    "р":"r",
    "с":"s",
    "т":"t",
    "у":"u",
    "ф":"f",
    "х":"kh",
    "ц":"ts",
    "ч":"ch",
    "ш":"sh",
    "щ":"shch",
    "ъ":"",
    "ы":"y",
    "ь":"",
    "э":"e",
    "ю":"yu",
    "я":"ya"

};


/* =========================================================
   ВАРИАНТЫ ТРАНСЛИТЕРАЦИИ
   ========================================================= */

const RU_TO_LAT_VARIANTS = {

    "а":["a"],
    "б":["b"],
    "в":["v","w"],
    "г":["g"],
    "д":["d"],
    "е":["e","ye"],
    "ё":["yo","e"],
    "ж":["zh","j"],
    "з":["z"],
    "и":["i"],
    "й":["y","j"],
    "к":["k","c"],
    "л":["l"],
    "м":["m"],
    "н":["n"],
    "о":["o"],
    "п":["p"],
    "р":["r"],
    "с":["s","c"],
    "т":["t"],
    "у":["u"],
    "ф":["f","ph"],
    "х":["kh","h","x"],
    "ц":["ts","c"],
    "ч":["ch"],
    "ш":["sh"],
    "щ":["shch","sch"],
    "ъ":[""],
    "ы":["y","i"],
    "ь":[""],
    "э":["e"],
    "ю":["yu","u"],
    "я":["ya","ia"]

};


/* =========================================================
   АНГЛ -> РУС
   ========================================================= */

const LAT_TO_RU = {

    "shch":"щ",
    "sch":"щ",
    "yo":"ё",
    "zh":"ж",
    "kh":"х",
    "ch":"ч",
    "sh":"ш",
    "ts":"ц",
    "yu":"ю",
    "ya":"я",

    "a":"а",
    "b":"б",
    "c":"к",
    "d":"д",
    "e":"е",
    "f":"ф",
    "g":"г",
    "h":"х",
    "i":"и",
    "j":"й",
    "k":"к",
    "l":"л",
    "m":"м",
    "n":"н",
    "o":"о",
    "p":"п",
    "q":"к",
    "r":"р",
    "s":"с",
    "t":"т",
    "u":"у",
    "v":"в",
    "w":"в",
    "x":"кс",
    "y":"й",
    "z":"з"

};


/* =========================================================
   НОРМАЛИЗАЦИЯ
   ========================================================= */

function normalizeSearch(
    text
){

    return String(text || "")

        .toLowerCase()

        .replace(
            /ё/g,
            "е"
        )

        .replace(
            /[^a-zа-я0-9]+/gi,
            ""
        );

}



/* =========================================================
   РУССКИЙ -> ЛАТИНИЦА
   ========================================================= */

function transliterateRuToLat(
    text
){

    text =
        String(text || "")
            .toLowerCase();


    let result = "";


    for(
        const char of text
    ){

        if(
            RU_TO_LAT[char]
        ){

            result +=
                RU_TO_LAT[char];

        }
        else{

            result +=
                char;

        }

    }


    return result;

}



/* =========================================================
   АНГЛИЙСКИЙ -> ПРИМЕРНАЯ РУССКАЯ ТРАНСКРИПЦИЯ
   ========================================================= */

function transliterateLatToRu(
    text
){

    text =
        String(text || "")
            .toLowerCase();


    let result = "";

    let i = 0;


    while(
        i < text.length
    ){

        let found = false;


        /*
         * Сначала проверяем длинные
         * комбинации.
         */

        const combinations = [
            "shch",
            "sch",
            "tch",
            "th",
            "ph",
            "yo",
            "zh",
            "kh",
            "ch",
            "sh",
            "ts",
            "yu",
            "ya"
        ];


        for(
            const combo of combinations
        ){

            if(
                text.startsWith(
                    combo,
                    i
                )
            ){

                if(
                    combo === "th"
                ){

                    result += "т";

                }
                else if(
                    combo === "tch"
                ){

                    result += "ч";

                }
                else if(
                    combo === "ph"
                ){

                    result += "ф";

                }
                else{

                    result +=
                        LAT_TO_RU[combo] ||
                        combo;

                }


                i +=
                    combo.length;

                found = true;

                break;

            }

        }


        if(found){

            continue;

        }


        const char =
            text[i];


        if(
            LAT_TO_RU[char]
        ){

            result +=
                LAT_TO_RU[char];

        }
        else{

            result +=
                char;

        }


        i++;

    }


    return result;

}



/* =========================================================
   УБРАТЬ СЛОВА-ШУМЫ
   ========================================================= */

function removeSearchNoise(
    text
){

    return String(text || "")

        .toLowerCase()

        .replace(
            /\b(feat|ft|featuring|official|music|audio|remix|edit|version)\b/gi,
            " "
        )

        .replace(
            /[^a-zа-я0-9]+/gi,
            " "
        )

        .trim();

}



/* =========================================================
   ПОЛУЧИТЬ ВАРИАНТЫ ТЕКСТА
   ========================================================= */

function getSearchVariants(
    text
){

    const original =
        String(text || "")
            .toLowerCase();


    const normalized =
        normalizeSearch(
            original
        );


    const ruToLat =
        transliterateRuToLat(
            original
        );


    const latToRu =
        transliterateLatToRu(
            original
        );


    const variants = [

        original,

        normalized,

        ruToLat,

        normalizeSearch(
            ruToLat
        ),

        latToRu,

        normalizeSearch(
            latToRu
        ),

        removeSearchNoise(
            original
        ),

        normalizeSearch(
            removeSearchNoise(
                original
            )
        )

    ];


    /*
     * Удаляем дубликаты.
     */

    return [
        ...new Set(
            variants.filter(
                value =>
                    value &&
                    value.length > 0
            )
        )
    ];

}



/* =========================================================
   РАССТОЯНИЕ ЛЕВЕНШТЕЙНА
   ========================================================= */

function levenshtein(
    a,
    b
){

    a =
        String(a || "");

    b =
        String(b || "");


    if(
        a === b
    ){

        return 0;

    }


    if(
        !a.length
    ){

        return b.length;

    }


    if(
        !b.length
    ){

        return a.length;

    }


    /*
     * Чтобы не создавать огромные массивы,
     * ограничиваем очень длинные строки.
     */

    a =
        a.substring(
            0,
            80
        );

    b =
        b.substring(
            0,
            80
        );


    let previous =
        new Array(
            b.length + 1
        );


    let current =
        new Array(
            b.length + 1
        );


    for(
        let j = 0;
        j <= b.length;
        j++
    ){

        previous[j] =
            j;

    }


    for(
        let i = 1;
        i <= a.length;
        i++
    ){

        current[0] =
            i;


        for(
            let j = 1;
            j <= b.length;
            j++
        ){

            const cost =
                a[i - 1] ===
                b[j - 1]
                    ? 0
                    : 1;


            current[j] =
                Math.min(

                    current[j - 1] + 1,

                    previous[j] + 1,

                    previous[j - 1] + cost

                );

        }


        const temp =
            previous;

        previous =
            current;

        current =
            temp;

    }


    return previous[b.length];

}



/* =========================================================
   ПОХОЖЕСТЬ
   ========================================================= */

function similarity(
    a,
    b
){

    a =
        normalizeSearch(
            a
        );

    b =
        normalizeSearch(
            b
        );


    if(
        !a ||
        !b
    ){

        return 0;

    }


    if(
        a === b
    ){

        return 1;

    }


    if(
        a.includes(b) ||
        b.includes(a)
    ){

        const shortLength =
            Math.min(
                a.length,
                b.length
            );


        return 0.85 +
            Math.min(
                0.14,
                shortLength / 100
            );

    }


    const distance =
        levenshtein(
            a,
            b
        );


    const maxLength =
        Math.max(
            a.length,
            b.length
        );


    if(
        !maxLength
    ){

        return 0;

    }


    return (
        1 -
        distance /
        maxLength
    );

}



/* =========================================================
   ПОИСК ПО ОДНОМУ СЛОВУ
   ========================================================= */

function wordSearchScore(
    query,
    name
){

    const queryWords =
        removeSearchNoise(
            query
        )
        .split(
            /\s+/
        )
        .filter(
            Boolean
        );


    const nameWords =
        removeSearchNoise(
            name
        )
        .split(
            /\s+/
        )
        .filter(
            Boolean
        );


    if(
        !queryWords.length ||
        !nameWords.length
    ){

        return 0;

    }


    let total = 0;


    let foundCount = 0;


    for(
        const queryWord of queryWords
    ){

        let best = 0;


        const queryVariants =
            getSearchVariants(
                queryWord
            );


        for(
            const qVariant of queryVariants
        ){

            for(
                const nameWord of nameWords
            ){

                const nameVariants =
                    getSearchVariants(
                        nameWord
                    );


                for(
                    const nVariant of nameVariants
                ){

                    const score =
                        similarity(
                            qVariant,
                            nVariant
                        );


                    if(
                        score > best
                    ){

                        best =
                            score;

                    }

                }

            }

        }


        /*
         * Разрешаем небольшие ошибки.
         *
         * Короткие слова требуют
         * более точного совпадения.
         */

        const minScore =
            queryWord.length <= 3
                ? 0.90
                : queryWord.length <= 5
                    ? 0.72
                    : 0.60;


        if(
            best >= minScore
        ){

            foundCount++;

            total +=
                best;

        }

    }


    if(
        !foundCount
    ){

        return 0;

    }


    /*
     * Чем больше слов совпало,
     * тем выше результат.
     */

    return (
        total /
        queryWords.length
    ) *
    (
        foundCount /
        queryWords.length
    );

}



/* =========================================================
   ОСНОВНОЙ SCORE ТРЕКА
   ========================================================= */

function getTrackSearchScore(
    track,
    query
){

    if(
        !track ||
        !track.name ||
        !query
    ){

        return 0;

    }


    const name =
        removeExtension(
            String(
                track.name
            )
        );


    /*
     * Варианты всего названия.
     */

    const queryVariants =
        getSearchVariants(
            query
        );


    const nameVariants =
        getSearchVariants(
            name
        );


    let best =
        0;


    /*
     * Сравниваем каждую форму
     * запроса с каждой формой
     * названия.
     */

    for(
        const q of queryVariants
    ){

        for(
            const n of nameVariants
        ){

            const score =
                similarity(
                    q,
                    n
                );


            if(
                score > best
            ){

                best =
                    score;

            }

        }

    }


    /*
     * Отдельно проверяем слова.
     */

    const wordsScore =
        wordSearchScore(
            query,
            name
        );


    if(
        wordsScore > best
    ){

        best =
            wordsScore;

    }


    return best;

}



/* =========================================================
   ЗАГРУЗКА СПИСКА
   ========================================================= */

async function loadMusic(){

    try{

        const url =
            LIST_URL +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks =
            data.filter(
                track =>
                    track &&
                    track.id &&
                    track.name
            );


        renderTracks();


    }
    catch(error){

        console.error(
            "Ошибка загрузки музыки:",
            error
        );


        musicList.innerHTML = `

            <div class="status error">

                <strong>
                    🎧 Не удалось загрузить музыку
                </strong>

                <div>
                    Worker HTTP ошибка
                </div>

                <br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

                <br><br>

                <button
                    class="btn download-btn"
                    onclick="loadMusic()"
                    style="max-width:220px;padding:10px 20px"
                >
                    ↻ Повторить
                </button>

            </div>

        `;

    }

}



/* =========================================================
   PLAY URL
   ========================================================= */

function getPlayURL(track){

    return (
        WORKER_URL +
        "/music/" +
        encodeURIComponent(
            track.id
        )
    );

}



/* =========================================================
   DOWNLOAD URL
   ========================================================= */

function getDownloadURL(track){

    return (
        getPlayURL(track) +
        "?download=1"
    );

}



/* =========================================================
   ОСТАНОВИТЬ ВСЕ ТРЕКИ
   ========================================================= */

function stopAllAudio(
    exceptAudio = null
){

    const allAudio =
        document.querySelectorAll(
            "audio"
        );


    allAudio.forEach(
        audio => {

            if(
                audio === exceptAudio
            ){

                return;

            }


            try{

                audio.pause();

                audio.currentTime = 0;

            }
            catch(error){

                console.warn(
                    "Ошибка остановки audio:",
                    error
                );

            }

        }
    );


    if(
        currentAudio &&
        currentAudio !== exceptAudio
    ){

        currentAudio = null;

    }

}



/* =========================================================
   НАСТРОИТЬ AUDIO
   ========================================================= */

function setupAudio(
    audio
){

    if(!audio){

        return;

    }


    audio.addEventListener(
        "play",
        function(){

            if(
                currentAudio &&
                currentAudio !== audio
            ){

                try{

                    currentAudio.pause();

                    currentAudio.currentTime = 0;

                }
                catch(error){

                    console.warn(
                        "Ошибка остановки предыдущего трека:",
                        error
                    );

                }

            }


            const allAudio =
                document.querySelectorAll(
                    "audio"
                );


            allAudio.forEach(
                otherAudio => {

                    if(
                        otherAudio !== audio &&
                        !otherAudio.paused
                    ){

                        try{

                            otherAudio.pause();

                            otherAudio.currentTime = 0;

                        }
                        catch(error){

                            console.warn(
                                "Ошибка остановки audio:",
                                error
                            );

                        }

                    }

                }
            );


            currentAudio =
                audio;

        }
    );


    audio.addEventListener(
        "ended",
        function(){

            if(
                currentAudio === audio
            ){

                currentAudio = null;

            }

        }
    );

}



/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function renderTracks(){

    const query =
        searchInput.value
            .trim();


    stopAllAudio();


    /*
     * Если поиск пустой —
     * показываем весь каталог.
     */

    if(
        !query
    ){

        musicList.innerHTML =
            tracks
                .map(
                    track =>
                        createTrackHTML(
                            track
                        )
                )
                .join("");


        setupRenderedAudio(
            tracks
        );

        return;

    }


    /*
     * Считаем score для каждого трека.
     */

    const scored =
        tracks.map(
            track => ({

                track:
                    track,

                score:
                    getTrackSearchScore(
                        track,
                        query
                    )

            })
        );


    /*
     * Оставляем только достаточно
     * похожие результаты.
     */

    const filtered =
        scored

            .filter(
                item =>
                    item.score >=
                    0.42
            )

            .sort(
                (a,b) =>
                    b.score -
                    a.score
            );


    if(
        !filtered.length
    ){

        musicList.innerHTML = `

            <div class="empty">

                🎵 Ничего не найдено

                <br><br>

                <small style="color:#555">

                    Попробуй написать название
                    по-русски или по-английски

                </small>

            </div>

        `;

        currentAudio = null;

        return;

    }


    const filteredTracks =
        filtered.map(
            item =>
                item.track
        );


    musicList.innerHTML =
        filteredTracks
            .map(
                track =>
                    createTrackHTML(
                        track
                    )
            )
            .join("");


    setupRenderedAudio(
        filteredTracks
    );

}



/* =========================================================
   НАСТРОИТЬ AUDIO ПОСЛЕ РЕНДЕРА
   ========================================================= */

function setupRenderedAudio(
    list
){

    list.forEach(
        track => {

            const audio =
                document.getElementById(
                    "audio-" +
                    track.id
                );


            if(audio){

                audio.src =
                    getPlayURL(
                        track
                    );


                setupAudio(
                    audio
                );

            }

        }
    );

}



/* =========================================================
   СОЗДАНИЕ КАРТОЧКИ
   ========================================================= */

function createTrackHTML(track){

    const id =
        escapeHTML(
            String(
                track.id
            )
        );


    const name =
        escapeHTML(
            removeExtension(
                String(
                    track.name || ""
                )
            )
        );


    return `

        <div
            class="track"
            data-track-id="${id}"
        >

            <div class="track-title">

                <span class="track-icon">
                    🎵
                </span>

                <span class="track-name">
                    ${name}
                </span>

            </div>


            <audio
                id="audio-${id}"
                class="audio"
                controls
                preload="metadata"
            >

                Ваш браузер не поддерживает
                воспроизведение аудио.

            </audio>


            <div class="buttons">


                <a
                    class="btn download-btn"
                    href="${escapeAttribute(
                        getDownloadURL(track)
                    )}"
                    download
                    target="_self"
                >
                    ↓ Скачать MP3
                </a>


                <button
                    class="btn copy-btn"
                    type="button"
                    onclick="copyMusicLink(this, '${escapeJS(
                        getPlayURL(track)
                    )}')"
                >
                    🔗 Копировать ссылку
                </button>


            </div>

        </div>

    `;

}



/* =========================================================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================================================= */

async function copyMusicLink(
    button,
    url
){

    const oldText =
        button.textContent;


    try{

        await navigator.clipboard.writeText(
            url
        );


        button.textContent =
            "✓ Ссылка скопирована";


        button.classList.add(
            "copied"
        );


        setTimeout(
            () => {

                button.textContent =
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1800
        );


    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            url;


        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try{

            success =
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success =
                false;

        }


        textarea.remove();


        if(success){

            button.textContent =
                "✓ Ссылка скопирована";


            button.classList.add(
                "copied"
            );


            setTimeout(
                () => {

                    button.textContent =
                        oldText;

                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "Скопируй эту ссылку:",
                url
            );

        }

    }

}



/* =========================================================
   ПОИСК
   ========================================================= */

searchInput.addEventListener(
    "input",
    () => {

        renderTracks();

    }
);



/* =========================================================
   УДАЛИТЬ .MP3
   ========================================================= */

function removeExtension(name){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}



/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value){

    return escapeHTML(
        value
    );

}



/* =========================================================
   JS STRING ESCAPE
   ========================================================= */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}



/* =========================================================
   НАВЕРХ
   ========================================================= */

function scrollTopPage(){

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =========================================================
   ЗАПУСК
   ========================================================= */

loadMusic();
