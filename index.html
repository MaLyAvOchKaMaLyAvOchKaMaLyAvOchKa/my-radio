<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>МаЛяВоЧка - Music</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 70% 10%,rgba(0,255,136,.07),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(0,180,255,.05),transparent 30%),
        #0d0d0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:190px;
    height:100vh;
    padding-top:110px;
    background:linear-gradient(180deg,#18181b,#111113);
    border-right:1px solid rgba(255,255,255,.06);
    box-shadow:5px 0 25px rgba(0,0,0,.45);
    z-index:100
}

.menu{
    display:flex;
    align-items:center;
    gap:12px;
    margin:5px 10px;
    padding:17px 20px;
    border-radius:12px;
    color:#ddd;
    text-decoration:none;
    font-size:20px;
    transition:.2s
}

.menu:hover{
    background:rgba(0,255,136,.08);
    color:#00ff88;
    transform:translateX(4px);
    box-shadow:inset 3px 0 #00ff88
}

.menu.active{
    background:rgba(0,255,136,.08);
    color:#00ff88;
    box-shadow:inset 3px 0 #00ff88
}

/* HEADER */

header{
    margin-left:190px;
    padding:30px 35px;
    background:linear-gradient(180deg,#18181a,#151517);
    border-bottom:1px solid rgba(255,255,255,.06);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative
}

.logo{
    font-size:42px;
    font-weight:bold;
    color:#00ff88;
    letter-spacing:1px;
    text-shadow:0 0 15px rgba(0,255,136,.25)
}

/* SEARCH */

.search{
    position:absolute;
    right:30px;
    top:50%;
    transform:translateY(-50%);
    width:230px
}

.search-box{
    height:42px;
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 13px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.09);
    border-radius:13px;
    transition:.25s
}

.search-box:focus-within{
    border-color:rgba(0,255,136,.5);
    background:rgba(0,255,136,.045);
    box-shadow:0 0 18px rgba(0,255,136,.08)
}

.search-icon{
    width:15px;
    height:15px;
    border:2px solid #aaa;
    border-radius:50%;
    position:relative;
    flex:none
}

.search-icon:after{
    content:"";
    position:absolute;
    width:7px;
    height:2px;
    background:#aaa;
    right:-6px;
    bottom:-3px;
    transform:rotate(45deg);
    border-radius:2px
}

.search-box:focus-within .search-icon{
    border-color:#00ff88
}

.search-box:focus-within .search-icon:after{
    background:#00ff88
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:14px
}

.search input::placeholder{
    color:#888
}

/* CONTENT */

.content{
    margin-left:190px;
    width:calc(100% - 190px);
    max-width:1200px;
    padding:35px 30px 80px;
    margin-right:auto
}

/* SECTION */

.section-title{
    width:min(760px,90%);
    margin:0 auto 18px;
    font-size:25px;
    font-weight:bold
}

.section-title span{
    color:#9a6cff;
    margin-right:7px
}

/* SONG */

.song{
    width:min(760px,90%);
    margin:0 auto 20px;
    padding:18px 20px;
    background:linear-gradient(145deg,rgba(38,38,41,.96),rgba(29,29,32,.96));
    border:1px solid rgba(255,255,255,.05);
    border-radius:17px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:.2s
}

.song:hover{
    transform:translateY(-2px);
    border-color:rgba(0,255,136,.16);
    box-shadow:0 14px 35px rgba(0,0,0,.4)
}

.song.hidden{
    display:none
}

.song-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:13px
}

.title{
    min-width:0;
    display:flex;
    align-items:center;
    gap:9px;
    font-size:23px;
    color:#f2f2f2
}

.music-icon{
    flex:none;
    font-size:27px;
    filter:drop-shadow(0 0 6px rgba(150,80,255,.4))
}

/* FFT */

.fft{
    width:120px;
    height:28px;
    flex:none;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s
}

.fft.active{
    opacity:1;
    visibility:visible
}

.fft canvas{
    display:block;
    width:120px;
    height:28px
}

/* AUDIO */

audio{
    display:block;
    width:100%;
    height:48px;
    margin-bottom:14px;
    border-radius:12px
}

/* BUTTONS */

.buttons{
    display:flex;
    gap:10px
}

.btn{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-size:16px;
    font-weight:bold;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
    transition:.15s
}

.btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08)
}

.btn:active{
    transform:translateY(0)
}

.download{
    background:#00c878;
    color:#fff;
    box-shadow:0 5px 15px rgba(0,200,120,.12)
}

.download:hover{
    box-shadow:0 7px 20px rgba(0,200,120,.2)
}

.copy{
    background:#0796d1;
    color:#fff
}

.copy:hover{
    box-shadow:0 7px 20px rgba(0,150,210,.18)
}

.copy.copied{
    background:#00b86b
}

/* NO RESULTS */

.no-results{
    width:min(760px,90%);
    margin:50px auto;
    text-align:center;
    color:#777;
    font-size:17px;
    display:none
}

.no-results.show{
    display:block
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        width:70px;
        padding-top:90px
    }

    .menu{
        justify-content:center;
        padding:15px;
        margin:6px;
        font-size:0
    }

    .menu span{
        display:none
    }

    header{
        margin-left:70px;
        padding:22px 10px;
        justify-content:center
    }

    .logo{
        font-size:27px
    }

    .search{
        position:fixed;
        right:15px;
        top:auto;
        bottom:15px;
        transform:none;
        width:calc(100% - 100px);
        z-index:200
    }

    .content{
        margin-left:70px;
        width:calc(100% - 70px);
        padding:25px 10px 80px
    }

    .song,
    .section-title,
    .no-results{
        width:100%
    }
}

@media(max-width:600px){

    .logo{
        font-size:23px
    }

    .song{
        padding:15px
    }

    .title{
        font-size:19px
    }

    .music-icon{
        font-size:23px
    }

    .fft{
        width:90px
    }

    .fft canvas{
        width:90px
    }

    .buttons{
        flex-direction:column
    }

    .btn{
        width:100%
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">
    <a href="index.html" class="menu active">🎧 <span>Music</span></a>
    <a href="Roflan.html" class="menu">😂 <span>Рофл звуки</span></a>
    <a href="Gachi.html" class="menu">🎤 <span>Gachi</span></a>
    <a href="Skrimer.html" class="menu">😱 <span>Скримеры</span></a>
</div>

<!-- HEADER -->

<header>
    <div class="logo">🎧 МаЛяВоЧка - Music 🎧</div>

    <div class="search">
        <div class="search-box">
            <div class="search-icon"></div>
            <input
                id="searchInput"
                type="text"
                placeholder="Найти трек..."
                autocomplete="off">
        </div>
    </div>
</header>

<!-- CONTENT -->

<div class="content">

    <div class="section-title">
        <span>🎵</span>Музыка
    </div>

    <div id="songs"></div>

    <div id="noResults" class="no-results">
        Ничего не найдено 😔
    </div>

</div>

<script>

/* =========================
   ТРЕКИ
   aliases — дополнительные слова для поиска
   ========================= */

const tracks=[
    {
        name:"MIA BOYKA - Экспонат",
        file:"Exponat.mp3",
        aliases:"экспонат exponat mia boyka мия бойка"
    },
    {
        name:"Ella Dance",
        file:"elladance.mp3",
        aliases:"ella dance элла данс элла"
    },
    {
        name:"Music",
        file:"music.mp3",
        aliases:"music музыка"
    },
    {
        name:"Wanpis",
        file:"wanpis.mp3",
        aliases:"wanpis ванпис"
    },
    {
        name:"Kesha",
        file:"Kesha.mp3",
        aliases:"kesha кеша"
    },
    {
        name:"Mount Noize - Generation Around The World",
        file:"Mount_Noize_Generation-AroundTheWorld.mp3",
        aliases:"mount noize generation around the world маунт нойз"
    },
    {
        name:"R3hab - All Around The World",
        file:"R3hab_A_Touch_Of_Class-All_Around_The_World(La_La_La).mp3",
        aliases:"r3hab all around the world рэхаб ребхаб ла ла ла"
    },
    {
        name:"Daryana - Juice",
        file:"Daryana-Juice.mp3",
        aliases:"daryana juice дарьяна дарья дарь juice джус"
    },
    {
        name:"Dora - Vturilas",
        file:"Dora-Vturilas.mp3",
        aliases:"dora vturilas дора втюрилась"
    },
    {
        name:"PSY - Gangnam Style",
        file:"PSY-Gangnam_Style.mp3",
        aliases:"psy gangnam style псай ганганм стайл ганнам стайл"
    },
    {
        name:"Skriptonit - Baby Mama",
        file:"Skriptonit-Baby_Mama.mp3",
        aliases:"skriptonit baby mama скриптонит бэйби мама"
    },
    {
        name:"Deti Rave - Abonnement",
        file:"Deti_Rave-Abonnement.mp3",
        aliases:"deti rave abonnement дети рейв абонемент"
    },
    {
        name:"Dead Blonde - Мальчик на девятке",
        file:"Dead_Blonde-Malchik_Na_Devyatke.mp3",
        aliases:"dead blonde мальчик на девятке дед блонд девятка мальчик"
    },
    {
        name:"Poshlaya Molly - Non Stop",
        file:"Poshlaya_Molli-Non_Stop.mp3",
        aliases:"poshlaya molly non stop пошлая молли нон стоп молли"
    },
    {
        name:"Gachi",
        file:"Gachi.mp3",
        aliases:"gachi гачи гачі"
    }
];

/* =========================
   СОЗДАНИЕ ТРЕКОВ
   ========================= */

const songsBox=document.getElementById("songs");

tracks.forEach((track,index)=>{

    const song=document.createElement("div");
    song.className="song";

    song.dataset.search=(
        track.name+" "+track.aliases
    ).toLowerCase();

    song.innerHTML=`
        <div class="song-top">
            <div class="title">
                <span class="music-icon">🎵</span>
                <span>${track.name}</span>
            </div>

            <div class="fft">
                <canvas></canvas>
            </div>
        </div>

        <audio controls preload="metadata">
            <source src="${track.file}" type="audio/mpeg">
        </audio>

        <div class="buttons">
            <a
                class="btn download"
                href="${track.file}"
                download>
                ↓ Скачать MP3
            </a>

            <button
                class="btn copy"
                onclick="copyLink(this,'${track.file}')">
                🔗 Копировать ссылку
            </button>
        </div>
    `;

    songsBox.appendChild(song);
});

/* =========================
   AUDIO
   ========================= */

const players=[...document.querySelectorAll("audio")];

let audioContext=null;
let activeAudio=null;
let activeFFT=null;
let activeAnalyser=null;
let activeData=null;
let animationFrame=null;

/* =========================
   FFT
   ========================= */

function createAnalyser(audio){

    if(audio._analyser)
        return audio._analyser;

    if(!audioContext)
        audioContext=new(window.AudioContext||window.webkitAudioContext)();

    const source=audioContext.createMediaElementSource(audio);
    const analyser=audioContext.createAnalyser();

    analyser.fftSize=128;
    analyser.smoothingTimeConstant=.78;

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    audio._analyser=analyser;
    audio._source=source;

    return analyser;
}

function clearFFT(){

    if(animationFrame){
        cancelAnimationFrame(animationFrame);
        animationFrame=null;
    }

    document.querySelectorAll(".fft").forEach(fft=>{
        fft.classList.remove("active");

        const canvas=fft.querySelector("canvas");
        if(canvas){
            const ctx=canvas.getContext("2d");
            ctx.clearRect(0,0,canvas.width,canvas.height);
        }
    });

    activeAudio=null;
    activeFFT=null;
    activeAnalyser=null;
    activeData=null;
}

function drawFFT(){

    if(!activeAudio||
       activeAudio.paused||
       activeAudio.ended||
       !activeFFT||
       !activeAnalyser){
        clearFFT();
        return;
    }

    const canvas=activeFFT.querySelector("canvas");
    const ctx=canvas.getContext("2d");

    const width=canvas.width;
    const height=canvas.height;

    activeAnalyser.getByteFrequencyData(activeData);

    ctx.clearRect(0,0,width,height);

    const bars=26;
    const gap=2;
    const barWidth=(width-(bars-1)*gap)/bars;

    for(let i=0;i<bars;i++){

        const index=Math.floor(
            i*activeData.length/bars
        );

        let value=activeData[index]/255;

        value=Math.pow(value,.75);

        const barHeight=Math.max(
            2,
            value*(height-2)
        );

        const x=i*(barWidth+gap);
        const y=height-barHeight;

        const gradient=ctx.createLinearGradient(
            0,y,
            0,height
        );

        gradient.addColorStop(0,"#00ff88");
        gradient.addColorStop(1,"#007f66");

        ctx.fillStyle=gradient;

        ctx.beginPath();

        if(ctx.roundRect){
            ctx.roundRect(
                x,
                y,
                barWidth,
                barHeight,
                2
            );
        }else{
            ctx.rect(
                x,
                y,
                barWidth,
                barHeight
            );
        }

        ctx.fill();
    }

    animationFrame=requestAnimationFrame(drawFFT);
}

function startFFT(audio){

    clearFFT();

    activeAudio=audio;

    const song=audio.closest(".song");
    activeFFT=song.querySelector(".fft");

    activeFFT.classList.add("active");

    activeAnalyser=createAnalyser(audio);

    activeData=new Uint8Array(
        activeAnalyser.frequencyBinCount
    );

    if(audioContext.state==="suspended")
        audioContext.resume();

    drawFFT();
}

/* =========================
   PLAY / PAUSE
   ========================= */

players.forEach(audio=>{

    audio.addEventListener("play",()=>{

        players.forEach(other=>{
            if(other!==audio){
                other.pause();
                other.currentTime=0;
            }
        });

        startFFT(audio);
    });

    audio.addEventListener("pause",()=>{

        if(activeAudio===audio)
            clearFFT();
    });

    audio.addEventListener("ended",()=>{

        if(activeAudio===audio)
            clearFFT();
    });
});

/* =========================
   ПОИСК
   ========================= */

const searchInput=document.getElementById("searchInput");
const noResults=document.getElementById("noResults");

searchInput.addEventListener("input",()=>{

    const query=normalize(searchInput.value);

    let found=0;

    document.querySelectorAll(".song").forEach(song=>{

        const text=song.dataset.search;

        const visible=
            !query||
            text.includes(query);

        song.classList.toggle(
            "hidden",
            !visible
        );

        if(visible)
            found++;
    });

    noResults.classList.toggle(
        "show",
        found===0
    );
});

function normalize(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/ё/g,"е");
}

/* =========================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================= */

function copyLink(button,file){

    const link=
        location.origin+
        location.pathname.replace(/[^\/]*$/,"")+
        file;

    navigator.clipboard.writeText(link)
    .then(()=>showCopied(button))
    .catch(()=>{

        const input=document.createElement("input");

        input.value=link;
        document.body.appendChild(input);
        input.select();

        document.execCommand("copy");

        input.remove();

        showCopied(button);
    });
}

function showCopied(button){

    const oldText=button.innerHTML;

    button.innerHTML="✓ Ссылка скопирована!";
    button.classList.add("copied");

    setTimeout(()=>{
        button.innerHTML=oldText;
        button.classList.remove("copied");
    },1500);
}

/* =========================
   ОБЩАЯ ГРОМКОСТЬ
   ========================= */

let savedVolume=
    localStorage.getItem("musicVolume");

savedVolume=
    savedVolume===null?
    1:
    parseFloat(savedVolume);

players.forEach(player=>{

    player.volume=savedVolume;

    player.addEventListener(
        "volumechange",
        ()=>{

            localStorage.setItem(
                "musicVolume",
                player.volume
            );

            players.forEach(other=>{

                if(other!==player)
                    other.volume=player.volume;

            });
        }
    );
});

</script>

</body>
</html>
