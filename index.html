<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>МаЛяВоЧка - Music</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at 70% 0%,
            #242424 0%,
            #111 45%,
            #080808 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;
}


header {

    padding: 35px 25px 20px;

    max-width: 1100px;

    margin: auto;
}


.logo {

    font-size: 34px;

    font-weight: 800;

    letter-spacing: 1px;

    margin-bottom: 8px;
}


.subtitle {

    color: #888;

    font-size: 15px;
}


.container {

    max-width: 1100px;

    margin: auto;

    padding: 20px 25px 60px;
}


.search {

    width: 100%;

    padding: 17px 20px;

    border-radius: 14px;

    border: 1px solid #333;

    background: #151515;

    color: white;

    outline: none;

    font-size: 16px;

    margin-bottom: 25px;

    transition: .2s;
}


.search:focus {

    border-color: #666;

    background: #191919;
}


.status {

    color: #777;

    margin-bottom: 20px;

    font-size: 14px;
}


.track {

    display: flex;

    align-items: center;

    gap: 15px;

    background:
        linear-gradient(
            135deg,
            #181818,
            #111
        );

    border: 1px solid #292929;

    border-radius: 15px;

    padding: 15px;

    margin-bottom: 10px;

    transition: .2s;
}


.track:hover {

    border-color: #444;

    transform: translateY(-1px);
}


.track-number {

    width: 38px;

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #777;

    font-size: 13px;

    flex-shrink: 0;
}


.track-info {

    flex: 1;

    min-width: 0;
}


.track-name {

    font-size: 16px;

    font-weight: 600;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


.track-file {

    margin-top: 4px;

    color: #666;

    font-size: 12px;
}


.buttons {

    display: flex;

    gap: 8px;

    flex-shrink: 0;
}


button {

    border: 0;

    border-radius: 10px;

    padding: 10px 14px;

    cursor: pointer;

    color: white;

    background: #252525;

    border: 1px solid #3a3a3a;

    transition: .15s;

    font-size: 13px;
}


button:hover {

    background: #333;
}


button:active {

    transform: scale(.96);
}


.play-button {

    background: #fff;

    color: #000;

    border-color: white;

    min-width: 75px;
}


.play-button:hover {

    background: #ddd;
}


.copy-button {

    min-width: 100px;
}


.copy-button.copied {

    background: #294b2e;

    border-color: #3d7545;
}


audio {

    width: 100%;

    margin-top: 25px;

    display: none;
}


.empty {

    text-align: center;

    padding: 60px 20px;

    color: #666;
}


.error {

    padding: 20px;

    border-radius: 12px;

    background: #291414;

    border: 1px solid #552525;

    color: #ff9c9c;

    white-space: pre-wrap;
}


@media (max-width: 700px) {

    header {

        padding: 25px 15px 15px;
    }

    .container {

        padding: 15px 15px 40px;
    }

    .track {

        align-items: flex-start;
    }

    .buttons {

        flex-direction: column;
    }

    .track-number {

        display: none;
    }

    .track-name {

        white-space: normal;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        МаЛяВоЧка Music
    </div>

    <div class="subtitle">
        Музыкальный каталог
    </div>

</header>


<div class="container">


    <input
        id="search"
        class="search"
        type="text"
        placeholder="Поиск музыки..."
        autocomplete="off"
    >


    <div
        id="status"
        class="status"
    >
        Загрузка каталога...
    </div>


    <div id="tracks"></div>


    <audio
        id="player"
        controls
    ></audio>


</div>


<script>


// ============================================================
// ВАЖНО!
// Здесь адрес твоего Cloudflare Worker.
// ============================================================

const WORKER_URL =
    "https://malyavochka-music.rxmlopdt.workers.dev";


// ============================================================

let tracks = [];

let currentAudio = null;


// ------------------------------------------------------------
// Элементы
// ------------------------------------------------------------

const search =
    document.getElementById("search");

const tracksContainer =
    document.getElementById("tracks");

const status =
    document.getElementById("status");

const player =
    document.getElementById("player");


// ------------------------------------------------------------
// Загрузка каталога
// ------------------------------------------------------------

async function loadTracks() {

    status.textContent =
        "Загрузка каталога...";

    try {

        const response =
            await fetch(
                WORKER_URL + "/api/list"
            );


        if (!response.ok) {

            throw new Error(
                "Worker ответил HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "Worker не смог получить список музыки."
            );
        }


        tracks = data.tracks || [];


        // Сортировка по названию
        tracks.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    "ru"
                )
        );


        status.textContent =
            `Найдено треков: ${tracks.length}`;


        renderTracks();


    }

    catch (error) {

        console.error(error);


        status.textContent = "";


        tracksContainer.innerHTML = `

            <div class="error">

                Не удалось загрузить каталог.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;
    }
}


// ------------------------------------------------------------
// Отображение треков
// ------------------------------------------------------------

function renderTracks() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        tracks.filter(track =>
            track.name
                .toLowerCase()
                .includes(query)
        );


    if (filtered.length === 0) {

        tracksContainer.innerHTML = `

            <div class="empty">

                Ничего не найдено

            </div>

        `;

        return;
    }


    tracksContainer.innerHTML =
        filtered.map(
            (track, index) => `

        <div
            class="track"
            data-slug="${escapeAttribute(track.slug)}"
        >

            <div class="track-number">
                ${index + 1}
            </div>


            <div class="track-info">

                <div class="track-name">

                    ${escapeHtml(track.name)}

                </div>


                <div class="track-file">

                    ${escapeHtml(track.path)}

                </div>

            </div>


            <div class="buttons">


                <button
                    class="play-button"
                    onclick="playTrack(
                        '${escapeJs(track.url)}',
                        this
                    )"
                >

                    ▶ Играть

                </button>


                <button
                    class="copy-button"
                    onclick="copyLink(
                        '${escapeJs(track.url)}',
                        this
                    )"
                >

                    📋 Копировать

                </button>


            </div>

        </div>

    `
        ).join("");
}


// ------------------------------------------------------------
// Проигрывание
// ------------------------------------------------------------

function playTrack(url, button) {

    if (
        currentAudio === url &&
        !player.paused
    ) {

        player.pause();

        button.textContent =
            "▶ Играть";

        return;
    }


    currentAudio = url;


    player.src = url;

    player.style.display = "block";


    player.play()
        .catch(error => {

            console.error(error);

            alert(
                "Не удалось запустить MP3."
            );

        });


    document
        .querySelectorAll(".play-button")
        .forEach(btn => {

            btn.textContent =
                "▶ Играть";

        });


    button.textContent =
        "⏸ Пауза";
}


// ------------------------------------------------------------
// После остановки
// ------------------------------------------------------------

player.addEventListener(
    "ended",
    () => {

        document
            .querySelectorAll(".play-button")
            .forEach(btn => {

                btn.textContent =
                    "▶ Играть";

            });

    }
);


// ------------------------------------------------------------
// Копирование ссылки
// ------------------------------------------------------------

async function copyLink(url, button) {

    try {

        await navigator.clipboard.writeText(url);


        const oldText =
            button.textContent;


        button.textContent =
            "✓ Скопировано";

        button.classList.add(
            "copied"
        );


        setTimeout(() => {

            button.textContent =
                oldText;

            button.classList.remove(
                "copied"
            );

        }, 1500);


    }

    catch (error) {

        // Запасной способ
        const textarea =
            document.createElement("textarea");


        textarea.value = url;


        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        button.textContent =
            "✓ Скопировано";


        setTimeout(() => {

            button.textContent =
                "📋 Копировать";

        }, 1500);

    }
}


// ------------------------------------------------------------
// Поиск
// ------------------------------------------------------------

search.addEventListener(
    "input",
    renderTracks
);


// ------------------------------------------------------------
// Защита HTML
// ------------------------------------------------------------

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(text) {

    return escapeHtml(text);
}


function escapeJs(text) {

    return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
}


// ------------------------------------------------------------
// Запуск
// ------------------------------------------------------------

loadTracks();


</script>


</body>

</html>
