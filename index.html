Ничего не найдено 😔

<script>

/* =========================================================
   MaLyAvOchKa Music
   ========================================================= */

/*
   Worker оставляем как есть.

   /list возвращает:
   ID → путь к файлу

   Например:
   5b7dc5c1 → Music/SABI & Миа Бойка - Базовый минимум.mp3

   Главная страница берет ТОЛЬКО строки,
   где путь начинается с Music/.
*/

const WORKER="https://malyavochka-music.rxmlopdt.workers.dev";

const LIST_URL=WORKER+"/list";

let songs=[];
let players=[];
let currentAudio=null;
let audioCtx=null;
let raf=null;

const sourceMap=new WeakMap();

const translit={
"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo",
"ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m",
"н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u",
"ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch",
"ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"
};

const reverseTranslit={
"yo":"ё","zh":"ж","sch":"щ","sh":"ш","ch":"ч",
"yu":"ю","ya":"я","ts":"ц"
};


/* =========================================================
   ЗАГРУЗКА МУЗЫКИ ЧЕРЕЗ WORKER
   ========================================================= */

async function loadMusic(){

const loading=document.getElementById("loading");
const error=document.getElementById("error");

try{

const response=await fetch(
LIST_URL+"?t="+Date.now(),
{
cache:"no-store"
}
);

if(!response.ok){
throw new Error("Worker: "+response.status);
}

const text=await response.text();

/*
   Worker возвращает обычный текст примерно такого вида:

   5b7dc5c1  →  Music/SABI & Миа Бойка - Базовый минимум.mp3
   https://.../music/5b7dc5c1

   Поэтому разбираем первую строку каждой записи.
*/

const lines=text
.split(/\r?\n/)
.map(line=>line.trim())
.filter(Boolean);

const musicFiles=[];

for(let i=0;i<lines.length;i++){

const line=lines[i];

/*
   Ищем:

   ID → путь.mp3

   ID может быть:
   - 8 цифр
   - 8 символов hex
*/

const match=line.match(
/^([a-f0-9]{8}|\d{8})\s+→\s+(.+\.mp3)$/i
);

if(!match){
continue;
}

const id=match[1];
const filePath=match[2];

/*
   ГЛАВНОЕ УСЛОВИЕ:

   Показываем только файлы из папки Music.

   Поэтому:

   Music/что-то.mp3       ← ПОКАЗЫВАЕМ

   Gachi/что-то.mp3       ← НЕ ПОКАЗЫВАЕМ
   Roflan/что-то.mp3      ← НЕ ПОКАЗЫВАЕМ
   Skrimers/что-то.mp3   ← НЕ ПОКАЗЫВАЕМ
   Robot/что-то.mp3       ← НЕ ПОКАЗЫВАЕМ
   что-то.mp3             ← НЕ ПОКАЗЫВАЕМ
*/

if(!filePath.startsWith("Music/")){
continue;
}

const fileName=filePath.substring(
"Music/".length
);

musicFiles.push({
id:id,
name:fileName,
path:filePath
});

}


/* =========================================================
   СОРТИРОВКА
   ========================================================= */

musicFiles.sort((a,b)=>
a.name.localeCompare(
b.name,
"ru",
{
numeric:true,
sensitivity:"base"
}
)
);


/* =========================================================
   СОЗДАНИЕ ПЕСЕН
   ========================================================= */

const container=document.getElementById("songsContainer");

container.innerHTML="";

musicFiles.forEach(file=>{

createSong(
file.name,
file.id,
container
);

});


/* =========================================================
   ПОЛУЧАЕМ PLAYERS
   ========================================================= */

songs=[
...document.querySelectorAll(".song")
];

players=[
...document.querySelectorAll("audio")
];


/* =========================================================
   LOADING
   ========================================================= */

loading.style.display=
musicFiles.length?
"none":
"block";

if(!musicFiles.length){

loading.innerHTML=
'В папке <span>Music</span> пока нет MP3 🎵';

}


/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

setupPlayers();

setupVolume();

setupSearch();


}catch(e){

console.error(
"Ошибка загрузки музыки:",
e
);

loading.style.display="none";

error.style.display="block";

error.innerHTML=
"<b>🎧 Музыка куда-то сбежала...</b><br><br>"+
"МаЛяВоЧка не смогла открыть музыкальную коллекцию 😔<br>"+
"Попробуй обновить страницу чуть позже.";

}

}


/* =========================================================
   СОЗДАНИЕ ПЕСНИ
   ========================================================= */

function createSong(
fileName,
id,
container
){

let title=
fileName.replace(
/\.mp3$/i,
""
);

try{

title=decodeURIComponent(title);

}catch(e){}


const searchText=
title
.replace(/[_\-]+/g," ")
.replace(/\s+/g," ")
.trim();


/*
   ВАЖНО:

   Теперь MP3 НЕ берется напрямую с GitHub.

   Плеер и скачивание идут через Worker:

   https://malyavochka-music.rxmlopdt.workers.dev/music/ID
*/

const fullURL=
WORKER+"/music/"+id;


const song=
document.createElement("div");

song.className="song";

song.dataset.search=
makeSearchVariants(searchText);


/* =========================================================
   HTML ПЕСНИ
   ========================================================= */

song.innerHTML=`

<div class="title">

<span class="music-icon">🎵</span>

<span title="${escapeHTML(title)}">
${escapeHTML(title)}
</span>

<canvas
class="fft"
width="440"
height="96">
</canvas>

</div>

<audio
controls
preload="metadata">

<source
src="${fullURL}"
type="audio/mpeg">

</audio>

<div class="buttons">

<a
class="btn download"
href="${fullURL}"
download>

↓ Скачать MP3

</a>

<button
class="btn copy">

🔗 Копировать ссылку

</button>

</div>

`;


/* =========================================================
   КОПИРОВАНИЕ ССЫЛКИ
   ========================================================= */

song
.querySelector(".copy")
.addEventListener(
"click",
()=>{

copyLink(
song.querySelector(".copy"),
fullURL
);

}
);


container.appendChild(song);

}


/* =========================================================
   ПОИСК
   ========================================================= */

function makeSearchVariants(text){

let base=
normalizeSearch(text);

let transliterated="";


for(const char of base){

transliterated+=
translit[char]!==undefined?
translit[char]:
char;

}


let words=
base
.split(" ")
.filter(Boolean);


let extraWords=[];


words.forEach(word=>{

if(word.length>=2){

extraWords.push(word);

}

});


return(
base+" "+
normalizeSearch(transliterated)+" "+
normalizeSearch(extraWords.join(" "))
).trim();

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================================================
   NORMALIZE SEARCH
   ========================================================= */

function normalizeSearch(text){

return text
.toLowerCase()
.replace(/ё/g,"е")
.replace(/й/g,"и")
.replace(/[_\-–—]+/g," ")
.replace(/[^a-zа-я0-9\s]/gi," ")
.replace(/\s+/g," ")
.trim();

}


/* =========================================================
   ПОИСК
   ========================================================= */

function setupSearch(){

const input=
document.getElementById(
"searchInput"
);

const noResults=
document.getElementById(
"noResults"
);


input.addEventListener(
"input",
function(){

const query=
normalizeSearch(
this.value
);


const words=
query
.split(" ")
.filter(Boolean);


let found=0;


songs.forEach(song=>{

const text=
song.dataset.search;


const visible=
!words.length||
words.every(word=>{

return text.includes(word);

});


song.classList.toggle(
"hidden",
!visible
);


if(visible){

found++;

}

});


noResults.style.display=
found===0&&words.length?
"block":
"none";

}
);

}


/* =========================================================
   ПАУЗА ДРУГИХ ПЛЕЕРОВ
   ========================================================= */

function pauseOthers(current){

players.forEach(player=>{

if(player!==current){

player.pause();

player.currentTime=0;


const oldSong=
player.closest(".song");


if(oldSong){

oldSong.classList.remove(
"playing"
);

clearFFT(oldSong);

}

}

});


currentAudio=current;


const currentSong=
current.closest(".song");


if(currentSong){

currentSong.classList.add(
"playing"
);

}


const saved=
localStorage.getItem(
"musicVolume"
);


if(saved!==null){

current.volume=
parseFloat(saved);

}

}


/* =========================================================
   AUDIO CONTEXT
   ========================================================= */

function getAudioContext(){

if(!audioCtx){

audioCtx=new(
window.AudioContext||
window.webkitAudioContext
)();

}

return audioCtx;

}


/* =========================================================
   AUDIO ANALYSER
   ========================================================= */

function setupAudio(audio){

if(sourceMap.has(audio)){

return sourceMap.get(audio);

}


const ctx=
getAudioContext();


const source=
ctx.createMediaElementSource(
audio
);


const analyser=
ctx.createAnalyser();


analyser.fftSize=1024;

analyser.smoothingTimeConstant=.28;

analyser.minDecibels=-95;

analyser.maxDecibels=-8;


source.connect(analyser);

analyser.connect(
ctx.destination
);


const result={

source:source,

analyser:analyser

};


sourceMap.set(
audio,
result
);


return result;

}


/* =========================================================
   ОЧИСТКА FFT
   ========================================================= */

function clearFFT(song){

if(!song)return;


const canvas=
song.querySelector(
".fft"
);


if(!canvas)return;


canvas
.getContext("2d")
.clearRect(
0,
0,
canvas.width,
canvas.height
);

}


/* =========================================================
   FFT
   ========================================================= */

function startFFT(audio){

if(raf){

cancelAnimationFrame(
raf
);

raf=null;

}


songs.forEach(song=>{

if(
song!==audio.closest(".song")
){

song.classList.remove(
"playing"
);

clearFFT(song);

}

});


let analyser;


try{

const ctx=
getAudioContext();


if(ctx.state==="suspended"){

ctx.resume();

}


analyser=
setupAudio(audio)
.analyser;


}catch(e){

console.error(e);

return;

}


const song=
audio.closest(".song");


const canvas=
song.querySelector(".fft");


const ctx=
canvas.getContext("2d");


const data=
new Uint8Array(
analyser.frequencyBinCount
);


const bars=38;


const values=
new Float32Array(
bars
);


function draw(){

if(
audio!==currentAudio||
audio.paused||
audio.ended||
!song.classList.contains("playing")
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

return;

}


analyser.getByteFrequencyData(
data
);


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const gap=3;


const bw=
(canvas.width-
gap*(bars-1))/bars;


const time=
performance.now();


for(
let i=0;
i<bars;
i++
){

const t=
i/(bars-1);


let minBin=
Math.floor(
2*Math.pow(
(data.length-2)/2,
t
)
);


let maxBin=
Math.floor(
3*Math.pow(
(data.length-2)/3,
t
)
);


if(maxBin<=minBin){

maxBin=
minBin+1;

}


let sum=0;

let count=0;


for(
let j=minBin;
j<=maxBin&&j<data.length;
j++
){

const weight=
1-
Math.abs(
j-(minBin+maxBin)/2
)/
(maxBin-minBin+1);


sum+=
data[j]*(.65+weight);


count+=
.65+weight;

}


let value=
count?
sum/count/255:
0;


value=
Math.pow(
value,
.48
);


value*=
.9+t*.8;


value+=
Math.sin(
time*.012+i*1.7
)*.012;


if(value>values[i]){

values[i]+=
(value-values[i])*.72;

}else{

values[i]+=
(value-values[i])*.34;

}


const floor=
.025+
Math.sin(
time*.006+i*.9
)*.008;


const finalValue=
Math.max(
values[i],
floor
);


const h=
Math.max(
2,
finalValue*
canvas.height*
.94
);


const x=
i*(bw+gap);


const y=
canvas.height-h;


const grad=
ctx.createLinearGradient(
0,
y,
0,
canvas.height
);


grad.addColorStop(
0,
"#00ff88"
);


grad.addColorStop(
.45,
"#00ed91"
);


grad.addColorStop(
1,
"#00a96b"
);


ctx.fillStyle=grad;


ctx.globalAlpha=.95;


ctx.fillRect(
Math.round(x),
Math.round(y),
Math.max(
1,
Math.round(bw)
),
Math.round(h)
);

}


ctx.globalAlpha=1;


raf=
requestAnimationFrame(draw);

}


draw();

}


/* =========================================================
   PLAYERS
   ========================================================= */

function setupPlayers(){

players.forEach(player=>{


player.addEventListener(
"play",
()=>{

pauseOthers(player);

startFFT(player);

}
);


player.addEventListener(
"pause",
()=>{

if(
player===currentAudio
){

const song=
player.closest(".song");


if(song){

song.classList.remove(
"playing"
);

clearFFT(song);

}


if(raf){

cancelAnimationFrame(
raf
);

raf=null;

}

}

}
);


player.addEventListener(
"ended",
()=>{

if(
player===currentAudio
){

const song=
player.closest(".song");


if(song){

song.classList.remove(
"playing"
);

clearFFT(song);

}


if(raf){

cancelAnimationFrame(
raf
);

raf=null;

}


currentAudio=null;

}

}
);

});

}


/* =========================================================
   COPY LINK
   ========================================================= */

function copyLink(button,link){

navigator.clipboard
.writeText(link)
.then(()=>{

showCopied(button);

})
.catch(()=>{

const input=
document.createElement(
"input"
);


input.value=link;


document.body.appendChild(
input
);


input.select();


document.execCommand(
"copy"
);


document.body.removeChild(
input
);


showCopied(button);

});

}


/* =========================================================
   COPIED
   ========================================================= */

function showCopied(button){

const old=
button.innerHTML;


button.innerHTML=
"✓ Ссылка скопирована!";


button.classList.add(
"copied"
);


setTimeout(()=>{

button.innerHTML=old;

button.classList.remove(
"copied"
);

},1500);

}


/* =========================================================
   VOLUME
   ========================================================= */

function setupVolume(){

const saved=
localStorage.getItem(
"musicVolume"
);


const volume=
saved===null?
1:
parseFloat(saved);


players.forEach(player=>{


player.volume=volume;


player.addEventListener(
"volumechange",
()=>{

localStorage.setItem(
"musicVolume",
player.volume
);


players.forEach(other=>{

if(other!==player){

other.volume=
player.volume;

}

});

}
);

});

}

loadMusic();
