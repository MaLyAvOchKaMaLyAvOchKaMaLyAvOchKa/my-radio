<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    background:
        radial-gradient(circle at 70% 20%,rgba(0,255,170,.045),transparent 35%),

    color:#eee;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:205px;

    background:
        linear-gradient(
            180deg,
            #151719 0%,
            #101214 55%,
            #0d0f10 100%
        );

    border-right:1px solid rgba(255,255,255,.075);

    z-index:100;

    padding:220px 12px 20px;

    box-shadow:
        8px 0 35px rgba(0,0,0,.16);
}

.sidebar-menu{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.sidebar-item{
    position:relative;

    display:flex;
    align-items:center;

    gap:13px;

    min-height:56px;

    padding:10px 14px;

    border-radius:13px;

    color:#aeb2b4;

    font-size:17px;
    font-weight:600;

    cursor:pointer;

    transition:
        background .2s,
        color .2s,
        transform .18s,
        box-shadow .2s;
}

.sidebar-item:hover{
    background:rgba(0,255,170,.045);

    color:#fff;

    transform:translateX(2px);
}

.sidebar-item.active{
    background:
        linear-gradient(
            135deg,
            rgba(0,255,170,.14),
            rgba(0,180,130,.055)
        );

    color:#00ffae;

    box-shadow:
        inset 0 0 0 1px rgba(0,255,170,.12),
        0 5px 20px rgba(0,0,0,.14);
}

.sidebar-item.active::before{
    content:"";

    position:absolute;

    left:-12px;
    top:11px;
    bottom:11px;

    width:3px;

    border-radius:0 5px 5px 0;

    background:#00ffae;

    box-shadow:
        0 0 10px rgba(0,255,170,.45);
}

.sidebar-icon{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:rgba(255,255,255,.035);

    font-size:19px;

    flex:none;

    transition:.2s;
}

.sidebar-item:hover .sidebar-icon{
    background:rgba(0,255,170,.07);
}

.sidebar-item.active .sidebar-icon{
    background:rgba(0,255,170,.10);
}

.sidebar-text{
    line-height:1.15;
}

.sidebar-small{
    display:block;

    margin-top:3px;

    font-size:11px;
    font-weight:400;

    color:#666;
}


/* =========================================================
   MAIN
   ========================================================= */

.main{
    margin-left:205px;
    min-height:100vh;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:50;
    min-height:114px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 30px;
    background:linear-gradient(180deg,rgba(24,25,28,.97),rgba(20,21,23,.94));
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-title{
    margin:0;
    color:#00f7a5;
    font-size:39px;
    font-weight:800;
    letter-spacing:.5px;
    text-align:center;
    text-shadow:
        0 0 10px rgba(0,255,170,.45),
        0 0 25px rgba(0,255,170,.18);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search-wrap{
    position:absolute;
    right:24px;
    top:34px;
}

.search{
    width:252px;
    height:45px;
    border-radius:25px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.24);
    color:#fff;
    outline:none;
    padding:0 18px 0 43px;
    font-size:15px;
    transition:border-color .2s,box-shadow .2s;
}

.search:focus{
    border-color:rgba(0,255,170,.55);
    box-shadow:0 0 15px rgba(0,255,170,.08);
}

.search::placeholder{
    color:#777;
}

.search-icon{
    position:absolute;
    left:16px;
    top:12px;
    color:#aaa;
    font-size:19px;
    pointer-events:none;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content{
    max-width:850px;
    margin:0 auto;
    padding:34px 30px 80px;
}


/* =========================================================
   STATUS
   ========================================================= */

.status{
    text-align:center;
    padding:60px 20px;
    color:#777;
    font-size:17px;
}

.status.loading{
    color:#888;
}

.status.error{
    max-width:700px;
    margin:40px auto;
    padding:30px;
    border:1px solid rgba(255,60,60,.25);
    background:rgba(80,10,10,.16);
    border-radius:14px;
    color:#ff7777;
}

.status.error strong{
    display:block;
    color:#ff4f4f;
    margin-bottom:15px;
    font-size:18px;
}


/* =========================================================
   TRACK
   ========================================================= */

.track{
    background:linear-gradient(
        135deg,
        rgba(31,33,34,.92),
        rgba(21,22,23,.92)
    );

    border:1px solid rgba(255,255,255,.075);
    border-radius:16px;
    padding:17px;
    margin-bottom:13px;

    box-shadow:0 8px 30px rgba(0,0,0,.18);

    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;
}

.track:hover{
    transform:translateY(-1px);

    border-color:rgba(0,255,170,.18);

    box-shadow:
        0 10px 35px rgba(0,0,0,.26);
}

.track-title{
    display:flex;
    align-items:center;
    gap:10px;

    color:#f0f0f0;

    font-size:19px;
    font-weight:600;

    margin-bottom:10px;

    overflow:hidden;
}

.track-icon{
    font-size:25px;
    flex:none;
}

.track-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}


/* =========================================================
   AUDIO
   ========================================================= */

.audio{
    width:100%;
    height:42px;
    display:block;
    margin-bottom:10px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{
    display:flex;
    gap:9px;
}

.btn{
    flex:1;
    min-height:34px;

    border:0;
    border-radius:7px;

    cursor:pointer;

    font-size:15px;
    font-weight:700;

    color:white;

    transition:
        filter .15s,
        transform .1s,
        opacity .15s;
}

.btn:hover{
    filter:brightness(1.08);
}

.btn:active{
    transform:scale(.985);
}

.download-btn{
    background:#00c985;
}

.copy-btn{
    background:#1389d7;
}

.copy-btn.copied{
    background:#00b878;
}

.download-btn{
    text-decoration:none;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    text-align:center;
    color:#777;
    padding:80px 20px;
    font-size:17px;
}


/* =========================================================
   PAGINATION
   ========================================================= */

.pagination{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    flex-wrap:wrap;

    margin-top:30px;
}

.page-btn{
    min-width:40px;
    height:40px;

    padding:0 12px;

    border:1px solid rgba(255,255,255,.1);

    border-radius:8px;

    background:#17191b;

    color:#bbb;

    cursor:pointer;

    font-size:14px;
    font-weight:700;

    transition:.15s;
}

.page-btn:hover{

    color:#00ffae;

}

.page-btn.active{
    background:#00c985;

    color:#fff;

    border-color:#00c985;
}

.page-btn:disabled{

.page-info{
    width:100%;

    text-align:center;

    color:#666;

    font-size:13px;

    margin-bottom:7px;
}

.page-dots{
    color:#666;
    padding:0 3px;

@media(max-width:600px){

/*

/* =========================================================
   НОРМАЛИЗАЦИЯ
   ========================================================= */

function normalizeSearchText(value){
    return String(value||"")
        .toLowerCase()
        .replace(/ё/g,"е")
        .replace(/[^a-zа-я0-9]+/gi,"");
}


/* =========================================================
   УНИКАЛЬНЫЕ ВАРИАНТЫ
   ========================================================= */

function uniqueVariants(values){
    return [...new Set(
        values
            .filter(Boolean)
            .map(v=>normalizeSearchText(v))
            .filter(Boolean)
    )];
}


/* =========================================================
   RU -> EN
   ========================================================= */

function transliterateRuToEn(text){
    let result="";

    for(const char of String(text||"").toLowerCase()){
        result+=
            RU_TO_EN[char]!==undefined
                ?RU_TO_EN[char]
                :char;
    }

    return result;
}


/* =========================================================
   EN -> RU
   ========================================================= */

function transliterateEnToRu(text){
    let result=String(text||"").toLowerCase();

    for(const pair of EN_TO_RU){
        result=result.split(pair[0]).join(pair[1]);
    }

    return result;
}


/* =========================================================
   СОЗДАНИЕ ВАРИАНТОВ
   ========================================================= */

function makeSearchVariants(text){

    const original=String(text||"").toLowerCase();

    const variants=[original];

    variants.push(
        transliterateRuToEn(original)
    );

    variants.push(
        transliterateEnToRu(original)
    );

    const normalized=
        normalizeSearchText(original);

    for(const pair of COMMON_TRANSLITERATIONS){

        const en=
            normalizeSearchText(pair[0]);

        if(normalized.includes(en)){
            variants.push(pair[1]);
        }
    }


    /*
     * Заменяем известные английские слова
     * на русское произношение.
     */

    let commonVersion=original;

    for(const pair of COMMON_TRANSLITERATIONS){

        commonVersion=
            commonVersion
                .split(pair[0])
                .join(pair[1]);

    }

    variants.push(commonVersion);


    /*
     * Также делаем обратную замену русских
     * вариантов на английские.
     */

    let reverseVersion=original;

    for(const pair of COMMON_TRANSLITERATIONS){

        reverseVersion=
            reverseVersion
                .split(pair[1])
                .join(pair[0]);

    }

    variants.push(reverseVersion);


    return uniqueVariants(variants);
}


/* =========================================================
   ПОИСКОВЫЙ ТЕКСТ ТРЕКА
   ========================================================= */

function buildTrackSearchText(track){

    const name=
        removeExtension(
            String(track.name||"")
        );

    return makeSearchVariants(name);
}


/* =========================================================
   ЛЕВЕНШТЕЙН
   ========================================================= */

function levenshtein(a,b){

    a=String(a||"");
    b=String(b||"");

    if(a===b)return 0;

    if(!a.length)return b.length;

    if(!b.length)return a.length;

    let prev=
        Array.from(
            {length:b.length+1},
            (_,i)=>i
        );

    for(let i=1;i<=a.length;i++){

        const cur=[i];

        for(let j=1;j<=b.length;j++){

            const cost=
                a[i-1]===b[j-1]
                    ?0
                    :1;

            cur[j]=Math.min(
                cur[j-1]+1,
                prev[j]+1,
                prev[j-1]+cost
            );

        }

        prev=cur;
    }

    return prev[b.length];
}


/* =========================================================
   FUZZY MATCH
   ========================================================= */

function fuzzyWordMatch(query,text){

    if(!query||!text)
        return false;

    if(text.includes(query))
        return true;

    if(query.length<3)
        return false;

    const words=
        text
            .split(/[\s\-_.,!?()[\]{}]+/)
            .filter(Boolean);

    const candidates=
        words.length
            ?words
            :[text];

    for(const word of candidates){

        const distance=
            levenshtein(
                query,
                word
            );

        if(
            query.length<=4 &&
            distance<=1
        )
            return true;

        if(
            query.length<=7 &&
            distance<=2
        )
            return true;

        if(
            query.length>7 &&
            distance<=Math.max(
                2,
                Math.floor(query.length*.25)
            )
        ){
            return true;
        }

    }

    return false;
}


/* =========================================================
   УЛУЧШЕННОЕ СРАВНЕНИЕ
   ========================================================= */

function smartSearchMatch(track,query){

    const cleanQuery=
        normalizeSearchText(query);

    if(!cleanQuery)
        return true;

    const variants=
        buildTrackSearchText(track);


    /*
     * Обычное совпадение.
     */

    for(const variant of variants){

        if(
            variant.includes(
                cleanQuery
            )
        )
            return true;

        if(
            cleanQuery.length>=3 &&
            cleanQuery.includes(variant)
        )
            return true;

    }


    /*
     * Варианты самого запроса.
     *
     * Например:
     * Дарьяна -> daryana
     * фит -> feat
     * пс -> psy
     */

    const queryVariants=
        makeSearchVariants(query);

    for(const q of queryVariants){

        for(const variant of variants){

            if(
                variant.includes(q)
            )
                return true;

            if(
                fuzzyWordMatch(
                    q,
                    variant
                )
            )
                return true;

        }

    }


    /*
     * Дополнительная проверка отдельных частей запроса.
     *
     * Например пользователь написал:
     * "дарья"
     * а трек называется:
     * "Daryana..."
     */

    const queryParts=
        String(query||"")
            .toLowerCase()
            .split(
                /[\s\-_.,!?()[\]{}]+/
            )
            .filter(
                v=>v.length>=2
            );

    if(queryParts.length>1){

        let matched=0;

        for(const part of queryParts){

            const partVariants=
                makeSearchVariants(part);

            let partFound=false;

            for(const q of partVariants){

                for(const variant of variants){

                    if(
                        variant.includes(q) ||
                        fuzzyWordMatch(
                            q,
                            variant
                        )
                    ){

                        partFound=true;

                        break;
                    }

                }

                if(partFound)
                    break;

            }

            if(partFound)
                matched++;

        }

        if(
            matched===queryParts.length
        )
            return true;

    }

    return false;
}


/* =========================================================
   ЗАГРУЗКА СПИСКА
   ========================================================= */

async function loadMusic(){

    try{

        const response=
            await fetch(
                LIST_URL+
                "?t="+
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        Accept:
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Worker HTTP "+
                response.status
            );

        }


        const data=
            await response.json();


        if(!Array.isArray(data)){

            throw new Error(
                "Worker вернул неправильный JSON"
            );

        }


        tracks=
            data.filter(
                track=>
                    track &&
                    track.id &&
                    track.name
            );


        currentPage=1;

        renderTracks();

    }
    catch(error){

        console.error(
            "Ошибка загрузки музыки:",
            error
        );


        musicList.innerHTML=`

            <div class="status error">

                <strong>
                    🎧 Не удалось загрузить музыку
                </strong>

                <div>
                    Worker HTTP ошибка
                </div>

                <br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

                <br><br>

                <button
                    class="btn download-btn"
                    onclick="loadMusic()"
                    style="
                        max-width:220px;
                        padding:10px 20px
                    "
                >
                    ↻ Повторить
                </button>

            </div>

        `;

    }

}


/* =========================================================
   URL
   ========================================================= */

function getPlayURL(track){

    return (
        WORKER_URL+
        "/music/"+
        encodeURIComponent(track.id)
    );

}


function getDownloadURL(track){

    return (
        getPlayURL(track)+
        "?download=1"
    );

}


/* =========================================================
   AUDIO
   ========================================================= */

function stopAllAudio(exceptAudio=null){

    document
        .querySelectorAll("audio")
        .forEach(audio=>{

            if(audio===exceptAudio)
                return;

            try{

                audio.pause();

                audio.currentTime=0;

            }
            catch(error){}

        });


    if(
        currentAudio &&
        currentAudio!==exceptAudio
    ){

        currentAudio=null;

    }

}


function setupAudio(audio){

    if(!audio)
        return;


    audio.addEventListener(
        "play",
        ()=>{

            if(
                currentAudio &&
                currentAudio!==audio
            ){

                try{

                    currentAudio.pause();

                    currentAudio.currentTime=0;

                }
                catch(error){}

            }


            document
                .querySelectorAll("audio")
                .forEach(other=>{

                    if(
                        other!==audio &&
                        !other.paused
                    ){

                        try{

                            other.pause();

                            other.currentTime=0;

                        }
                        catch(error){}

                    }

                });


            currentAudio=audio;

        }
    );


    audio.addEventListener(
        "ended",
        ()=>{

            if(
                currentAudio===audio
            ){

                currentAudio=null;

            }

        }
    );

}


/* =========================================================
   ОТРИСОВКА
   ========================================================= */

function renderTracks(){

    const query=
        searchInput.value.trim();


    filteredTracks=
        tracks.filter(
            track=>
                smartSearchMatch(
                    track,
                    query
                )
        );


    const totalPages=
        Math.max(
            1,
            Math.ceil(
                filteredTracks.length/
                TRACKS_PER_PAGE
            )
        );


    if(
        currentPage>totalPages
    ){

        currentPage=
            totalPages;

    }


    stopAllAudio();


    if(
        !filteredTracks.length
    ){

        musicList.innerHTML=`

            <div class="empty">
                🎵 Ничего не найдено
            </div>

        `;

        currentAudio=null;

        return;

    }


    const start=
        (currentPage-1)*
        TRACKS_PER_PAGE;


    const pageTracks=
        filteredTracks.slice(
            start,
            start+TRACKS_PER_PAGE
        );


    musicList.innerHTML=
        pageTracks
            .map(createTrackHTML)
            .join("")+
        createPaginationHTML(
            totalPages
        );


    pageTracks.forEach(
        track=>{

            const audio=
                document.getElementById(
                    "audio-"+
                    track.id
                );


            if(audio){

                audio.src=
                    getPlayURL(track);

                setupAudio(audio);

            }

        }
    );

}


/* =========================================================
   КАРТОЧКА ТРЕКА
   ========================================================= */

function createTrackHTML(track){

    const id=
        escapeHTML(
            String(track.id)
        );


    const name=
        escapeHTML(
            removeExtension(
                String(track.name||"")
            )
        );


    return `

        <div
            class="track"
            data-track-id="${id}"
        >

            <div class="track-title">

                <span class="track-icon">
                    🎵
                </span>

                <span class="track-name">
                    ${name}
                </span>

            </div>


            <audio
                id="audio-${id}"
                class="audio"
                controls
                preload="metadata"
            >
                Ваш браузер не поддерживает
                воспроизведение аудио.
            </audio>


            <div class="buttons">

                <a
                    class="btn download-btn"
                    href="${escapeAttribute(
                        getDownloadURL(track)
                    )}"
                    download
                    target="_self"
                >
                    ↓ Скачать MP3
                </a>


                <button
                    class="btn copy-btn"
                    type="button"
                    onclick="copyMusicLink(this,'${escapeJS(
                        getPlayURL(track)
                    )}')"
                >
                    🔗 Копировать ссылку
                </button>

            </div>

        </div>

    `;

}


/* =========================================================
   ПАГИНАЦИЯ
   ========================================================= */

function createPaginationHTML(totalPages){

    if(totalPages<=1)
        return "";


    const start=
        (currentPage-1)*
        TRACKS_PER_PAGE+
        1;


    const end=
        Math.min(
            currentPage*
            TRACKS_PER_PAGE,
            filteredTracks.length
        );


    let html=`

        <div class="pagination">

            <div class="page-info">
                Показано ${start}–${end}
                из ${filteredTracks.length}
            </div>


            <button
                class="page-btn"
                onclick="changePage(${currentPage-1})"
                ${currentPage===1?"disabled":""}
            >
                ←
            </button>

    `;


    const pages=[];


    /*
     * Показываем первые страницы,
     * текущую и последние.
     */

    for(
        let i=1;
        i<=totalPages;
        i++
    ){

        if(
            i===1 ||
            i===totalPages ||
            Math.abs(
                i-currentPage
            )<=2
        ){

            pages.push(i);

        }

    }


    let previous=0;


    for(const page of pages){

        if(
            previous &&
            page-previous>1
        ){

            html+=`
                <span class="page-dots">
                    ...
                </span>
            `;

        }


        html+=`

            <button
                class="page-btn ${
                    page===currentPage
                        ?"active"
                        :""
                }"
                onclick="changePage(${page})"
            >
                ${page}
            </button>

        `;


        previous=page;

    }


    html+=`

            <button
                class="page-btn"
                onclick="changePage(${currentPage+1})"
                ${
                    currentPage===totalPages
                        ?"disabled"
                        :""
                }
            >
                →
            </button>

        </div>

    `;


    return html;

}


function changePage(page){

    const totalPages=
        Math.max(
            1,
            Math.ceil(
                filteredTracks.length/
                TRACKS_PER_PAGE
            )
        );


    if(
        page<1 ||
        page>totalPages
    )
        return;


    currentPage=page;


    renderTracks();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   КОПИРОВАНИЕ
   ========================================================= */

async function copyMusicLink(button,url){

    const oldText=
        button.textContent;


    try{

        await navigator.clipboard
            .writeText(url);


        button.textContent=
            "✓ Ссылка скопирована";


        button.classList.add(
            "copied"
        );


        setTimeout(
            ()=>{

                button.textContent=
                    oldText;

                button.classList.remove(
                    "copied"
                );

            },
            1800
        );

    }
    catch(error){

        const textarea=
            document.createElement(
                "textarea"
            );


        textarea.value=url;

        textarea.style.position=
            "fixed";

        textarea.style.left=
            "-9999px";

        textarea.style.top=
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success=false;


        try{

            success=
                document.execCommand(
                    "copy"
                );

        }
        catch(e){

            success=false;

        }


        textarea.remove();


        if(success){

            button.textContent=
                "✓ Ссылка скопирована";

            button.classList.add(
                "copied"
            );


            setTimeout(
                ()=>{

                    button.textContent=
                        oldText;

                    button.classList.remove(
                        "copied"
                    );

                },
                1800
            );

        }
        else{

            window.prompt(
                "Скопируй эту ссылку:",
                url
            );

        }

    }

}

/* =========================================================
   УДАЛЕНИЕ .MP3
   ========================================================= */

function removeExtension(name){

    return name.replace(
        /\.mp3$/i,
        ""
    );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\r/g,
            "\\r"
        )

        .replace(
            /\n/g,
            "\\n"
        );

}
