<script>

/* ==============================
   НАСТРОЙКИ
================================ */

const REPO_API=
"https://api.github.com/repos/malyavochkamalyavochkamalyavochka/my-radio/contents/Music";

const MUSIC_FOLDER="Music/";

const BASE=
"https://malyavochkamalyavochkamalyavochka.github.io/my-radio/Music/";

/* Кэш списка музыки */

const CACHE_KEY="malya_music_cache_v2";

/* Через сколько проверять GitHub */

const CACHE_TIME=5*60*1000;


/* ==============================
   ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
================================ */

let songs=[];
let players=[];
let currentAudio=null;

let audioCtx=null;
let raf=null;

const sourceMap=new WeakMap();


/* ==============================
   ЗАПУСК
================================ */

loadMusic();


/* ==============================
   ЗАГРУЗКА МУЗЫКИ
================================ */

async function loadMusic(){

const loading=
document.getElementById("loading");

const error=
document.getElementById("error");

try{

/*
   СНАЧАЛА МГНОВЕННО
   ПОКАЗЫВАЕМ КЭШ
*/

const cached=
localStorage.getItem(CACHE_KEY);

if(cached){

try{

const data=
JSON.parse(cached);

if(
Array.isArray(data.files)&&
data.files.length
){

renderMusic(data.files);

loading.style.display="none";

/*
   Если кэш свежий —
   сразу показываем музыку
   и вообще не ждём GitHub.
*/

if(
Date.now()-data.time<CACHE_TIME
){

updateMusicInBackground();
return;

}

}

}catch(e){

console.log("Кэш повреждён");

}

}


/*
   ПЕРВИЧНАЯ ЗАГРУЗКА
*/

const response=
await fetch(
REPO_API+
"?t="+Date.now(),
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"GitHub API: "+response.status
);

}

const files=
await response.json();


const musicFiles=
files
.filter(file=>
file.type==="file"&&
file.name
.toLowerCase()
.endsWith(".mp3")
)
.map(file=>file.name)
.sort((a,b)=>
a.localeCompare(
b,
"ru",
{
numeric:true,
sensitivity:"base"
}
));


/*
   СОХРАНЯЕМ СПИСОК
*/

localStorage.setItem(
CACHE_KEY,
JSON.stringify({
time:Date.now(),
files:musicFiles
})
);


/*
   РИСУЕМ МУЗЫКУ
*/

renderMusic(musicFiles);

}catch(e){

console.error(e);

if(!songs.length){

loading.style.display="none";

error.style.display="block";

error.innerHTML=
"<b>🎧 Музыка куда-то сбежала...</b><br><br>"+
"МаЛяВоЧка не смогла получить список треков 😔<br>"+
"Попробуй обновить страницу через несколько секунд.";

}

}

}


/* ==============================
   ФОНОВАЯ ПРОВЕРКА
================================ */

async function updateMusicInBackground(){

try{

const response=
await fetch(
REPO_API+
"?t="+Date.now(),
{
cache:"no-store"
}
);

if(!response.ok)return;

const files=
await response.json();


const musicFiles=
files
.filter(file=>
file.type==="file"&&
file.name
.toLowerCase()
.endsWith(".mp3")
)
.map(file=>file.name)
.sort((a,b)=>
a.localeCompare(
b,
"ru",
{
numeric:true,
sensitivity:"base"
}
));


const old=
localStorage.getItem(
CACHE_KEY
);

let oldFiles=[];

if(old){

try{

oldFiles=
JSON.parse(old).files||[];

}catch(e){}

}


/*
   ЕСЛИ ДОБАВИЛАСЬ НОВАЯ ПЕСНЯ
   ПЕРЕРИСОВЫВАЕМ КАТАЛОГ
*/

if(
JSON.stringify(oldFiles)!==
JSON.stringify(musicFiles)
){

localStorage.setItem(
CACHE_KEY,
JSON.stringify({
time:Date.now(),
files:musicFiles
})
);

renderMusic(musicFiles);

}

}catch(e){

console.log(
"Фоновая проверка недоступна"
);

}

}


/* ==============================
   СОЗДАНИЕ КАТАЛОГА
================================ */

function renderMusic(musicFiles){

const container=
document.getElementById(
"songsContainer"
);

const loading=
document.getElementById(
"loading"
);

container.innerHTML="";


musicFiles.forEach(
fileName=>{
createSong(
fileName,
container
);
}
);


songs=[
...document.querySelectorAll(
".song"
)
];

players=[
...document.querySelectorAll(
"audio"
)
];


if(musicFiles.length){

loading.style.display="none";

}else{

loading.style.display="block";

loading.innerHTML=
'В папке <span>Music</span> пока нет MP3 🎵';

}


setupPlayers();
setupVolume();
setupSearch();

}


/* ==============================
   СОЗДАНИЕ ПЕСНИ
================================ */

function createSong(
fileName,
container
){

let title=
fileName.replace(
/\.mp3$/i,
""
);

try{

title=
decodeURIComponent(title);

}catch(e){}


/*
   Убираем "_" и "-"
   для нормального поиска
*/

const searchText=
title
.replace(/[_\-]+/g," ")
.replace(/\s+/g," ")
.trim();


const fileURL=
MUSIC_FOLDER+
encodeURIComponent(fileName);

const fullURL=
BASE+
encodeURIComponent(fileName);


const song=
document.createElement("div");

song.className="song";


/*
   ВАЖНО:

   Сохраняем несколько вариантов
   названия для поиска.
*/

song.dataset.search=
makeSearchText(searchText);


song.innerHTML=`

<div class="title">

<span class="music-icon">
🎵
</span>

<span title="${escapeHTML(title)}">
${escapeHTML(title)}
</span>

<canvas
class="fft"
width="440"
height="96"
></canvas>

</div>


<audio
controls
preload="none"
>

<source
src="${fileURL}"
type="audio/mpeg"
>

</audio>


<div class="buttons">

<a
class="btn download"
href="${fileURL}"
download
>
↓ Скачать MP3
</a>


<button
class="btn copy"
>
🔗 Копировать ссылку
</button>

</div>

`;


song
.querySelector(".copy")
.addEventListener(
"click",
()=>{

copyLink(
song.querySelector(".copy"),
fullURL
);

}
);


container.appendChild(song);

}


/* ==============================
   HTML SAFE
================================ */

function escapeHTML(text){

return text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==============================
   РУССКИЙ → АНГЛИЙСКИЙ
================================ */

const translitMap={

"а":"a",
"б":"b",
"в":"v",
"г":"g",
"д":"d",
"е":"e",
"ё":"yo",
"ж":"zh",
"з":"z",
"и":"i",
"й":"y",
"к":"k",
"л":"l",
"м":"m",
"н":"n",
"о":"o",
"п":"p",
"р":"r",
"с":"s",
"т":"t",
"у":"u",
"ф":"f",
"х":"h",
"ц":"c",
"ч":"ch",
"ш":"sh",
"щ":"shch",
"ъ":"",
"ы":"y",
"ь":"",
"э":"e",
"ю":"yu",
"я":"ya"

};


/* ==============================
   ТРАНСЛИТ
================================ */

function transliterate(text){

return text
.toLowerCase()
.split("")
.map(char=>
translitMap[char]!==undefined
?translitMap[char]
:char
)
.join("");

}


/* ==============================
   НОРМАЛИЗАЦИЯ
================================ */

function normalizeSearch(text){

return text
.toLowerCase()
.replace(/ё/g,"е")
.replace(/й/g,"и")
.replace(
/[^a-zа-я0-9\s]/gi,
" "
)
.replace(/\s+/g," ")
.trim();

}


/* ==============================
   ПОИСКОВЫЙ ТЕКСТ
================================ */

function makeSearchText(text){

const normal=
normalizeSearch(text);

const translit=
transliterate(normal);

return(
normal+
" "+
translit
)
.replace(/\s+/g," ")
.trim();

}


/* ==============================
   РАССТОЯНИЕ МЕЖДУ СЛОВАМИ
   ДЛЯ НЕИДЕАЛЬНОГО ПОИСКА
================================ */

function levenshtein(a,b){

if(a===b)return 0;

if(!a.length)return b.length;
if(!b.length)return a.length;

const matrix=[];

for(
let i=0;
i<=b.length;
i++
){

matrix[i]=[i];

}

for(
let j=0;
j<=a.length;
j++
){

matrix[0][j]=j;

}

for(
let i=1;
i<=b.length;
i++
){

for(
let j=1;
j<=a.length;
j++
){

if(
b.charAt(i-1)===
a.charAt(j-1)
){

matrix[i][j]=
matrix[i-1][j-1];

}else{

matrix[i][j]=
Math.min(
matrix[i-1][j-1]+1,
matrix[i][j-1]+1,
matrix[i-1][j]+1
);

}

}

}

return matrix[b.length][a.length];

}


/* ==============================
   НЕТОЧНОЕ СОВПАДЕНИЕ
================================ */

function fuzzyWordMatch(
word,
text
){

if(!word)return true;

if(text.includes(word)){
return true;
}


/*
   Проверяем каждое слово
   в названии отдельно.
*/

const textWords=
text.split(/\s+/);


for(
const target of textWords
){

if(
target.startsWith(word)||
word.startsWith(target)
){

return true;

}


/*
   Для коротких слов
   нужна большая точность.
*/

if(word.length>=4){

const distance=
levenshtein(
word,
target
);

const maxDistance=
word.length<=5
?1
:2;

if(distance<=maxDistance){
return true;
}

}

}

return false;

}


/* ==============================
   ПОИСК
================================ */

function setupSearch(){

const input=
document.getElementById(
"searchInput"
);

const noResults=
document.getElementById(
"noResults"
);


/*
   oninput вместо addEventListener,
   чтобы повторная перерисовка каталога
   не создавала несколько обработчиков.
*/

input.oninput=function(){

const query=
makeSearchText(
this.value
);

const words=
query
.split(" ")
.filter(Boolean);


let found=0;


songs.forEach(song=>{

const text=
song.dataset.search;


const visible=
!words.length||
words.every(word=>
fuzzyWordMatch(
word,
text
)
);


song.classList.toggle(
"hidden",
!visible
);


if(visible){
found++;
}

});


noResults.style.display=
found===0&&words.length
?"block"
:"none";

};

}


/* ==============================
   ОСТАНОВКА ДРУГИХ ПЕСЕН
================================ */

function pauseOthers(current){

players.forEach(player=>{

if(player!==current){

player.pause();

player.currentTime=0;

const oldSong=
player.closest(".song");

if(oldSong){

oldSong.classList.remove(
"playing"
);

clearFFT(oldSong);

}

}

});


currentAudio=current;


const currentSong=
current.closest(".song");

if(currentSong){

currentSong.classList.add(
"playing"
);

}


const saved=
localStorage.getItem(
"musicVolume"
);


if(saved!==null){

current.volume=
parseFloat(saved);

}

}


/* ==============================
   AUDIO CONTEXT
================================ */

function getAudioContext(){

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

return audioCtx;

}


/* ==============================
   ANALYSER
================================ */

function setupAudio(audio){

if(
sourceMap.has(audio)
){

return sourceMap.get(audio);

}


const ctx=
getAudioContext();


const source=
ctx.createMediaElementSource(
audio
);


const analyser=
ctx.createAnalyser();


analyser.fftSize=1024;

analyser.smoothingTimeConstant=.28;

analyser.minDecibels=-95;

analyser.maxDecibels=-8;


source.connect(analyser);

analyser.connect(
ctx.destination
);


const result={
source,
analyser
};


sourceMap.set(
audio,
result
);


return result;

}


/* ==============================
   ОЧИСТКА FFT
================================ */

function clearFFT(song){

if(!song)return;

const canvas=
song.querySelector(".fft");

if(!canvas)return;

canvas
.getContext("2d")
.clearRect(
0,
0,
canvas.width,
canvas.height
);

}


/* ==============================
   FFT
================================ */

function startFFT(audio){

if(raf){

cancelAnimationFrame(raf);

raf=null;

}


songs.forEach(song=>{

if(
song!==audio.closest(".song")
){

song.classList.remove(
"playing"
);

clearFFT(song);

}

});


let analyser;


try{

const ctx=
getAudioContext();


if(
ctx.state==="suspended"
){

ctx.resume();

}


analyser=
setupAudio(audio).analyser;


}catch(e){

return;

}


const song=
audio.closest(".song");

const canvas=
song.querySelector(".fft");

const ctx=
canvas.getContext("2d");

const data=
new Uint8Array(
analyser.frequencyBinCount
);


const bars=38;

const values=
new Float32Array(bars);


function draw(){

if(
audio!==currentAudio||
audio.paused||
audio.ended||
!song.classList.contains("playing")
){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

return;

}


analyser.getByteFrequencyData(
data
);


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const gap=3;

const bw=
(
canvas.width-
gap*(bars-1)
)/bars;


const time=
performance.now();


for(
let i=0;
i<bars;
i++
){

const t=
i/(bars-1);


let minBin=
Math.floor(
2*
Math.pow(
(data.length-2)/2,
t
)
);


let maxBin=
Math.floor(
3*
Math.pow(
(data.length-2)/3,
t
)
);


if(
maxBin<=minBin
){

maxBin=
minBin+1;

}


let sum=0;

let count=0;


for(
let j=minBin;
j<=maxBin&&j<data.length;
j++
){

const weight=
1-
Math.abs(
j-
(minBin+maxBin)/2
)/
(maxBin-minBin+1);


sum+=
data[j]*
(.65+weight);


count+=
.65+weight;

}


let value=
count
?sum/count/255
:0;


value=
Math.pow(
value,
.48
);


value*=
.9+t*.8;


value+=
Math.sin(
time*.012+i*1.7
)*.012;


if(
value>values[i]
){

values[i]+=
(value-values[i])*.72;

}else{

values[i]+=
(value-values[i])*.34;

}


const floor=
.025+
Math.sin(
time*.006+i*.9
)*.008;


const finalValue=
Math.max(
values[i],
floor
);


const h=
Math.max(
2,
finalValue*
canvas.height*
.94
);


const x=
i*(bw+gap);


const y=
canvas.height-h;


const grad=
ctx.createLinearGradient(
0,
y,
0,
canvas.height
);


grad.addColorStop(
0,
"#00ff88"
);

grad.addColorStop(
.45,
"#00ed91"
);

grad.addColorStop(
1,
"#00a96b"
);


ctx.fillStyle=grad;

ctx.globalAlpha=.95;


ctx.fillRect(
Math.round(x),
Math.round(y),
Math.max(
1,
Math.round(bw)
),
Math.round(h)
);

}


ctx.globalAlpha=1;


raf=
requestAnimationFrame(
draw
);

}


draw();

}


/* ==============================
   AUDIO EVENTS
================================ */

function setupPlayers(){

players.forEach(player=>{

player.addEventListener(
"play",
()=>{

pauseOthers(player);

startFFT(player);

}
);


player.addEventListener(
"pause",
()=>{

if(
player===currentAudio
){

const song=
player.closest(".song");


if(song){

song.classList.remove(
"playing"
);

clearFFT(song);

}


if(raf){

cancelAnimationFrame(raf);

raf=null;

}

}

}
);


player.addEventListener(
"ended",
()=>{

if(
player===currentAudio
){

const song=
player.closest(".song");


if(song){

song.classList.remove(
"playing"
);

clearFFT(song);

}


if(raf){

cancelAnimationFrame(
raf
);

raf=null;

}


currentAudio=null;

}

}
);

});

}


/* ==============================
   КОПИРОВАНИЕ ССЫЛКИ
================================ */

function copyLink(
button,
link
){

navigator.clipboard
.writeText(link)
.then(()=>{

showCopied(button);

})
.catch(()=>{

const input=
document.createElement(
"input"
);

input.value=link;

document.body.appendChild(
input
);

input.select();

document.execCommand(
"copy"
);

document.body.removeChild(
input
);

showCopied(button);

});

}


/* ==============================
   COPIED
================================ */

function showCopied(button){

const old=
button.innerHTML;


button.innerHTML=
"✓ Ссылка скопирована!";


button.classList.add(
"copied"
);


setTimeout(()=>{

button.innerHTML=old;

button.classList.remove(
"copied"
);

},1500);

}


/* ==============================
   ГРОМКОСТЬ
================================ */

function setupVolume(){

const saved=
localStorage.getItem(
"musicVolume"
);


const volume=
saved===null
?1
:parseFloat(saved);


players.forEach(player=>{

player.volume=volume;


player.addEventListener(
"volumechange",
()=>{

localStorage.setItem(
"musicVolume",
player.volume
);


players.forEach(other=>{

if(
other!==player
){

other.volume=
player.volume;

}

});

}

);

});

}
